        // =========================================================================
        // 24H CENSUS & MORNING PASSOVER VIEW (8AM–8AM)
        // =========================================================================
        const CensusView = ({
            deliveries,
            currentTime,
            canManageLR,
            onOpenDirectDelivery,
            onEditDelivery,
            onCopySummary
        }) => {
            const [period, setPeriod] = React.useState('LIVE');
            const { liveStart, liveEnd, prevStart, prevEnd } = getCensusWindows(currentTime);
            const activeStart = period === 'LIVE' ? liveStart : prevStart;
            const activeEnd = period === 'LIVE' ? liveEnd : prevEnd;

            const filtered = React.useMemo(() => {
                return deliveries
                    .filter(d => {
                        const dt = parseLocalDateTime(d.deliveryTime);
                        return dt && dt.getTime() >= activeStart.getTime() && dt.getTime() < activeEnd.getTime();
                    })
                    .sort((a, b) => {
                        const ta = parseLocalDateTime(a.deliveryTime)?.getTime() || 0;
                        const tb = parseLocalDateTime(b.deliveryTime)?.getTime() || 0;
                        return tb - ta;
                    });
            }, [deliveries, activeStart, activeEnd]);

            const modeCounts = { SVD: 0, VAD: 0, Forceps: 0, Breech: 0, EMLSCS: 0, ELLSCS: 0, BBA: 0 };
            const indicationCounts = {};
            let pphCount = 0;
            let massivePphCount = 0;
            let msbCount = 0;
            let fsbCount = 0;
            let scnCount = 0;
            let nicuCount = 0;

            filtered.forEach(d => {
                const m = normalizeMode(d.deliveryMode);
                modeCounts[m] = (modeCounts[m] || 0) + 1;
                if (isLSCSMode(m)) {
                    const ind = (d.lscsIndication || 'Unspecified').trim();
                    indicationCounts[ind] = (indicationCounts[ind] || 0) + 1;
                }
                const pph = classifyPPH(m, d.ebl);
                if (pph.level === 'MASSIVE') massivePphCount += 1;
                else if (pph.level === 'PPH') pphCount += 1;

                if (d.birthOutcome === 'MSB') msbCount += 1;
                else if (d.birthOutcome === 'FSB') fsbCount += 1;
                else if (d.babyDisposition === 'Admit SCN') scnCount += 1;
                else if (d.babyDisposition === 'Admit NICU') nicuCount += 1;
            });

            const total = filtered.length;
            const totalLSCS = modeCounts.EMLSCS + modeCounts.ELLSCS;
            const lscsRate = total > 0 ? ((totalLSCS / total) * 100).toFixed(1) : '0.0';
            const totalVaginal = modeCounts.SVD + modeCounts.VAD + modeCounts.Forceps + modeCounts.Breech + modeCounts.BBA;
            const sortedIndications = Object.entries(indicationCounts).sort((a, b) => b[1] - a[1]);

            const handleCopyWhatsApp = () => {
                const headerTitle = period === 'LIVE' ? '📊 *LR LIVE 24H CENSUS*' : '📊 *LR PREVIOUS 24H CENSUS*';
                const lines = [
                    headerTitle,
                    `Window: ${formatWindowLabel(activeStart, activeEnd)}`,
                    `Hospital Tengku Permaisuri Norashikin`,
                    ``,
                    `*Total Deliveries:* ${total}`,
                    `• Vaginal: ${totalVaginal} (SVD ${modeCounts.SVD}, VAD ${modeCounts.VAD}, Forceps ${modeCounts.Forceps}, Breech ${modeCounts.Breech}${modeCounts.BBA ? `, BBA ${modeCounts.BBA}` : ''})`,
                    `• LSCS: ${totalLSCS} (${lscsRate}%) — EMLSCS ${modeCounts.EMLSCS}, ELLSCS ${modeCounts.ELLSCS}`,
                    `• PPH: ${pphCount} | Massive PPH (>1.5L): ${massivePphCount}`,
                    `• Neonatal: SCN ${scnCount} | NICU ${nicuCount} | Stillbirth: ${msbCount + fsbCount} (MSB ${msbCount}, FSB ${fsbCount})`
                ];
                if (sortedIndications.length > 0) {
                    lines.push(``, `*LSCS Indications:*`);
                    sortedIndications.forEach(([ind, cnt]) => lines.push(`- ${ind}: ${cnt}`));
                }
                onCopySummary(lines.join('\n'));
            };

            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 max-w-7xl mx-auto w-full space-y-5">
                    {/* Top Controls */}
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-2 bg-slate-200/70 dark:bg-slate-800 p-1 rounded-2xl">
                            <button
                                onClick={() => setPeriod('LIVE')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${period === 'LIVE' ? 'bg-white dark:bg-slate-900 text-teal-700 dark:text-teal-400 shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                Live 24h (8am–8am)
                            </button>
                            <button
                                onClick={() => setPeriod('PREV')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${period === 'PREV' ? 'bg-white dark:bg-slate-900 text-teal-700 dark:text-teal-400 shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                Previous 24h
                            </button>
                        </div>

                        <div className="flex items-center gap-2 flex-wrap">
                            <button
                                onClick={handleCopyWhatsApp}
                                className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-sm transition flex items-center gap-1.5"
                            >
                                <i className="ph-bold ph-whatsapp-logo text-base"></i> Copy WhatsApp Summary
                            </button>
                            {canManageLR && (
                                <button
                                    onClick={onOpenDirectDelivery}
                                    className="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shadow-sm transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i> Log Direct Delivery / LSCS
                                </button>
                            )}
                        </div>
                    </div>

                    <p className="text-xs font-mono text-slate-500 dark:text-slate-400">
                        Window: <strong className="text-slate-700 dark:text-slate-200">{formatWindowLabel(activeStart, activeEnd)}</strong>
                    </p>

                    {/* KPI Strip */}
                    <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                            <p className="text-[10px] font-bold uppercase text-slate-400">Total Deliveries</p>
                            <p className="text-3xl font-mono font-extrabold text-slate-900 dark:text-white mt-1">{total}</p>
                        </div>
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                            <p className="text-[10px] font-bold uppercase text-slate-400">Vaginal</p>
                            <p className="text-3xl font-mono font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">{totalVaginal}</p>
                            <p className="text-[10px] text-slate-500 mt-1">SVD {modeCounts.SVD} • VAD {modeCounts.VAD} • F {modeCounts.Forceps}</p>
                        </div>
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                            <p className="text-[10px] font-bold uppercase text-slate-400">LSCS ({lscsRate}%)</p>
                            <p className="text-3xl font-mono font-extrabold text-rose-600 dark:text-rose-400 mt-1">{totalLSCS}</p>
                            <p className="text-[10px] text-slate-500 mt-1">EM {modeCounts.EMLSCS} • EL {modeCounts.ELLSCS}</p>
                        </div>
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                            <p className="text-[10px] font-bold uppercase text-slate-400">PPH / Massive</p>
                            <p className="text-3xl font-mono font-extrabold text-amber-600 dark:text-amber-400 mt-1">
                                {pphCount} <span className="text-rose-600">/ {massivePphCount}</span>
                            </p>
                            <p className="text-[10px] text-slate-500 mt-1">Massive &gt;1500mL</p>
                        </div>
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 col-span-2 lg:col-span-1">
                            <p className="text-[10px] font-bold uppercase text-slate-400">Neonatal / IUD</p>
                            <p className="text-lg font-mono font-extrabold text-slate-800 dark:text-slate-100 mt-1">
                                SCN {scnCount} • NICU {nicuCount}
                            </p>
                            <p className="text-[10px] text-rose-600 dark:text-rose-400 font-semibold mt-1">
                                Stillbirth: {msbCount + fsbCount} (MSB {msbCount}, FSB {fsbCount})
                            </p>
                        </div>
                    </div>

                    {/* LSCS Indications Summary */}
                    {sortedIndications.length > 0 && (
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                            <h3 className="text-xs font-extrabold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2.5">
                                LSCS Indications Breakdown
                            </h3>
                            <div className="flex flex-wrap gap-2">
                                {sortedIndications.map(([ind, cnt]) => (
                                    <span key={ind} className="px-3 py-1 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-xs font-semibold text-rose-700 dark:text-rose-300">
                                        {ind} <strong className="font-mono ml-1">×{cnt}</strong>
                                    </span>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Delivery Log Table */}
                    <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 text-[10px] font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                        <th className="py-3 px-4">Time</th>
                                        <th className="py-3 px-4">Patient</th>
                                        <th className="py-3 px-4">Source</th>
                                        <th className="py-3 px-4">Mode &amp; Indication</th>
                                        <th className="py-3 px-4">EBL / PPH</th>
                                        <th className="py-3 px-4">Baby &amp; Outcome</th>
                                        {canManageLR && <th className="py-3 px-4 text-right">Action</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                                    {filtered.length === 0 ? (
                                        <tr>
                                            <td colSpan={canManageLR ? 7 : 6} className="py-10 text-center text-slate-400">
                                                No deliveries recorded in this 24-hour window yet.
                                            </td>
                                        </tr>
                                    ) : (
                                        filtered.map(item => {
                                            const mode = normalizeMode(item.deliveryMode);
                                            const pph = classifyPPH(mode, item.ebl);
                                            const apgarDisp = item.apgar || ((item.apgar1 !== '' && item.apgar1 !== undefined) || (item.apgar5 !== '' && item.apgar5 !== undefined) ? `${item.apgar1 ?? ''}/${item.apgar5 ?? ''}` : '');
                                            return (
                                                <tr key={item.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                                                    <td className="py-3 px-4 font-mono font-bold text-slate-700 dark:text-slate-200 whitespace-nowrap">
                                                        {formatTimeShort(item.deliveryTime)}
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <p className="font-bold text-slate-900 dark:text-white">{item.name}</p>
                                                        <p className="text-[10px] font-mono text-slate-500">
                                                            {item.ic}{item.gravida ? ` • G${item.gravida}P${item.para ?? 0}` : ''}{item.race ? ` • ${item.race}` : ''}
                                                        </p>
                                                    </td>
                                                    <td className="py-3 px-4 text-[11px] font-semibold text-slate-600 dark:text-slate-300 whitespace-nowrap">
                                                        {item.assignedBed || item.source || item.location || 'LR'}
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <span className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold ${isLSCSMode(mode) ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300'}`}>
                                                            {mode}
                                                        </span>
                                                        {item.lscsIndication && (
                                                            <p className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">{item.lscsIndication}</p>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap">
                                                        {item.ebl ? (
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="font-mono font-bold">{item.ebl}mL</span>
                                                                {pph.level !== 'NONE' && (
                                                                    <span className={`px-1.5 py-0.5 rounded text-[10px] ${pph.badgeClass}`}>{pph.label}</span>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-400">—</span>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap text-[11px] text-slate-600 dark:text-slate-300">
                                                        {item.birthOutcome || item.babyGender || item.birthWeight || apgarDisp || item.dcc || item.babyDisposition ? (
                                                            <div className="space-y-1">
                                                                <div className="flex flex-wrap items-center gap-1">
                                                                    {(item.birthOutcome === 'MSB' || item.birthOutcome === 'FSB') && (
                                                                        <span className="px-1.5 py-0.5 rounded font-extrabold text-[10px] bg-rose-600 text-white">
                                                                            IUD • {item.birthOutcome}
                                                                        </span>
                                                                    )}
                                                                    {item.babyGender && (
                                                                        <span className={`px-1.5 py-0.5 rounded font-bold text-[10px] ${item.babyGender === 'Boy' ? 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300' : item.babyGender === 'Girl' ? 'bg-pink-100 text-pink-700 dark:bg-pink-900/50 dark:text-pink-300' : 'bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300'}`}>
                                                                            {item.babyGender}
                                                                        </span>
                                                                    )}
                                                                    {item.birthWeight !== undefined && item.birthWeight !== '' && (
                                                                        <span className="font-mono font-semibold">{item.birthWeight}kg</span>
                                                                    )}
                                                                    {item.birthOutcome !== 'MSB' && item.birthOutcome !== 'FSB' && apgarDisp && (
                                                                        <span className="font-mono text-slate-500">Apgar {apgarDisp}</span>
                                                                    )}
                                                                    {item.birthOutcome !== 'MSB' && item.birthOutcome !== 'FSB' && item.dcc && (
                                                                        <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${item.dcc === 'Yes' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300' : 'bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-400'}`}>
                                                                            DCC:{item.dcc}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                {item.birthOutcome !== 'MSB' && item.birthOutcome !== 'FSB' && (item.babyDisposition === 'Admit SCN' || item.babyDisposition === 'Admit NICU') && (
                                                                    <div className="flex flex-wrap items-center gap-1">
                                                                        <span className={`px-1.5 py-0.5 rounded text-[10px] font-extrabold text-white ${item.babyDisposition === 'Admit NICU' ? 'bg-rose-600' : 'bg-amber-500'}`}>
                                                                            {item.babyDisposition}{item.respSupport ? ` (${item.respSupport})` : ''}
                                                                        </span>
                                                                        {item.nicuDx && (
                                                                            <span className="text-[10px] font-semibold text-slate-700 dark:text-slate-300">
                                                                                {item.nicuDx}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-400">—</span>
                                                        )}
                                                    </td>
                                                    {canManageLR && (
                                                        <td className="py-3 px-4 text-right">
                                                            <button
                                                                onClick={() => onEditDelivery(item)}
                                                                className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-teal-100 dark:hover:bg-teal-900/50 text-slate-700 dark:text-slate-200 text-[11px] font-bold transition"
                                                            >
                                                                Edit
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION
        // =========================================================================
        const App = () => {
            const [userRole, setUserRole] = React.useState(null);
            const [activeView, setActiveView] = React.useState('BOARD');
            const [mobileTab, setMobileTab] = React.useState('QUEUE');
            const [queueFilter, setQueueFilter] = React.useState('ALL');
            const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('lr_dark_mode') === 'true');
            const [tvMode, setTvMode] = React.useState(false);
            const [muted, setMuted] = React.useState(false);

            const [patients, setPatients] = React.useState([]);
            const [censusDeliveries, setCensusDeliveries] = React.useState([]);
            const [isLoadingData, setIsLoadingData] = React.useState(false);
            const [lastSyncedAt, setLastSyncedAt] = React.useState(null);
            const [currentTime, setCurrentTime] = React.useState(Date.now());

            const [customIndications, setCustomIndications] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('lr_custom_lscs_indications');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [customNicuDx, setCustomNicuDx] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('lr_custom_nicu_dx');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [passwords, setPasswords] = React.useState({
                LR: 'lr123',
                PAC: 'pac123',
                '7A': '7a123',
                '7B': '7b123',
                Admin: 'admin123'
            });

            // Modals & Drawers
            const [isBookingModalOpen, setIsBookingModalOpen] = React.useState(false);
            const [updateModalPatient, setUpdateModalPatient] = React.useState(null);
            const [assignModalState, setAssignModalState] = React.useState(null);
            const [deliverModalPatient, setDeliverModalPatient] = React.useState(null);
            const [isDirectDeliveryOpen, setIsDirectDeliveryOpen] = React.useState(false);
            const [isPasswordModalOpen, setIsPasswordModalOpen] = React.useState(false);

            // Alerts & Toasts
            const [toast, setToast] = React.useState(null);
            const [flashAlert, setFlashAlert] = React.useState(null);
            const [flashingIds, setFlashingIds] = React.useState({});
            const prevPatientsRef = React.useRef(null);
            const flashTimerRef = React.useRef(null);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                try { localStorage.setItem('lr_dark_mode', String(darkMode)); } catch (e) {}
            }, [darkMode]);

            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 30000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3800);
            };

            const triggerFlashAlert = (type, message, patientIds = []) => {
                playAlertSound(type, muted);
                setFlashAlert({ type, message });
                const idMap = {};
                patientIds.forEach(id => { idMap[id] = type === 'new_booking' ? 'new' : type; });
                setFlashingIds(idMap);
                if (flashTimerRef.current) clearTimeout(flashTimerRef.current);
                flashTimerRef.current = setTimeout(() => {
                    setFlashAlert(null);
                    setFlashingIds({});
                }, 15000);
            };

            const isSameWard = (loc, role) => {
                if (!loc || !role) return false;
                return String(loc).trim().toUpperCase() === String(role).trim().toUpperCase();
            };

            const fetchBoardData = React.useCallback(async (isInitial = false) => {
                try {
                    const res = await fetch(API_URL);
                    const data = await res.json();
                    const incomingPatients = Array.isArray(data) ? data : (data.patients || []);
                    setPatients(incomingPatients);
                    setLastSyncedAt(Date.now());

                    if (!Array.isArray(data)) {
                        if (data.passwords) setPasswords(prev => ({ ...prev, ...data.passwords }));
                        if (Array.isArray(data.censusDeliveries)) setCensusDeliveries(data.censusDeliveries);
                        if (Array.isArray(data.learnedIndications) && data.learnedIndications.length > 0) {
                            setCustomIndications(prev => {
                                const map = new Map();
                                [...prev, ...data.learnedIndications].forEach(ind => {
                                    const clean = String(ind || '').trim();
                                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                                });
                                const merged = Array.from(map.values());
                                try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(merged)); } catch (e) {}
                                return merged;
                            });
                        }
                        if (Array.isArray(data.learnedNicuDx) && data.learnedNicuDx.length > 0) {
                            setCustomNicuDx(prev => {
                                const map = new Map();
                                [...prev, ...data.learnedNicuDx].forEach(dx => {
                                    const clean = String(dx || '').trim();
                                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                                });
                                const merged = Array.from(map.values());
                                try { localStorage.setItem('lr_custom_nicu_dx', JSON.stringify(merged)); } catch (e) {}
                                return merged;
                            });
                        }
                    }

                    // Cross-device alert detection on background polls
                    if (!isInitial && prevPatientsRef.current && userRole) {
                        const prevMap = new Map(prevPatientsRef.current.map(p => [String(p.id), p]));
                        const isLRRole = userRole === 'LR' || userRole === 'Admin';

                        if (isLRRole) {
                            const newCritIds = [];
                            const newBookIds = [];
                            incomingPatients.forEach(p => {
                                const old = prevMap.get(String(p.id));
                                if (!old && p.status === 'WAITING') {
                                    if (isHighRiskPatient(p)) newCritIds.push(p.id);
                                    else newBookIds.push(p.id);
                                } else if (old && p.status === 'WAITING' && !isHighRiskPatient(old) && isHighRiskPatient(p)) {
                                    newCritIds.push(p.id);
                                }
                            });
                            if (newCritIds.length > 0) {
                                triggerFlashAlert('critical', `URGENT: High-Risk / Critical patient in Waiting Queue!`, newCritIds);
                            } else if (newBookIds.length > 0) {
                                triggerFlashAlert('new_booking', `NEW BOOKING: ${newBookIds.length} new patient(s) awaiting LR acknowledgement!`, newBookIds);
                            }
                        } else {
                            const calledMyWard = [];
                            incomingPatients.forEach(p => {
                                const old = prevMap.get(String(p.id));
                                if (isSameWard(p.location, userRole) && p.status === 'CALLED' && (!old || old.status !== 'CALLED')) {
                                    calledMyWard.push(p);
                                }
                            });
                            if (calledMyWard.length > 0) {
                                const first = calledMyWard[0];
                                triggerFlashAlert('called', `LR CALLING ${first.name} → ${first.calledToBed}! Please prepare transfer.`, calledMyWard.map(x => x.id));
                            }
                        }
                    }
                    prevPatientsRef.current = incomingPatients;
                } catch (err) {
                    console.error('Fetch error:', err);
                }
            }, [userRole, muted]);

            // Initial fetch for passwords before login
            React.useEffect(() => {
                fetchBoardData(true);
            }, []);

            // Poll every 10s after login
            React.useEffect(() => {
                if (!userRole) return;
                setIsLoadingData(true);
                fetchBoardData(true).finally(() => setIsLoadingData(false));
                const interval = setInterval(() => fetchBoardData(false), 10000);
                return () => clearInterval(interval);
            }, [userRole, fetchBoardData]);

            const syncToDB = (action, payload) => {
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                }).catch(err => console.error('Sync error:', err));
            };

            const learnIndication = (indication) => {
                const clean = String(indication || '').trim();
                if (!clean) return;
                setCustomIndications(prev => {
                    if (prev.some(i => i.toLowerCase() === clean.toLowerCase())) return prev;
                    const merged = [clean, ...prev];
                    try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(merged)); } catch (e) {}
                    return merged;
                });
            };

            const learnNicuDx = (dx) => {
                const clean = String(dx || '').trim();
                if (!clean) return;
                setCustomNicuDx(prev => {
                    if (prev.some(i => i.toLowerCase() === clean.toLowerCase())) return prev;
                    const merged = [clean, ...prev];
                    try { localStorage.setItem('lr_custom_nicu_dx', JSON.stringify(merged)); } catch (e) {}
                    return merged;
                });
            };

            const allLSCSIndications = React.useMemo(() => {
                const map = new Map();
                [...customIndications, ...LSCS_INDICATIONS].forEach(ind => {
                    const clean = String(ind || '').trim();
                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                });
                return Array.from(map.values());
            }, [customIndications]);

            const allNicuDx = React.useMemo(() => {
                const map = new Map();
                [...customNicuDx, ...NICU_DIAGNOSES].forEach(dx => {
                    const clean = String(dx || '').trim();
                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                });
                return Array.from(map.values());
            }, [customNicuDx]);

            const canManageLR = userRole === 'LR' || userRole === 'Admin';
            const canEditPatientWard = (patient) => {
                if (userRole === 'Admin') return true;
                if (userRole === 'LR') return false;
                return isSameWard(patient.location, userRole);
            };

            const upsertPatient = (updated) => {
                setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
                syncToDB('UPDATE', { patient: updated });
            };

            const handleNewBooking = (newPatient) => {
                setPatients(prev => [...prev, newPatient]);
                syncToDB('ADD', { patient: newPatient });
                setIsBookingModalOpen(false);
                playAlertSound(isHighRiskPatient(newPatient) ? 'critical' : 'new_booking', muted);
                showToast(`Booked ${newPatient.name} into Waiting Queue.`);
            };

            const handleStatusUpdate = (updatedFields) => {
                const target = patients.find(p => p.id === updatedFields.id);
                if (!target) return;
                if (!canManageLR && !canEditPatientWard(target)) {
                    showToast(`Read-only: Managed by ${target.location}`, 'warning');
                    return;
                }
                const updated = { ...target, ...updatedFields, manualOverride: 0 };
                upsertPatient(updated);
                setUpdateModalPatient(null);
                if (updated.status === 'WAITING' && isHighRiskPatient(updated) && !isHighRiskPatient(target)) {
                    playAlertSound('critical', muted);
                    showToast(`URGENT: ${updated.name} escalated to High Risk!`, 'warning');
                } else {
                    playAlertSound('update', muted);
                    showToast('Clinical status updated.');
                }
            };

            const handleNoteBooking = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, notedBy: staffName, notedTime: Date.now() });
                playAlertSound('confirm', muted);
                showToast(`Booking acknowledged by ${staffName}.`);
            };

            const handleConfirmBedAction = (bed) => {
                if (!assignModalState) return;
                const { patient, mode } = assignModalState;
                if (mode === 'MOVE') {
                    upsertPatient({ ...patient, assignedBed: bed });
                    playAlertSound('update', muted);
                    showToast(`${patient.name} moved to ${bed}.`);
                } else {
                    upsertPatient({ ...patient, status: 'CALLED', calledToBed: bed, callTime: Date.now() });
                    playAlertSound('called', muted);
                    showToast(`Called ${patient.name} to ${bed}.`);
                }
                setAssignModalState(null);
            };

            const handleCancelCall = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'WAITING', calledToBed: '', callTime: '', wardSendTime: '', wardNotedBy: '' });
                showToast(`Call cancelled for ${target.name}.`);
            };

            const handleWardSend = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                if (!canEditPatientWard(target)) {
                    showToast(`Read-only: Managed by ${target.location}`, 'warning');
                    return;
                }
                upsertPatient({ ...target, status: 'EN_ROUTE', wardSendTime: Date.now(), wardNotedBy: staffName });
                playAlertSound('confirm', muted);
                showToast(`Transfer confirmed — ${target.name} en route to LR.`);
            };

            const handlePatientArrived = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({
                    ...target,
                    status: 'IN_LR',
                    assignedBed: target.calledToBed,
                    admissionTime: Date.now()
                });
                playAlertSound('confirm', muted);
                showToast(`${target.name} admitted to ${target.calledToBed}.`);
            };

            const handleSendToOT = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'IN_LR', assignedBed: 'OT' });
                playAlertSound('emergency', muted);
                showToast(`URGENT: ${target.name} transferred to OT!`, 'warning');
            };

            const handleConfirmDelivery = (deliveryFields) => {
                if (!deliverModalPatient) return;
                const isOnBoard = patients.some(p => p.id === deliverModalPatient.id);
                const updated = {
                    ...deliverModalPatient,
                    ...deliveryFields,
                    status: isOnBoard ? 'DELIVERED' : (deliverModalPatient.status || 'DISCHARGED')
                };

                if (isOnBoard) {
                    setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
                }
                setCensusDeliveries(prev => {
                    const exists = prev.some(d => d.id === updated.id);
                    return exists ? prev.map(d => d.id === updated.id ? updated : d) : [updated, ...prev];
                });

                syncToDB('UPDATE', { patient: updated });
                if (updated.lscsIndication) learnIndication(updated.lscsIndication);
                if (updated.nicuDx) learnNicuDx(updated.nicuDx);
                setDeliverModalPatient(null);
                showToast('Delivery record saved & synced to 24h Census.');
            };

            const handleDirectDeliverySave = (record) => {
                setCensusDeliveries(prev => [record, ...prev]);
                if (record.lscsIndication) learnIndication(record.lscsIndication);
                if (record.nicuDx) learnNicuDx(record.nicuDx);
                syncToDB('ADD_DIRECT_DELIVERY', { patient: record });
                setIsDirectDeliveryOpen(false);
                showToast(`Logged ${record.deliveryMode} for ${record.name} in 24h Census.`);
            };

            const handleClearBed = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: { ...target, status: 'DISCHARGED' } });
                showToast(`${target.name} transferred out. Bed cleared.`);
            };

            const handleCancelBooking = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                if (!canEditPatientWard(target)) {
                    showToast(`Read-only: Managed by ${target.location}`, 'warning');
                    return;
                }
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: { ...target, status: 'CANCELLED' } });
                showToast(`Booking cancelled for ${target.name}.`);
            };

            const handleBump = (id, delta) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, manualOverride: Number(target.manualOverride || 0) + delta });
                showToast(delta > 0 ? 'Priority nudged UP' : 'Priority nudged DOWN');
            };

            const handleSavePasswords = (newPwds) => {
                setPasswords(newPwds);
                syncToDB('UPDATE_PASSWORDS', { passwords: newPwds });
                setIsPasswordModalOpen(false);
                showToast('Department passwords updated.');
            };

            // Sorted Waiting Queue (includes WAITING, CALLED, EN_ROUTE)
            const waitingQueueAll = React.useMemo(() => {
                return patients
                    .filter(p => p.status === 'WAITING' || p.status === 'CALLED' || p.status === 'EN_ROUTE')
                    .sort((a, b) => {
                        const rank = (s) => (s === 'EN_ROUTE' ? 0 : s === 'CALLED' ? 1 : 2);
                        const rDiff = rank(a.status) - rank(b.status);
                        if (rDiff !== 0) return rDiff;
                        const sDiff = calculatePriority(b) - calculatePriority(a);
                        if (sDiff !== 0) return sDiff;
                        return Number(a.bookingTime || 0) - Number(b.bookingTime || 0);
                    });
            }, [patients]);

            const filteredQueue = React.useMemo(() => {
                return waitingQueueAll.filter(p => {
                    if (queueFilter === 'MY_WARD') return isSameWard(p.location, userRole);
                    if (queueFilter === 'HIGH_RISK') return isHighRiskPatient(p);
                    if (queueFilter === 'CALLED') return p.status === 'CALLED' || p.status === 'EN_ROUTE';
                    return true;
                });
            }, [waitingQueueAll, queueFilter, userRole]);

            // KPI counts
            const occupiedInZone = (zoneBeds) =>
                patients.filter(p => zoneBeds.includes(p.assignedBed) && (p.status === 'IN_LR' || p.status === 'DELIVERED')).length;
            const highRiskCount = waitingQueueAll.filter(isHighRiskPatient).length;

            if (!userRole) {
                return <LoginScreen passwords={passwords} onLogin={(r) => setUserRole(r)} />;
            }

            const renderBedSlot = (bed, compact = false) => {
                const occupant = patients.find(p => p.assignedBed === bed && (p.status === 'IN_LR' || p.status === 'DELIVERED'));
                const incoming = patients.find(p => p.calledToBed === bed && (p.status === 'CALLED' || p.status === 'EN_ROUTE'));
                return (
                    <BedSlot
                        key={bed}
                        bedName={bed}
                        patient={occupant}
                        incoming={incoming}
                        compact={compact}
                        canManageLR={canManageLR}
                        tvMode={tvMode}
                        currentTime={currentTime}
                        onUpdate={() => setUpdateModalPatient(occupant)}
                        onMove={() => setAssignModalState({ patient: occupant, mode: 'MOVE' })}
                        onDeliver={() => setDeliverModalPatient(occupant)}
                        onEditDelivery={() => setDeliverModalPatient(occupant)}
                        onSendToOT={() => handleSendToOT(occupant?.id)}
                        onClear={() => handleClearBed(occupant?.id)}
                        onArrived={handlePatientArrived}
                        onCancelCall={handleCancelCall}
                    />
                );
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-950">
                    {/* TOP NAVIGATION BAR */}
                    <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center justify-between gap-3 shrink-0 z-20">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                <i className="ph-fill ph-heartbeat text-xl"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <h1 className="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
                                        LR Smart Board
                                    </h1>
                                    <span className="hidden md:inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Live
                                    </span>
                                </div>
                                <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">
                                    O&amp;G HTPN • <strong className="text-teal-700 dark:text-teal-400">{userRole}</strong>
                                </p>
                            </div>
                        </div>

                        {/* View Switcher */}
                        <div className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                            <button
                                onClick={() => setActiveView('BOARD')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'BOARD' ? 'bg-white dark:bg-slate-900 text-teal-700 dark:text-teal-400 shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                <i className="ph-bold ph-squares-four"></i>
                                <span className="hidden sm:inline">Live Board</span>
                            </button>
                            <button
                                onClick={() => setActiveView('CENSUS')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'CENSUS' ? 'bg-white dark:bg-slate-900 text-teal-700 dark:text-teal-400 shadow-sm' : 'text-slate-600 dark:text-slate-300'}`}
                            >
                                <i className="ph-bold ph-chart-bar"></i>
                                <span className="hidden sm:inline">24h Census</span>
                            </button>
                        </div>

                        {/* Right Controls */}
                        <div className="flex items-center gap-1.5 sm:gap-2">
                            {!tvMode && (userRole !== 'LR') && (
                                <button
                                    onClick={() => setIsBookingModalOpen(true)}
                                    className="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shadow-sm transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i>
                                    <span className="hidden sm:inline">Book Bed</span>
                                </button>
                            )}

                            <button
                                onClick={() => {
                                    const nextMuted = !muted;
                                    setMuted(nextMuted);
                                    if (!nextMuted) playAlertSound('confirm', false);
                                }}
                                title={muted ? 'Unmute Audio Chimes' : 'Mute Audio Chimes'}
                                className={`p-2 rounded-xl border transition ${muted ? 'bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800 text-rose-600' : 'bg-slate-100 dark:bg-slate-800 border-transparent text-slate-600 dark:text-slate-300'}`}
                            >
                                <i className={`ph-bold ${muted ? 'ph-speaker-slash' : 'ph-speaker-high'} text-base`}></i>
                            </button>

                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                title="Toggle Night Mode"
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                            >
                                <i className={`ph-bold ${darkMode ? 'ph-sun' : 'ph-moon'} text-base`}></i>
                            </button>

                            <button
                                onClick={() => setTvMode(!tvMode)}
                                title="Toggle TV Wallboard Mode"
                                className={`hidden md:flex p-2 rounded-xl border transition ${tvMode ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-100 dark:bg-slate-800 border-transparent text-slate-600 dark:text-slate-300'}`}
                            >
                                <i className="ph-bold ph-television text-base"></i>
                            </button>

                            {userRole === 'Admin' && (
                                <button
                                    onClick={() => setIsPasswordModalOpen(true)}
                                    title="Manage Passwords"
                                    className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                                >
                                    <i className="ph-bold ph-key text-base"></i>
                                </button>
                            )}

                            <button
                                onClick={() => { setUserRole(null); setTvMode(false); }}
                                title="Logout"
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-600 transition"
                            >
                                <i className="ph-bold ph-sign-out text-base"></i>
                            </button>
                        </div>
                    </header>

                    {/* BLINKING ALERT BANNER */}
                    {flashAlert && (
                        <div className={`px-4 py-2.5 text-white text-xs sm:text-sm font-extrabold flex items-center justify-between gap-3 shrink-0 animate-pulse ${flashAlert.type === 'critical' ? 'bg-rose-600' : flashAlert.type === 'called' ? 'bg-sky-600' : 'bg-amber-500'}`}>
                            <div className="flex items-center gap-2">
                                <i className="ph-fill ph-bell-ringing text-lg"></i>
                                <span>{flashAlert.message}</span>
                            </div>
                            <button
                                onClick={() => { setFlashAlert(null); setFlashingIds({}); }}
                                className="px-3 py-1 rounded-lg bg-black/20 hover:bg-black/30 text-xs font-bold"
                            >
                                Dismiss
                            </button>
                        </div>
                    )}

                    {/* LIVE TELEMETRY STRIP */}
                    {activeView === 'BOARD' && (
                        <div className="bg-white/80 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 px-4 py-1.5 flex items-center justify-between gap-3 text-[11px] overflow-x-auto shrink-0">
                            <div className="flex items-center gap-4 whitespace-nowrap">
                                <span className="font-semibold text-slate-500 dark:text-slate-400">
                                    Active/Urgent: <strong className="font-mono text-slate-900 dark:text-white">{occupiedInZone(ZONE_ACTIVE_URGENT)}/{ZONE_ACTIVE_URGENT.length}</strong>
                                </span>
                                <span className="font-semibold text-slate-500 dark:text-slate-400">
                                    OT/ISO: <strong className="font-mono text-slate-900 dark:text-white">{occupiedInZone(ZONE_ESCALATION)}/{ZONE_ESCALATION.length}</strong>
                                </span>
                                <span className="font-semibold text-slate-500 dark:text-slate-400">
                                    Overflow: <strong className="font-mono text-slate-900 dark:text-white">{occupiedInZone(ZONE_OVERFLOW)}/{ZONE_OVERFLOW.length}</strong>
                                </span>
                                <span className="font-semibold text-slate-500 dark:text-slate-400">
                                    Waiting: <strong className="font-mono text-teal-600 dark:text-teal-400">{waitingQueueAll.length}</strong>
                                </span>
                                {highRiskCount > 0 && (
                                    <span className="px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300 font-extrabold">
                                        {highRiskCount} High Risk
                                    </span>
                                )}
                            </div>
                            <span className="font-mono text-[11px] font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap">
                                {new Date(currentTime).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false })}
                            </span>
                        </div>
                    )}

                    {/* MOBILE TAB SWITCHER */}
                    {activeView === 'BOARD' && (
                        <div className="lg:hidden grid grid-cols-2 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
                            <button
                                onClick={() => setMobileTab('QUEUE')}
                                className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'QUEUE' ? 'border-teal-600 text-teal-700 dark:text-teal-400' : 'border-transparent text-slate-500'}`}
                            >
                                Waiting Queue ({waitingQueueAll.length})
                            </button>
                            <button
                                onClick={() => setMobileTab('BEDS')}
                                className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'BEDS' ? 'border-teal-600 text-teal-700 dark:text-teal-400' : 'border-transparent text-slate-500'}`}
                            >
                                LR Board (12)
                            </button>
                        </div>
                    )}

                    {/* MAIN BODY */}
                    {activeView === 'CENSUS' ? (
                        <CensusView
                            deliveries={censusDeliveries}
                            currentTime={currentTime}
                            canManageLR={canManageLR}
                            onOpenDirectDelivery={() => setIsDirectDeliveryOpen(true)}
                            onEditDelivery={(item) => setDeliverModalPatient(item)}
                            onCopySummary={(text) => {
                                if (navigator.clipboard && navigator.clipboard.writeText) {
                                    navigator.clipboard.writeText(text).then(() => showToast('WhatsApp summary copied!'));
                                } else {
                                    showToast('Clipboard not available in this browser.', 'warning');
                                }
                            }}
                        />
                    ) : (
                        <div className="flex-1 flex overflow-hidden">
                            {/* LEFT COLUMN: WAITING QUEUE */}
                            <aside className={`${mobileTab === 'QUEUE' ? 'flex' : 'hidden'} lg:flex flex-col w-full lg:w-[34%] xl:w-[31%] border-r border-slate-200 dark:border-slate-800 bg-slate-100/60 dark:bg-slate-950/60`}>
                                <div className="p-3 border-b border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 space-y-2 shrink-0">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                                            <i className="ph-fill ph-list-numbers text-teal-600 text-base"></i> Waiting Queue
                                        </h2>
                                        <span className="px-2 py-0.5 rounded-full bg-slate-800 dark:bg-slate-700 text-white text-[10px] font-mono font-bold">
                                            {filteredQueue.length}
                                        </span>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto">
                                        {[
                                            { id: 'ALL', label: 'All' },
                                            ...(!canManageLR ? [{ id: 'MY_WARD', label: `My Ward (${userRole})` }] : []),
                                            { id: 'HIGH_RISK', label: 'High Risk' },
                                            { id: 'CALLED', label: 'Called / En Route' }
                                        ].map(f => (
                                            <button
                                                key={f.id}
                                                onClick={() => setQueueFilter(f.id)}
                                                className={`px-2.5 py-1 rounded-lg text-[10px] font-bold whitespace-nowrap transition ${queueFilter === f.id ? 'bg-teal-600 text-white' : 'bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                                            >
                                                {f.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                                    {isLoadingData && patients.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-xs">
                                            <i className="ph ph-spinner-gap animate-spin text-2xl mb-2"></i>
                                            <p>Syncing live board...</p>
                                        </div>
                                    ) : filteredQueue.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-xs">
                                            <i className="ph-fill ph-check-circle text-3xl mb-1.5 opacity-40"></i>
                                            <p>No patients in this queue view.</p>
                                        </div>
                                    ) : (
                                        filteredQueue.map((patient, idx) => (
                                            <PatientCard
                                                key={patient.id}
                                                patient={patient}
                                                userRole={userRole}
                                                canManageLR={canManageLR}
                                                canEditWardPatient={canEditPatientWard(patient)}
                                                tvMode={tvMode}
                                                priorityScore={calculatePriority(patient)}
                                                waitTime={formatDuration(patient.bookingTime, currentTime)}
                                                queueNumber={idx + 1}
                                                flashType={flashingIds[patient.id]}
                                                onCall={() => setAssignModalState({ patient, mode: 'CALL' })}
                                                onCancelCall={handleCancelCall}
                                                onArrived={handlePatientArrived}
                                                onUpdate={() => setUpdateModalPatient(patient)}
                                                onBumpUp={() => handleBump(patient.id, 10)}
                                                onBumpDown={() => handleBump(patient.id, -10)}
                                                onCancel={() => handleCancelBooking(patient.id)}
                                                onNoteBooking={handleNoteBooking}
                                                onWardSend={handleWardSend}
                                            />
                                        ))
                                    )}
                                </div>
                            </aside>

                            {/* RIGHT COLUMN: 3-ZONE LABOUR ROOM BOARD */}
                            <main className={`${mobileTab === 'BEDS' ? 'flex' : 'hidden'} lg:flex flex-col flex-1 overflow-y-auto custom-scrollbar p-4 space-y-5`}>
                                {/* Zone 1: Active & Urgent */}
                                <section>
                                    <div className="flex items-center justify-between mb-2.5">
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                                            <i className="ph-fill ph-bed text-teal-600"></i> Zone 1 — Active &amp; Urgent Delivery Suites
                                        </h2>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                                        {ZONE_ACTIVE_URGENT.map(bed => renderBedSlot(bed, false))}
                                    </div>
                                </section>

                                {/* Zone 2: Escalation & Isolation */}
                                <section>
                                    <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2.5 flex items-center gap-1.5">
                                        <i className="ph-fill ph-first-aid-kit text-rose-500"></i> Zone 2 — Escalation (OT) &amp; Isolation
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {ZONE_ESCALATION.map(bed => renderBedSlot(bed, false))}
                                    </div>
                                </section>

                                {/* Zone 3: Overflow Holding Strip */}
                                <section>
                                    <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2.5 flex items-center gap-1.5">
                                        <i className="ph-fill ph-arrows-out-line-horizontal text-amber-500"></i> Zone 3 — Overflow / Post-Delivery Holding
                                    </h2>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                                        {ZONE_OVERFLOW.map(bed => renderBedSlot(bed, true))}
                                    </div>
                                </section>
                            </main>
                        </div>
                    )}

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold flex items-center gap-2 ${toast.type === 'warning' ? 'bg-rose-600' : 'bg-slate-900 dark:bg-teal-600'}`}>
                            <i className={`ph-fill ${toast.type === 'warning' ? 'ph-warning-circle' : 'ph-check-circle'} text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* MODALS & DRAWERS */}
                    {isBookingModalOpen && (
                        <BookingForm
                            userWard={userRole}
                            onClose={() => setIsBookingModalOpen(false)}
                            onSave={handleNewBooking}
                        />
                    )}
                    {updateModalPatient && (
                        <UpdateForm
                            patient={updateModalPatient}
                            onClose={() => setUpdateModalPatient(null)}
                            onSave={handleStatusUpdate}
                        />
                    )}
                    {assignModalState && (
                        <AssignBedModal
                            patient={assignModalState.patient}
                            mode={assignModalState.mode}
                            activePatients={patients}
                            onClose={() => setAssignModalState(null)}
                            onConfirm={handleConfirmBedAction}
                        />
                    )}
                    {deliverModalPatient && (
                        <DeliveryModal
                            patient={deliverModalPatient}
                            indicationOptions={allLSCSIndications}
                            nicuDxOptions={allNicuDx}
                            onClose={() => setDeliverModalPatient(null)}
                            onConfirm={handleConfirmDelivery}
                        />
                    )}
                    {isDirectDeliveryOpen && (
                        <DirectDeliveryModal
                            indicationOptions={allLSCSIndications}
                            nicuDxOptions={allNicuDx}
                            onClose={() => setIsDirectDeliveryOpen(false)}
                            onSave={handleDirectDeliverySave}
                        />
                    )}
                    {isPasswordModalOpen && (
                        <PasswordModal
                            passwords={passwords}
                            onClose={() => setIsPasswordModalOpen(false)}
                            onSave={handleSavePasswords}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
