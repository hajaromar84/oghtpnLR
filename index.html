                                        <option value="SGA/FGR">SGA / FGR</option>
                                    </select>
                                    <input type="text" name="other_issues" placeholder="Other issues (comma separated)" className={`${isObese ? 'sm:col-span-1' : 'sm:col-span-2'} rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs outline-none focus:border-teal-500`} />
                                </div>
                            </div>

                            {/* Latest VE, Membranes & CTG */}
                            <div className="space-y-3.5 pt-4 border-t border-slate-100 dark:border-slate-800">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">3. Clinical Assessment (VE & CTG)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                                    <div className="sm:col-span-6">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">VE Date & Time</label>
                                        <CustomDateTimePicker name="veTime" />
                                    </div>
                                    <div className="sm:col-span-3">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Os (cm)</label>
                                        <input required name="veDilation" type="number" min="0" max="10" placeholder="0-10" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono font-bold outline-none focus:border-teal-500" />
                                    </div>
                                    <div className="sm:col-span-3">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Cx Effacement</label>
                                        <input required name="veCervix" type="text" placeholder="e.g. 1cm" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm outline-none focus:border-teal-500" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Next Review Timer</label>
                                    <div className="grid grid-cols-5 gap-1.5">
                                        {[
                                            { v: '', label: 'None' },
                                            { v: '1', label: '1h' },
                                            { v: '2', label: '2h' },
                                            { v: '3', label: '3h' },
                                            { v: '4', label: '4h' }
                                        ].map(opt => (
                                            <button key={opt.v} type="button" onClick={() => setReviewInterval(opt.v)} className={`py-2 rounded-lg text-xs font-bold border transition ${pillClass(reviewInterval === opt.v)}`}>
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Membranes</label>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                                        {[
                                            { v: 'Intact', label: 'Intact (MI)' },
                                            { v: 'SROM', label: 'SROM' },
                                            { v: 'PROM_MI', label: 'PROM/Hind' },
                                            { v: 'ARM', label: 'ARM' }
                                        ].map(opt => (
                                            <button key={opt.v} type="button" onClick={() => setMembrane(opt.v)} className={`py-2 rounded-lg text-xs font-bold border transition ${pillClass(membrane === opt.v)}`}>
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {membrane !== 'Intact' && (
                                    <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">ROM Date & Time</label>
                                            <CustomDateTimePicker name="romTime" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Liquor Colour</label>
                                            <div className="flex flex-wrap gap-1.5">
                                                {['Clear', 'LMSL', 'MMSL', 'TMSL', 'Blood stained'].map(l => (
                                                    <button
                                                        key={l}
                                                        type="button"
                                                        onClick={() => setLiquor(l)}
                                                        className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(
                                                            liquor === l,
                                                            ['TMSL', 'Blood stained'].includes(l) ? 'rose' : l === 'MMSL' ? 'amber' : 'teal'
                                                        )}`}
                                                    >
                                                        {l}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Current CTG</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            { v: 'Normal', color: 'emerald' },
                                            { v: 'Suspicious', color: 'amber' },
                                            { v: 'Pathological', color: 'rose' }
                                        ].map(opt => (
                                            <button key={opt.v} type="button" onClick={() => setCtg(opt.v)} className={`py-2.5 rounded-lg text-xs font-bold border transition ${pillClass(ctg === opt.v, opt.color)}`}>
                                                {opt.v}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-2.5">
                                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                    Cancel
                                </button>
                                <button type="submit" className="px-6 py-2.5 rounded-lg text-sm font-bold bg-teal-600 hover:bg-teal-700 text-white shadow-md shadow-teal-600/20 transition">
                                    Submit Booking
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // SLIDE-OVER UPDATE VE DRAWER (Sub-5-Second Updates)
        // =========================================================================
        const UpdateDrawer = ({ patient, onClose, onSave }) => {
            const [membrane, setMembrane] = React.useState(patient.membrane || 'Intact');
            const [liquor, setLiquor] = React.useState(patient.liquor && patient.liquor !== 'N/A' ? patient.liquor : 'Clear');
            const [ctg, setCtg] = React.useState(patient.ctg || 'Normal');
            const [reviewInterval, setReviewInterval] = React.useState('');
            const [epidural, setEpidural] = React.useState(Boolean(patient.epidural));

            const handleSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const veTime = fd.get('veTime');
                const romTime = membrane === 'Intact' ? null : (fd.get('romTime') || null);

                let nextReviewTime = patient.lastVE?.nextReviewTime || null;
                if (reviewInterval === 'CLEAR') {
                    nextReviewTime = null;
                } else if (reviewInterval) {
                    const veDate = parseSafeDate(veTime) || new Date();
                    veDate.setHours(veDate.getHours() + parseInt(reviewInterval, 10));
                    nextReviewTime = toLocalISOString(veDate);
                }

                onSave({
                    id: patient.id,
                    lastVE: {
                        ...patient.lastVE,
                        time: veTime,
                        dilation: fd.get('veDilation'),
                        cervix: fd.get('veCervix'),
                        nextReviewTime
                    },
                    membrane,
                    liquor: membrane === 'Intact' ? 'N/A' : liquor,
                    romTime,
                    ctg,
                    epidural
                });
            };

            const pillClass = (active, color = 'teal') => {
                if (!active) return 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-transparent hover:bg-slate-200 dark:hover:bg-slate-700';
                if (color === 'rose') return 'bg-rose-600 text-white border-rose-600 shadow-sm';
                if (color === 'amber') return 'bg-amber-500 text-white border-amber-500 shadow-sm';
                if (color === 'emerald') return 'bg-emerald-600 text-white border-emerald-600 shadow-sm';
                if (color === 'sky') return 'bg-sky-600 text-white border-sky-600 shadow-sm';

        // =========================================================================

        // =========================================================================
        // MAIN APPLICATION SHELL
        // =========================================================================
        const App = () => {
            const [userRole, setUserRole] = React.useState(null);
            const [isDemoMode, setIsDemoMode] = React.useState(false);
            const [patients, setPatients] = React.useState([]);
            const [passwords, setPasswords] = React.useState(null);

            const [isSyncing, setIsSyncing] = React.useState(false);
            const [darkMode, setDarkMode] = React.useState(false);
            const [isTVMode, setIsTVMode] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const [mobileTab, setMobileTab] = React.useState('BOARD'); // 'QUEUE' | 'BOARD'
            const [queueFilter, setQueueFilter] = React.useState('ALL'); // 'ALL' | 'HIGH' | 'CALLED' | 'MINE'

            const [isBookingOpen, setIsBookingOpen] = React.useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
            const [updateModalPatient, setUpdateModalPatient] = React.useState(null);
            const [assignBedPatient, setAssignBedPatient] = React.useState(null);
            const [moveBedPatient, setMoveBedPatient] = React.useState(null);
            const [deliverModalPatient, setDeliverModalPatient] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const [currentTime, setCurrentTime] = React.useState(Date.now());
            const prevPatientsRef = React.useRef([]);
            const isSyncingRef = React.useRef(false);
            const isDemoRef = React.useRef(false);

            React.useEffect(() => {
                isDemoRef.current = isDemoMode;
            }, [isDemoMode]);

            // Sync Dark Mode Class on <html>
            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            // Fetch Live Data
            const fetchPatients = async () => {
                if (isSyncingRef.current || isDemoRef.current) return;
                try {
                    const response = await fetch(API_URL);
                    const textData = await response.text();
                    const data = JSON.parse(textData);
                    if (Array.isArray(data)) {
                        setPatients(data);
                    } else {
                        setPatients(data.patients || []);
                        if (data.passwords) setPasswords(data.passwords);
                    }
                } catch (err) {
                    console.warn('Database sync skipped or offline:', err);
                }
            };

            const syncToDB = (action, payload) => {
                if (isDemoRef.current) return;
                setIsSyncing(true);
                isSyncingRef.current = true;
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                }).finally(() => {
                    setTimeout(() => {
                        setIsSyncing(false);
                        isSyncingRef.current = false;
                    }, 2500);
                });
            };

            React.useEffect(() => {
                fetchPatients();
                const clockInterval = setInterval(() => setCurrentTime(Date.now()), 30000);
                return () => clearInterval(clockInterval);
            }, []);

            React.useEffect(() => {
                if (userRole && !isDemoMode) {
                    const pollInterval = setInterval(fetchPatients, 5000);
                    return () => clearInterval(pollInterval);
                }
            }, [userRole, isDemoMode]);

            // Sound Alert Listener
            React.useEffect(() => {
                if (!userRole) return;
                let shouldChime = false;
                const myAlertRole = (userRole === 'LR' || userRole === 'Admin') ? 'LR' : userRole;

                patients.forEach(p => {
                    const prevP = prevPatientsRef.current.find(old => old.id === p.id);
                    const hasNewAlert = p.lastVE?.alertRole === myAlertRole && (!prevP || prevP.lastVE?.alertRole !== myAlertRole);
                    const nowOverdue = myAlertRole === 'LR' && p.lastVE?.nextReviewTime && currentTime > parseSafeDate(p.lastVE.nextReviewTime)?.getTime() && !p.lastVE?.reviewAcked;
                    const prevOverdue = prevP && prevP.lastVE?.nextReviewTime && currentTime > parseSafeDate(prevP.lastVE.nextReviewTime)?.getTime() && !prevP.lastVE?.reviewAcked;
                    if (hasNewAlert || (nowOverdue && !prevOverdue)) shouldChime = true;
                });

                if (shouldChime) playAlertSound('new_booking', isMuted);
                prevPatientsRef.current = patients;
            }, [patients, currentTime, userRole, isMuted]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const handleUpdatePatient = (updatedPatient) => {
                setPatients(prev => prev.map(p => p.id === updatedPatient.id ? updatedPatient : p));
                syncToDB('UPDATE', { patient: updatedPatient });
            };

            const handleUpdatePasswords = (newPasswords) => {
                setPasswords(newPasswords);
                syncToDB('UPDATE_PASSWORDS', { passwords: newPasswords });
                showToast('Department passwords updated');
                setIsSettingsOpen(false);
            };

            const handleConfirmBedAssignment = (bed) => {
                const updated = {
                    ...assignBedPatient,
                    status: 'CALLED',
                    calledToBed: bed,
                    callTime: toLocalISOString(new Date()),
                    lastVE: { ...assignBedPatient.lastVE, alertRole: assignBedPatient.location, alertMsg: `CALLED TO ${bed}` }
                };
                handleUpdatePatient(updated);
                playAlertSound('called', isMuted);
                showToast(`${assignBedPatient.name} called to ${bed}`);
                setAssignBedPatient(null);
            };

            const handleConfirmMoveBed = (bed) => {
                handleUpdatePatient({ ...moveBedPatient, assignedBed: bed });
                showToast(`Moved ${moveBedPatient.name} to ${bed}`);
                setMoveBedPatient(null);
            };

            const handleWardSend = (id, staffName) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                handleUpdatePatient({
                    ...p,
                    status: 'EN_ROUTE',
                    wardSendTime: toLocalISOString(new Date()),
                    wardNotedBy: staffName,
                    lastVE: { ...p.lastVE, alertRole: 'LR', alertMsg: `EN ROUTE (Sent by ${staffName})` }
                });
                playAlertSound('update', isMuted);
                showToast('Transfer confirmed • Patient en route to LR');
            };

            const handlePatientArrived = (id) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                handleUpdatePatient({
                    ...p,
                    status: 'IN_LR',
                    assignedBed: p.calledToBed,
                    admissionTime: toLocalISOString(new Date()),
                    lastVE: { ...p.lastVE, alertRole: null, alertMsg: null }
                });
                playAlertSound('update', isMuted);
                showToast(`${p.name} arrived in ${p.calledToBed}`);
            };

            const handleSendToOT = (id) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                handleUpdatePatient({ ...p, status: 'IN_LR', assignedBed: 'OT' });
                playAlertSound('critical', isMuted);
                showToast(`URGENT: ${p.name} transferred to OT`, 'warning');
            };

            const handleConfirmDelivery = (time) => {
                const today = new Date();
                const [hrs, mins] = time.split(':');
                today.setHours(parseInt(hrs, 10), parseInt(mins, 10), 0, 0);
                handleUpdatePatient({
                    ...deliverModalPatient,
                    status: 'DELIVERED',
                    deliveryTime: toLocalISOString(today),
                    lastVE: { ...deliverModalPatient.lastVE, alertRole: null, alertMsg: null, reviewAcked: true }
                });
                showToast('Delivery recorded');
                setDeliverModalPatient(null);
            };

            const handleClearBed = (id) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                const updated = { ...p, status: 'DISCHARGED', lastVE: { ...p.lastVE, alertRole: null, alertMsg: null, reviewAcked: true } };
                setPatients(prev => prev.map(x => x.id === id ? updated : x));
                syncToDB('UPDATE', { patient: updated });
                showToast('Transferred to ward • Record archived');
            };

            const handleCancelBooking = (id) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                const updated = { ...p, status: 'CANCELLED', lastVE: { ...p.lastVE, alertRole: null, alertMsg: null, reviewAcked: true } };
                setPatients(prev => prev.map(x => x.id === id ? updated : x));
                syncToDB('UPDATE', { patient: updated });
                showToast('Booking cancelled • Record archived');
            };

            const handleNudge = (id, delta) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                handleUpdatePatient({ ...p, manualOverride: (Number(p.manualOverride) || 0) + delta });
                playAlertSound('update', isMuted);
                showToast(delta > 0 ? 'Priority nudged UP' : 'Priority nudged DOWN');
            };

            const handleAcknowledgeAlert = (id, staffName, alertType) => {
                const p = patients.find(x => x.id === id);
                if (!p) return;
                const updated = { ...p };
                if (alertType === 'NORMAL') {
                    if (updated.lastVE?.alertMsg === 'NEW BOOKING') {
                        updated.notedBy = staffName;
                        updated.notedTime = toLocalISOString(new Date());
                    }
                    updated.lastVE = {
                        ...updated.lastVE,
                        alertRole: null,
                        alertMsg: null,
                        lastGeneralAckBy: staffName,
                        lastGeneralAckTime: toLocalISOString(new Date())
                    };
                } else {
                    updated.lastVE = {
                        ...updated.lastVE,
                        reviewAcked: true,
                        reviewAckBy: staffName,
                        reviewAckTime: toLocalISOString(new Date())
                    };
                }
                handleUpdatePatient(updated);
                playAlertSound('update', isMuted);
                showToast(`Acknowledged by ${staffName}`);
            };

            const handleNewBooking = (newPatient) => {
                const withAlert = { ...newPatient, lastVE: { ...newPatient.lastVE, alertRole: 'LR', alertMsg: 'NEW BOOKING' } };
                setPatients(prev => [...prev, withAlert]);
                syncToDB('ADD', { patient: withAlert });
                setIsBookingOpen(false);
                playAlertSound('new_booking', isMuted);
                showToast('New bed booking submitted');
            };

            const handleStatusUpdate = (updatedData) => {
                const p = patients.find(x => x.id === updatedData.id);
                if (!p) return;
                const merged = { ...p, ...updatedData, manualOverride: 0 };
                if (userRole !== 'LR' && userRole !== 'Admin') {
                    merged.lastVE = { ...merged.lastVE, alertRole: 'LR', alertMsg: 'CLINICAL STATUS UPDATED' };
                } else {
                    merged.lastVE = { ...merged.lastVE, reviewAcked: false, alertRole: null, alertMsg: null };
                }
                handleUpdatePatient(merged);
                setUpdateModalPatient(null);
                playAlertSound('update', isMuted);
                showToast('Clinical status updated');
            };

            const defaultPasswords = { LR: 'lr123', PAC: 'pac123', '7A': '7a123', '7B': '7b123', Admin: 'admin123' };
            const activePasswords = passwords || defaultPasswords;

            // LOGIN VIEW
            if (!userRole) {
                return (
                    <LoginScreen
                        passwords={activePasswords}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                        onLogin={(role) => {
                            setIsDemoMode(false);
                            setUserRole(role);
                            getAudioCtx();
                            fetchPatients();
                        }}
                        onStartDemo={() => {
                            setIsDemoMode(true);
                            setPatients(getSamplePatients());
                            setUserRole('LR');
                            getAudioCtx();
                        }}
                    />
                );
            }

            const isLR = userRole === 'LR' || userRole === 'Admin';

            // Sorted Waiting Queue
            const allWaiting = patients
                .filter(p => p.status === 'WAITING' || p.status === 'CALLED')
                .sort((a, b) => {
                    if (a.status === 'CALLED' && b.status !== 'CALLED') return -1;
                    if (b.status === 'CALLED' && a.status !== 'CALLED') return 1;
                    if (a.status === 'CALLED' && b.status === 'CALLED') {
                        return (parseSafeDate(a.callTime)?.getTime() || 0) - (parseSafeDate(b.callTime)?.getTime() || 0);
                    }
                    const diff = calculatePriority(b) - calculatePriority(a);
                    if (diff !== 0) return diff;
                    return (parseSafeDate(a.bookingTime)?.getTime() || 0) - (parseSafeDate(b.bookingTime)?.getTime() || 0);
                });

            const filteredWaiting = allWaiting.filter(p => {
                if (queueFilter === 'HIGH') return calculatePriority(p) > 40;
                if (queueFilter === 'CALLED') return p.status === 'CALLED';
                if (queueFilter === 'MINE') return p.location === userRole;
                return true;
            });

            // Live Telemetry Metrics
            const countOccupied = (bedList) => bedList.filter(bed =>
                patients.some(p => p.assignedBed === bed && (p.status === 'IN_LR' || p.status === 'DELIVERED'))
            ).length;

            const activeOcc = countOccupied(ZONE_ACTIVE_BEDS);
            const specialtyOcc = countOccupied(ZONE_SPECIALTY_BEDS);
            const overflowOcc = countOccupied(ZONE_OVERFLOW_BEDS);
            const alertCount = patients.filter(p => {
                if (p.status === 'DISCHARGED' || p.status === 'CANCELLED' || p.status === 'DELIVERED') return false;
                const myRole = isLR ? 'LR' : userRole;
                const normalAlert = p.lastVE?.alertRole === myRole;
                const overdue = isLR && p.lastVE?.nextReviewTime && currentTime > parseSafeDate(p.lastVE.nextReviewTime)?.getTime() && !p.lastVE?.reviewAcked;
                return normalAlert || overdue;
            }).length;

            const renderBedComponent = (bed, zoneFlags = {}) => {
                const occupant = patients.find(p => p.assignedBed === bed && (p.status === 'IN_LR' || p.status === 'DELIVERED'));
                const incoming = patients.find(p => p.calledToBed === bed && (p.status === 'CALLED' || p.status === 'EN_ROUTE'));
                return (
                    <BedSlot
                        key={bed}
                        bedName={bed}
                        patient={occupant}
                        incoming={incoming}
                        isLR={isLR}
                        isTVMode={isTVMode}
                        currentTime={currentTime}
                        onUpdate={() => setUpdateModalPatient(occupant)}
                        onDeliver={() => setDeliverModalPatient(occupant)}
                        onSendToOT={() => handleSendToOT(occupant?.id)}
                        onClear={() => handleClearBed(occupant?.id)}
                        onArrived={handlePatientArrived}
                        onAcknowledge={handleAcknowledgeAlert}
                        onMoveBed={() => setMoveBedPatient(occupant)}
                        {...zoneFlags}
                    />
                );
            };

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-950">
                    {/* Top Command Header */}
                    <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center justify-between gap-3 shrink-0 z-20">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white shadow-sm shadow-teal-600/20 shrink-0">
                                <i className="ph-fill ph-heartbeat text-xl"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <h1 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white tracking-tight truncate">
                                        LR Smart Board
                                    </h1>
                                    {isDemoMode ? (
                                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300">
                                            <i className="ph-fill ph-sparkle"></i> Demo
                                        </span>
                                    ) : (
                                        <span className={`hidden sm:inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                                            isSyncing
                                                ? 'bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300'
                                                : 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300'
                                        }`}>
                                            <span className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-amber-500 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>
                                            {isSyncing ? 'Syncing' : 'Live'}
                                        </span>
                                    )}
                                </div>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate hidden md:block">
                                    O&G • Hospital Tengku Permaisuri Norashikin
                                </p>
                            </div>
                        </div>

                        {/* Right Controls */}
                        <div className="flex items-center gap-2 shrink-0">
                            {isDemoMode && !isTVMode && (
                                <select
                                    value={userRole}
                                    onChange={(e) => setUserRole(e.target.value)}
                                    className="rounded-lg border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/50 px-2 py-1.5 text-xs font-bold text-amber-900 dark:text-amber-200 outline-none"
                                    title="Switch Demo Role"
                                >
                                    <option value="LR">View: LR</option>
                                    <option value="7A">View: Ward 7A</option>
                                    <option value="PAC">View: PAC</option>
                                    <option value="Admin">View: Admin</option>
                                </select>
                            )}
                            <div className="hidden xl:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-mono font-semibold text-slate-600 dark:text-slate-300">
                                <i className="ph ph-clock text-teal-600 dark:text-teal-400"></i>
                                {new Date(currentTime).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase()}
                            </div>

                            {!isLR && !isTVMode && (
                                <button
                                    onClick={() => setIsBookingOpen(true)}
                                    className="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm shadow-teal-600/20 transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i>
                                    <span>Book Bed</span>
                                </button>
                            )}

                            {userRole === 'Admin' && !isTVMode && (
                                <button
                                    onClick={() => setIsSettingsOpen(true)}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                                    title="Manage Passwords"
                                >
                                    <i className="ph-bold ph-gear text-base"></i>
                                </button>
                            )}

                            {/* Wallboard / TV Mode Toggle */}
                            <button
                                onClick={() => setIsTVMode(!isTVMode)}
                                className={`px-2.5 py-2 rounded-xl border text-xs font-bold transition flex items-center gap-1.5 ${
                                    isTVMode
                                        ? 'bg-teal-600 border-teal-600 text-white'
                                        : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                                }`}
                                title="Wallboard / TV Display Mode"
                            >
                                <i className="ph-bold ph-television text-base"></i>
                                <span className="hidden sm:inline">{isTVMode ? 'Exit TV' : 'TV Mode'}</span>
                            </button>

                            {/* Mute Toggle */}
                            <button
                                onClick={() => setIsMuted(!isMuted)}
                                className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                                title={isMuted ? 'Unmute Alerts' : 'Mute Alerts'}
                            >
                                <i className={`ph-bold ${isMuted ? 'ph-speaker-slash text-rose-500' : 'ph-speaker-high'} text-base`}></i>
                            </button>

                            {/* Dark Mode Toggle */}
                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                                title="Toggle Night Shift Dark Mode"
                            >
                                <i className={`ph-fill ${darkMode ? 'ph-sun text-amber-400' : 'ph-moon'} text-base`}></i>
                            </button>

                            {/* Role & Logout */}
                            <div className="hidden md:flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
                                <span className="text-xs font-bold text-slate-700 dark:text-slate-200">
                                    {userRole === 'Admin' ? 'Admin' : userRole === 'LR' ? 'Labour Room' : `Ward ${userRole}`}
                                </span>
                                <button
                                    onClick={() => { setUserRole(null); setIsDemoMode(false); setPatients([]); }}
                                    className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition"
                                    title="Sign Out"
                                >
                                    <i className="ph-bold ph-sign-out text-base"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Live Telemetry KPI Strip */}
                    <div className="bg-slate-100/80 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center gap-3 overflow-x-auto custom-scrollbar shrink-0">
                        <div className="flex items-center gap-2 px-3 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shrink-0">
                            <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Active & Urgent</span>
                            <span className="font-mono text-xs font-bold text-teal-700 dark:text-teal-400">{activeOcc}/{ZONE_ACTIVE_BEDS.length}</span>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shrink-0">
                            <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">OT & ISO</span>
                            <span className="font-mono text-xs font-bold text-violet-700 dark:text-violet-400">{specialtyOcc}/{ZONE_SPECIALTY_BEDS.length}</span>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shrink-0">
                            <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Overflow Bay</span>
                            <span className={`font-mono text-xs font-bold ${overflowOcc >= 3 ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-700 dark:text-emerald-400'}`}>
                                {overflowOcc}/{ZONE_OVERFLOW_BEDS.length}
                            </span>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shrink-0">
                            <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Waiting Queue</span>
                            <span className="font-mono text-xs font-bold text-slate-800 dark:text-white">{allWaiting.length}</span>
                        </div>
                        <div className={`flex items-center gap-2 px-3 py-1 rounded-lg border shrink-0 ml-auto ${
                            alertCount > 0
                                ? 'bg-rose-600 text-white border-rose-600 animate-pulse'
                                : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400'
                        }`}>
                            <i className={`ph-fill ${alertCount > 0 ? 'ph-warning-circle' : 'ph-check-circle text-emerald-500'}`}></i>
                            <span className="text-[11px] font-bold">{alertCount > 0 ? `${alertCount} Action Required` : 'All Clear'}</span>
                        </div>
                    </div>

                    {/* Mobile / Tablet View Switcher Tabs */}
                    <div className="lg:hidden grid grid-cols-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-1.5 gap-1.5 shrink-0">
                        <button
                            onClick={() => setMobileTab('QUEUE')}
                            className={`py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                                mobileTab === 'QUEUE'
                                    ? 'bg-teal-600 text-white shadow-sm'
                                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                            }`}
                        >
                            <i className="ph-bold ph-list-numbers"></i> Waiting Queue ({allWaiting.length})
                        </button>
                        <button
                            onClick={() => setMobileTab('BOARD')}
                            className={`py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${
                                mobileTab === 'BOARD'
                                    ? 'bg-teal-600 text-white shadow-sm'
                                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                            }`}
                        >
                            <i className="ph-bold ph-squares-four"></i> LR Board (12)
                        </button>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-white text-xs font-bold flex items-center gap-2.5 card-enter ${
                            toast.type === 'warning' ? 'bg-rose-600' : 'bg-slate-900 dark:bg-teal-600'
                        }`}>
                            <i className={`ph-fill ${toast.type === 'warning' ? 'ph-warning-circle' : 'ph-check-circle text-emerald-400 dark:text-white'} text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Main Split Command Workspace */}
                    <div className="flex-1 flex overflow-hidden">
                        {/* LEFT COLUMN: WAITING QUEUE */}
                        <aside className={`${mobileTab === 'QUEUE' ? 'flex' : 'hidden'} lg:flex w-full lg:w-[360px] xl:w-[400px] bg-slate-100/70 dark:bg-slate-900/40 border-r border-slate-200 dark:border-slate-800 flex-col shrink-0`}>
                            <div className="px-4 py-3 bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 space-y-2.5 shrink-0">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                                        <i className="ph-fill ph-list-numbers text-teal-600 text-base"></i> Waiting Queue
                                    </h2>
                                    <span className="font-mono text-xs font-bold text-slate-500 dark:text-slate-400">
                                        {filteredWaiting.length} shown
                                    </span>
                                </div>
                                {!isTVMode && (
                                    <div className="flex items-center gap-1.5 overflow-x-auto">
                                        {[
                                            { id: 'ALL', label: 'All' },
                                            { id: 'HIGH', label: 'High Risk' },
                                            { id: 'CALLED', label: 'Called' },
                                            ...(!isLR ? [{ id: 'MINE', label: `My Ward (${userRole})` }] : [])
                                        ].map(f => (
                                            <button
                                                key={f.id}
                                                onClick={() => setQueueFilter(f.id)}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition shrink-0 ${
                                                    queueFilter === f.id
                                                        ? 'bg-teal-600 text-white'
                                                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                                                }`}
                                            >
                                                {f.label}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex-1 overflow-y-auto p-3.5 custom-scrollbar space-y-3">
                                {filteredWaiting.map((patient, index) => (
                                    <PatientCard
                                        key={patient.id}
                                        patient={patient}
                                        userRole={userRole}
                                        priorityScore={calculatePriority(patient)}
                                        waitTime={formatDuration(patient.bookingTime, currentTime)}
                                        queueNumber={index + 1}
                                        isTVMode={isTVMode}
                                        currentTime={currentTime}
                                        onCall={() => setAssignBedPatient(patient)}
                                        onUpdate={() => setUpdateModalPatient(patient)}
                                        onBumpUp={() => handleNudge(patient.id, 10)}
                                        onBumpDown={() => handleNudge(patient.id, -10)}
                                        onCancel={() => handleCancelBooking(patient.id)}
                                        onAcknowledge={handleAcknowledgeAlert}
                                        onWardSend={handleWardSend}
                                    />
                                ))}
                                {filteredWaiting.length === 0 && (
                                    <div className="text-center py-12 text-slate-400 dark:text-slate-600">
                                        <i className="ph-fill ph-check-circle text-4xl mb-2"></i>
                                        <p className="text-xs font-semibold">No patients in this view</p>
                                    </div>
                                )}
                            </div>
                        </aside>

                        {/* RIGHT WORKSPACE: 3-ZONE LABOUR ROOM COMMAND BOARD */}
                        <main className={`${mobileTab === 'BOARD' ? 'flex' : 'hidden'} lg:flex flex-1 flex-col overflow-hidden`}>
                            <div className="flex-1 overflow-y-auto p-4 sm:p-5 custom-scrollbar space-y-5">
                                {/* ZONE 1: ACTIVE & URGENT DELIVERY */}
                                <section>
                                    <div className="flex items-center justify-between mb-2.5">
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-teal-500"></span>
                                            Active & Urgent Delivery Suites
                                        </h2>
                                        <span className="text-[11px] font-mono text-slate-400">Rooms 3, 4, 5, 6 • Urgent 13 & 2</span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3.5">
                                        {ZONE_ACTIVE_BEDS.map(bed => renderBedComponent(bed))}
                                    </div>
                                </section>

                                {/* ZONE 2: SPECIALTY & ESCALATION (OT + ISO) */}
                                <section>
                                    <div className="flex items-center justify-between mb-2.5">
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-violet-500"></span>
                                            Escalation & Isolation
                                        </h2>
                                        <span className="text-[11px] font-mono text-slate-400">OT • Room 7 (ISO)</span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                        {ZONE_SPECIALTY_BEDS.map(bed => renderBedComponent(bed, { isSpecialtyZone: true }))}
                                    </div>
                                </section>

                                {/* ZONE 3: POST-DELIVERY OVERFLOW HOLDING BAY */}
                                <section>
                                    <div className="flex items-center justify-between mb-2.5">
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                            Post-Delivery Overflow Holding Bay
                                        </h2>
                                        <span className="text-[11px] font-mono text-slate-400">Rooms 1A, 1B, 14A, 14B</span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                                        {ZONE_OVERFLOW_BEDS.map(bed => renderBedComponent(bed, { isOverflowZone: true }))}
                                    </div>
                                </section>
                            </div>
                        </main>
                    </div>

                    {/* Slide-Over Drawers & Modals */}
                    {isBookingOpen && <BookingDrawer userWard={userRole} onClose={() => setIsBookingOpen(false)} onSave={handleNewBooking} />}
                    {updateModalPatient && <UpdateDrawer patient={updateModalPatient} onClose={() => setUpdateModalPatient(null)} onSave={handleStatusUpdate} />}
                    {assignBedPatient && <AssignBedModal patient={assignBedPatient} activePatients={patients} onClose={() => setAssignBedPatient(null)} onConfirm={handleConfirmBedAssignment} />}
                    {moveBedPatient && <AssignBedModal patient={moveBedPatient} activePatients={patients} onClose={() => setMoveBedPatient(null)} onConfirm={handleConfirmMoveBed} isMoveMode />}
                    {deliverModalPatient && <DeliveryModal patient={deliverModalPatient} onClose={() => setDeliverModalPatient(null)} onConfirm={handleConfirmDelivery} />}
                    {isSettingsOpen && <SettingsModal passwords={activePasswords} onClose={() => setIsSettingsOpen(false)} onSave={handleUpdatePasswords} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
