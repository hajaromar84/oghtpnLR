                            </div>

                            {/* Digital Delivery Book — Neonatal Details */}
                            <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 p-3.5 space-y-3">
                                <span className="block text-[11px] font-extrabold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                                    Baby Details (Digital Delivery Book — Optional in Emergency)
                                </span>

                                {/* Live Birth vs Stillbirth Slide Pill */}
                                <div className="space-y-2">
                                    <div className="relative grid grid-cols-2 rounded-xl bg-slate-200/80 dark:bg-slate-900 p-1">
                                        <div className={`absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-lg transition-all duration-200 ${isStillbirth ? 'left-[calc(50%+2px)] bg-rose-600' : 'left-1 bg-emerald-600'}`}></div>
                                        <button
                                            type="button"
                                            onClick={() => setIsStillbirth(false)}
                                            className={`relative z-10 py-1.5 text-xs font-extrabold transition ${!isStillbirth ? 'text-white' : 'text-slate-600 dark:text-slate-300'}`}
                                        >
                                            Live Birth
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => { setIsStillbirth(true); setDcc(''); }}
                                            className={`relative z-10 py-1.5 text-xs font-extrabold transition ${isStillbirth ? 'text-white' : 'text-slate-600 dark:text-slate-300'}`}
                                        >
                                            Stillbirth (IUD)
                                        </button>
                                    </div>

                                    {isStillbirth && (
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'MSB', label: 'MSB (Macerated)' },
                                                { id: 'FSB', label: 'FSB (Fresh)' }
                                            ].map(sb => (
                                                <button
                                                    key={sb.id}
                                                    type="button"
                                                    onClick={() => setStillbirthType(sb.id)}
                                                    className={`py-1.5 rounded-xl text-xs font-bold border transition ${stillbirthType === sb.id ? 'bg-rose-600 text-white border-rose-600' : 'bg-white dark:bg-slate-900 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'}`}
                                                >
                                                    {sb.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Gender & Birth Weight */}
                                <div className="grid grid-cols-12 gap-2.5">
                                    <div className="col-span-7">
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Baby Gender</label>
                                        <div className="grid grid-cols-3 gap-1">
                                            {GENDER_OPTIONS.map(g => (
                                                <button
                                                    key={g}
                                                    type="button"
                                                    onClick={() => setBabyGender(babyGender === g ? '' : g)}
                                                    className={`py-1.5 rounded-xl text-[11px] font-bold border transition ${babyGender === g ? (g === 'Boy' ? 'bg-sky-600 text-white border-sky-600' : g === 'Girl' ? 'bg-pink-600 text-white border-pink-600' : 'bg-purple-600 text-white border-purple-600') : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                                                >
                                                    {g}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="col-span-5">
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Birth Weight (kg)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            min="0.2"
                                            max="7"
                                            value={birthWeight}
                                            onChange={(e) => setBirthWeight(e.target.value)}
                                            placeholder="e.g. 3.15"
                                            className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-1.5 text-xs font-mono font-bold"
                                        />
                                    </div>
                                </div>

                                {!isStillbirth && (
                                    <div className="grid grid-cols-12 gap-2.5 items-end">
                                        <div className="col-span-7">
                                            <div className="flex items-center justify-between mb-1">
                                                <label className="text-[10px] font-bold uppercase text-slate-500">Apgar (1m / 5m)</label>
                                                <button type="button" onClick={() => { setApgar1('9'); setApgar5('10'); }} className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-teal-100 dark:bg-teal-900/60 text-teal-700 dark:text-teal-300 hover:bg-teal-200 transition">
                                                    Quick 9/10
                                                </button>
                                            </div>
                                            <div className="flex items-center gap-1.5">
                                                <input type="number" min="0" max="10" value={apgar1} onChange={(e) => setApgar1(e.target.value)} placeholder="1m" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2.5 py-1.5 text-xs font-mono font-bold text-center" />
                                                <span className="font-mono font-bold text-slate-400">/</span>
                                                <input type="number" min="0" max="10" value={apgar5} onChange={(e) => setApgar5(e.target.value)} placeholder="5m" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2.5 py-1.5 text-xs font-mono font-bold text-center" />
                                            </div>
                                        </div>
                                        <div className="col-span-5">
                                            <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">DCC</label>
                                            <div className="grid grid-cols-2 gap-1.5">
                                                {['Yes', 'No'].map(opt => (
                                                    <button key={opt} type="button" onClick={() => setDcc(dcc === opt ? '' : opt)} className={`rounded-xl py-1.5 text-xs font-bold border transition ${dcc === opt ? (opt === 'Yes' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-700 text-white border-slate-700') : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}>
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {!isStillbirth && (
                                    <div className="space-y-2.5 pt-2 border-t border-slate-200/80 dark:border-slate-700/80">
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Baby Outcome / Disposition</label>
                                            <div className="grid grid-cols-3 gap-1.5">
                                                {['To Mother', 'Admit SCN', 'Admit NICU'].map(disp => (
                                                    <button
                                                        key={disp}
                                                        type="button"
                                                        onClick={() => setBabyDisposition(disp)}
                                                        className={`rounded-xl py-1.5 text-[11px] font-bold border transition ${
                                                            babyDisposition === disp
                                                                ? (disp === 'To Mother' ? 'bg-emerald-600 text-white border-emerald-600' : disp === 'Admit SCN' ? 'bg-amber-500 text-white border-amber-500' : 'bg-rose-600 text-white border-rose-600')
                                                                : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                                                        }`}
                                                    >
                                                        {disp}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {isAdmittedBaby && (
                                            <div className="rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 p-3 space-y-2.5">
                                                <div>
                                                    <label className="block text-[10px] font-bold uppercase text-amber-800 dark:text-amber-300 mb-1">Respiratory Support</label>
                                                    <div className="grid grid-cols-4 gap-1.5">
                                                        {RESP_SUPPORT_OPTIONS.map(rs => (
                                                            <button
                                                                key={rs}
                                                                type="button"
                                                                onClick={() => setRespSupport(rs)}
                                                                className={`rounded-lg py-1.5 text-[11px] font-bold border transition ${respSupport === rs ? 'bg-slate-900 dark:bg-amber-600 text-white border-transparent' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'}`}
                                                            >
                                                                {rs}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <PredictiveCombobox
                                                    label="Admission Diagnosis (Predictive — or type custom)"
                                                    placeholder="e.g. TTN, Congenital Pneumonia, IDM, Macrosomic..."
                                                    value={nicuDx}
                                                    onChange={setNicuDx}
                                                    suggestions={nicuDxOptions}
                                                    builtInList={NICU_DIAGNOSES}

            const [ctg, setCtg] = React.useState('Normal');
            const [nextReviewHours, setNextReviewHours] = React.useState(4);

            const handleSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const issues = [];
                if (fd.get('issue_scar')) issues.push('1 Prev Scar');
                if (fd.get('issue_hpt')) issues.push('HPT / PE');
                if (fd.get('issue_gdm')) issues.push('GDM');
                if (fd.get('issue_bmi')) issues.push(`Obesity BMI ${fd.get('bmi_value') || 'N/A'}`);
                if (fd.get('issue_size')) issues.push(fd.get('issue_size'));
                const other = fd.get('other_issues');
                if (other) other.split(',').forEach(s => { if (s.trim()) issues.push(s.trim()); });

                let admissionType = fd.get('admissionType');
                if (admissionType === 'IOL' && fd.get('iol_indication')) {
                    admissionType = `IOL - ${fd.get('iol_indication')}`;
                    const methods = ['px1', 'px2', 'px3', 'foley', 'ss'].map(m => fd.get(`method_${m}`)).filter(Boolean);
                    if (methods.length > 0) admissionType += ` (${methods.join(' + ')})`;
                }

                onSave({
                    id: Date.now().toString(),
                    name: String(fd.get('name') || '').trim(),
                    ic: String(fd.get('ic') || '').trim(),
                    location,
                    bookingTime: Date.now(),
                    bookedBy: String(fd.get('bookedBy') || '').trim(),
                    notedBy: null,
                    notedTime: null,
                    gravida: fd.get('gravida'),
                    para: fd.get('para'),
                    poa: fd.get('poa'),
                    race: fd.get('race') || '',
                    issues,
                    admissionType,
                    gbs: fd.get('gbs') === 'on',
                    epidural: fd.get('epidural') === 'on',
                    lastVE: {
                        time: fd.get('veTime'),
                        dilation: Number(fd.get('veDilation') || 0),
                        cervix: fd.get('veCervix')
                    },
                    nextReviewHours,
                    membrane,
                    liquor: membrane === 'Intact' ? 'N/A' : (fd.get('liquor') || 'Clear'),

                    manualOverride: 0
