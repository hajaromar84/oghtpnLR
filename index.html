    <style>
        body {

        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.7); }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .alert-ring {
            animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes slide-in-right {
            from { transform: translateX(100%); opacity: 0.6; }
            to { transform: translateX(0); opacity: 1; }
        }
        .drawer-enter {
            animation: slide-in-right 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-in-up {
            from { transform: translateY(8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .card-enter {
            animation: fade-in-up 0.2s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        // =========================================================================
        // CONFIGURATION & LIVE DATABASE URL
        // =========================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxhOdEe2s7TjLzAazo7zABxicoouEYHWyeGrCNiOfjyLf-ZF_fBCtr0sufNNQyOZPkj/exec';

        // Exact Ward & Modal Bed Mapping
        const LR_BEDS_LEFT = [
            'Room 3',
            'Room 4',
            'Room 5',
            'OT',
            'Room 1A (Overflow)',
            'Room 14A (Overflow)'
        ];
        const LR_BEDS_RIGHT = [
            'Room 6',
            'Room 13 (Urg)',
            'Room 2 (Urg)',
            'Room 7 (ISO)',
            'Room 1B (Overflow)',
            'Room 14B (Overflow)'
        ];

        // Visual Command Center Zones
        const ZONE_ACTIVE_BEDS = ['Room 3', 'Room 4', 'Room 5', 'Room 6', 'Room 13 (Urg)', 'Room 2 (Urg)'];
        const ZONE_SPECIALTY_BEDS = ['OT', 'Room 7 (ISO)'];
        const ZONE_OVERFLOW_BEDS = ['Room 1A (Overflow)', 'Room 1B (Overflow)', 'Room 14A (Overflow)', 'Room 14B (Overflow)'];

        // Sample Data Generator for Instant Preview / Demo Mode
        const getSamplePatients = () => {
            const now = Date.now();
            const minsAgo = (m) => toLocalISOString(new Date(now - m * 60000));
            const minsFromNow = (m) => toLocalISOString(new Date(now + m * 60000));
            return [
                {
                    id: 'demo-1', name: 'Nurul Huda binti Razak', ic: '940812-10-5122', location: '7A',
                    bookingTime: minsAgo(95), bookedBy: 'SN Aisyah', notedBy: 'Dr. Amir', notedTime: minsAgo(88),
                    gravida: 2, para: 1, poa: '39+4', issues: ['1 Prev Scar'], admissionType: 'Spontaneous',
                    gbs: true, epidural: false,
                    lastVE: { time: minsAgo(25), dilation: '9', cervix: 'Fully effaced', nextReviewTime: minsFromNow(35) },
                    membrane: 'SROM', liquor: 'TMSL', romTime: minsAgo(40), ctg: 'Suspicious',
                    status: 'WAITING', assignedBed: null, manualOverride: 0
                },
                {
                    id: 'demo-2', name: 'Siti Maisarah binti Kassim', ic: '970304-08-6014', location: 'PAC',
                    bookingTime: minsAgo(55), bookedBy: 'Dr. Farah', notedBy: null, notedTime: null,
                    gravida: 1, para: 0, poa: '40+2', issues: ['PIH (On Tx)'], admissionType: 'IOL - Postdates (Prostin x1)',
                    gbs: false, epidural: true,
                    lastVE: { time: minsAgo(30), dilation: '5', cervix: '1cm soft', nextReviewTime: minsFromNow(210), alertRole: 'LR', alertMsg: 'NEW BOOKING' },
                    membrane: 'Intact', liquor: 'N/A', romTime: null, ctg: 'Normal',
                    status: 'WAITING', assignedBed: null, manualOverride: 0
                },
                {
                    id: 'demo-3', name: 'Kavitha a/p Subramaniam', ic: '921120-14-5890', location: '7B',
                    bookingTime: minsAgo(140), bookedBy: 'SN Mei Ling', notedBy: 'Dr. Amir', notedTime: minsAgo(130),
                    gravida: 3, para: 2, poa: '38+6', issues: [], admissionType: 'Spontaneous',
                    gbs: false, epidural: false,
                    lastVE: { time: minsAgo(15), dilation: '7', cervix: 'Effaced', nextReviewTime: minsFromNow(105) },
                    membrane: 'SROM', liquor: 'Clear', romTime: minsAgo(60), ctg: 'Normal',
                    status: 'CALLED', calledToBed: 'Room 13 (Urg)', callTime: minsAgo(8), manualOverride: 0
                },
                {
                    id: 'demo-4', name: 'Aina Sofea binti Zulkifli', ic: '960518-10-5318', location: '7A',
                    bookingTime: minsAgo(320), bookedBy: 'SN Aisyah', notedBy: 'Dr. Hajar', notedTime: minsAgo(310),
                    gravida: 1, para: 0, poa: '39+1', issues: ['Obesity BMI 36.2'], admissionType: 'IOL - GDM (Foley)',
                    gbs: true, epidural: true,
                    lastVE: { time: minsAgo(255), dilation: '6', cervix: 'Effaced', nextReviewTime: minsAgo(15), reviewAcked: false },
                    membrane: 'ARM', liquor: 'Clear', romTime: minsAgo(255), ctg: 'Normal',
                    status: 'IN_LR', assignedBed: 'Room 3', admissionTime: minsAgo(270), manualOverride: 0
                },
                {
                    id: 'demo-5', name: 'Wong Mei Yan', ic: '910903-14-6210', location: 'PAC',
                    bookingTime: minsAgo(210), bookedBy: 'Dr. Lim', notedBy: 'Dr. Hajar', notedTime: minsAgo(205),
                    gravida: 2, para: 1, poa: '38+4', issues: ['LGA'], admissionType: 'Spontaneous',
                    gbs: false, epidural: false,
                    lastVE: { time: minsAgo(90), dilation: '8', cervix: 'Thin', nextReviewTime: minsFromNow(30) },
                    membrane: 'SROM', liquor: 'MMSL', romTime: minsAgo(110), ctg: 'Normal',
                    status: 'IN_LR', assignedBed: 'Room 4', admissionTime: minsAgo(160), manualOverride: 0
                },
                {
                    id: 'demo-6', name: 'Farhana binti Osman', ic: '930219-06-5104', location: '7B',
                    bookingTime: minsAgo(400), bookedBy: 'SN Nadia', notedBy: 'Dr. Amir', notedTime: minsAgo(390),
                    gravida: 4, para: 3, poa: '39+0', issues: ['PE (On Tx)'], admissionType: 'IOL - PE (Prostin x1)',
                    gbs: false, epidural: false,
                    lastVE: { time: minsAgo(180), dilation: '10', cervix: 'Fully', nextReviewTime: null },
                    membrane: 'ARM', liquor: 'Clear', romTime: minsAgo(200), ctg: 'Normal',
                    status: 'DELIVERED', assignedBed: 'Room 1A (Overflow)', admissionTime: minsAgo(350), deliveryTime: minsAgo(45), manualOverride: 0
                },
                {
                    id: 'demo-7', name: 'Priya a/p Ramesh', ic: '980711-10-5842', location: 'PAC',
                    bookingTime: minsAgo(310), bookedBy: 'Dr. Farah', notedBy: 'Dr. Hajar', notedTime: minsAgo(300),
                    gravida: 1, para: 0, poa: '40+0', issues: [], admissionType: 'Spontaneous',
                    gbs: false, epidural: true,
                    lastVE: { time: minsAgo(120), dilation: '10', cervix: 'Fully', nextReviewTime: null },
                    membrane: 'SROM', liquor: 'Clear', romTime: minsAgo(150), ctg: 'Normal',
                    status: 'DELIVERED', assignedBed: 'Room 1B (Overflow)', admissionTime: minsAgo(260), deliveryTime: minsAgo(20), manualOverride: 0
                }
            ];
        };

        // =========================================================================
        // AUDIO ENGINE (With Mute Control)
        // =========================================================================
        let audioCtx = null;
        const getAudioCtx = () => {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        };

        const playAlertSound = (type, isMuted = false) => {
            if (isMuted) return;
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'critical') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'new_booking') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.55);
                } else if (type === 'called') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.5);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(680, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.18);
                }
            } catch (e) {
                console.warn('Audio playback skipped:', e);
            }
        };

        // =========================================================================
        // DATE, TIME & CLINICAL HELPER FUNCTIONS (Local Timezone Safe)
        // =========================================================================
        const toLocalISOString = (dateObj) => {
            const pad = (n) => String(n).padStart(2, '0');
            return `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}T${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}:00`;
        };

        const parseSafeDate = (val) => {
            if (!val) return null;
            if (typeof val === 'number' || (typeof val === 'string' && !isNaN(val) && val.trim() !== '')) {
                const d = new Date(Number(val));
                return isNaN(d.getTime()) ? null : d;
            }
            const d = new Date(val);
            return isNaN(d.getTime()) ? null : d;
        };

        const formatDateTimeDisp = (dateTimeStr) => {
            if (!dateTimeStr) return '';
            const d = parseSafeDate(dateTimeStr);
            if (!d) return String(dateTimeStr);
            const today = new Date();
            const hrs = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            if (d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) {
                return `${hrs}:${mins}`;
            }
            return `${d.getDate()}/${d.getMonth() + 1} ${hrs}:${mins}`;
        };

        const formatDuration = (startTime, currentTime) => {
            const d = parseSafeDate(startTime);
            if (!d) return '0m';
            const diffMins = Math.max(0, Math.floor((currentTime - d.getTime()) / 60000));
            const days = Math.floor(diffMins / 1440);
            const hrs = Math.floor((diffMins % 1440) / 60);
            const mins = diffMins % 60;
            if (days > 0) return `${days}d ${hrs}h`;
            if (hrs > 0) return `${hrs}h ${mins}m`;
            return `${mins}m`;
        };

        const formatMembraneLiquor = (patient) => {
            if (patient.membrane === 'Intact') return 'MI (Intact)';
            let l = patient.liquor || 'N/A';
            if (l === 'Clear') l = 'Clear';
            else if (l === 'Blood stained') l = 'Blood';
            const timeStr = patient.romTime ? ` @ ${formatDateTimeDisp(patient.romTime)}` : '';
            if (patient.membrane === 'PROM_MI') return `PROM${timeStr} • ${l}`;
            return `${patient.membrane}${timeStr} • ${l}`;
        };

        // Clinical Priority Triage Algorithm (Exact Department Weights)
        const calculatePriority = (patient) => {
            let score = 0;
            if (patient.admissionType && patient.admissionType.includes('IOL')) score += 10;
            if (patient.ctg === 'Pathological') score += 100;
            if (patient.ctg === 'Suspicious') score += 50;

            if (patient.liquor === 'TMSL' || patient.liquor === 'Blood stained') score += 40;
            else if (patient.liquor === 'MMSL') score += 30;
            else if (patient.liquor === 'LMSL') score += 15;

            const hasRom = ['SROM', 'ARM'].includes(patient.membrane) || patient.membrane === 'PROM_MI';
            if (hasRom) {
                score += 15;
                if (patient.gbs) score += 15;
            }

            if (patient.lastVE) {
                const dil = Number(patient.lastVE.dilation);
                if (dil >= 9) score += 40;
                else if (dil >= 7) score += 20;
            }

            if (
                patient.issues &&
                patient.issues.some(i => typeof i === 'string' && i.includes('1 Prev Scar')) &&
                patient.lastVE &&
                Number(patient.lastVE.dilation) > 4
            ) {
                score += 15;
            }

            return score + (Number(patient.manualOverride) || 0);
        };

        // Partogram Progress Bar Helper
        const getReviewProgress = (lastVE, currentTime) => {
            if (!lastVE?.nextReviewTime) return null;
            const nextDate = parseSafeDate(lastVE.nextReviewTime);
            if (!nextDate) return null;
            const startDate = parseSafeDate(lastVE.time) || new Date(nextDate.getTime() - 4 * 3600000);
            const totalMs = Math.max(1, nextDate.getTime() - startDate.getTime());
            const remainingMs = nextDate.getTime() - currentTime;
            const pctRemaining = Math.max(0, Math.min(100, (remainingMs / totalMs) * 100));
            const minsLeft = Math.ceil(remainingMs / 60000);
            const isOverdue = remainingMs <= 0;
            const isSoon = !isOverdue && minsLeft <= 30;
            return { pctRemaining, minsLeft, isOverdue, isSoon, nextTimeStr: formatDateTimeDisp(lastVE.nextReviewTime) };
        };

        // =========================================================================
        // CUSTOM 5-MINUTE ROUNDED DATE/TIME PICKER (Local Timezone Locked)
        // =========================================================================
        const CustomDateTimePicker = ({ name, defaultValue, disabled }) => {
            const [date, setDate] = React.useState('');
            const [hour, setHour] = React.useState('00');
            const [minute, setMinute] = React.useState('00');

            React.useEffect(() => {
                const d = parseSafeDate(defaultValue) || new Date();
                const localDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                setDate(localDate);
                setHour(String(d.getHours()).padStart(2, '0'));
                const roundedMins = Math.round(d.getMinutes() / 5) * 5;
                setMinute(String(roundedMins === 60 ? 0 : roundedMins).padStart(2, '0'));
            }, [defaultValue]);

            const minutesList = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55'];
            const hoursList = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
            const valueString = (date && hour && minute) ? `${date}T${hour}:${minute}:00` : '';

            return (
                <div className={`flex items-center gap-1.5 ${disabled ? 'opacity-40 pointer-events-none' : ''}`}>
                    <input type="hidden" name={name} value={valueString} />
                    <input
                        type="date"
                        value={date}
                        onChange={e => setDate(e.target.value)}
                        disabled={disabled}
                        required={!disabled}
                        className="flex-1 min-w-0 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-2.5 py-2 text-xs font-medium text-slate-800 dark:text-slate-100 focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 outline-none"
                    />
                    <div className="flex items-center rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-1">
                        <select
                            value={hour}
                            onChange={e => setHour(e.target.value)}
                            disabled={disabled}
                            required={!disabled}
                            className="bg-transparent py-2 pl-1 pr-0.5 text-xs font-mono font-semibold text-slate-800 dark:text-slate-100 outline-none"
                        >
                            {hoursList.map(h => <option key={h} value={h} className="dark:bg-slate-800">{h}</option>)}
                        </select>
                        <span className="font-mono font-bold text-slate-400">:</span>
                        <select
                            value={minute}
                            onChange={e => setMinute(e.target.value)}
                            disabled={disabled}
                            required={!disabled}
                            className="bg-transparent py-2 pl-0.5 pr-1 text-xs font-mono font-semibold text-slate-800 dark:text-slate-100 outline-none"
                        >
                            {minutesList.map(m => <option key={m} value={m} className="dark:bg-slate-800">{m}</option>)}
                        </select>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // HERO DILATION BADGE (1-Second Clinical Scanning)
        // =========================================================================
        const DilationBadge = ({ dilation, compact = false }) => {
            if (dilation === undefined || dilation === null || dilation === '') return null;
            const cm = Number(dilation);
            let style = 'bg-slate-100 text-slate-700 border-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:border-slate-700';
            if (cm >= 9) style = 'bg-rose-600 text-white border-rose-700 shadow-sm shadow-rose-500/20';
            else if (cm >= 7) style = 'bg-amber-500 text-white border-amber-600 shadow-sm shadow-amber-500/20';
            else if (cm >= 4) style = 'bg-teal-50 text-teal-800 border-teal-200 dark:bg-teal-950/60 dark:text-teal-300 dark:border-teal-800';

            return (
                <div className={`inline-flex items-baseline gap-0.5 font-mono font-bold rounded-lg border shrink-0 ${style} ${compact ? 'px-2 py-0.5 text-xs' : 'px-2.5 py-1 text-sm'}`}>
                    <span>{dilation}</span>
                    <span className="text-[10px] font-semibold opacity-80">cm</span>
                </div>
            );
        };

        // =========================================================================
        // BED SLOT CARD (Active, Specialty, and Overflow Variants)
        // =========================================================================
        const BedSlot = ({
            bedName, patient, incoming, isLR, isTVMode, isOverflowZone, isSpecialtyZone,
            currentTime, onUpdate, onDeliver, onSendToOT, onClear, onArrived, onAcknowledge, onMoveBed
        }) => {
            const [ackName, setAckName] = React.useState('');
            const isVacant = !patient;
            const isUrgentBed = bedName.includes('(Urg)');
            const isISOBed = bedName.includes('(ISO)');
            const isOTBed = bedName === 'OT';

            // 1. INCOMING / EN-ROUTE STATE
            if (incoming && isVacant) {
                const isEnRoute = incoming.status === 'EN_ROUTE';
                return (
                    <div className={`card-enter rounded-xl border-2 border-dashed p-3.5 flex flex-col justify-between transition-all relative overflow-hidden ${isOverflowZone ? 'min-h-[110px]' : 'min-h-[175px]'} ${
                        isEnRoute
                            ? 'bg-teal-50/70 dark:bg-teal-950/30 border-teal-400 dark:border-teal-600'
                            : 'bg-sky-50/70 dark:bg-sky-950/30 border-sky-400 dark:border-sky-600'
                    }`}>
                        <div className="flex items-center justify-between">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{bedName}</span>
                            <span className={`inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                                isEnRoute ? 'bg-teal-100 text-teal-800 dark:bg-teal-900/60 dark:text-teal-300' : 'bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-300'
                            }`}>
                                <i className={`ph-fill ${isEnRoute ? 'ph-person-simple-walk animate-bounce' : 'ph-spinner-gap animate-spin'}`}></i>
                                {isEnRoute ? 'En Route' : 'Called'}
                            </span>
                        </div>
                        <div className="my-2 text-center">
                            <p className="text-sm font-bold text-slate-800 dark:text-white leading-tight">{incoming.name}</p>
                            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 font-mono">
                                {isEnRoute
                                    ? `Sent by ${incoming.wardNotedBy}`
                                    : `Called ${formatDuration(incoming.callTime, currentTime)} ago • ${incoming.location}`}
                            </p>
                        </div>
                        {isEnRoute && isLR && !isTVMode ? (
                            <button
                                onClick={() => onArrived(incoming.id)}
                                className="w-full bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold py-2 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5"
                            >
                                <i className="ph-bold ph-check-circle"></i> Confirm Arrival
                            </button>
                        ) : (
                            <div className="text-center text-[11px] font-medium text-slate-500 dark:text-slate-400">
                                {isEnRoute ? 'Awaiting arrival in LR' : 'Awaiting ward transfer'}
                            </div>
                        )}
                    </div>
                );
            }

            // 2. VACANT BED STATE
            if (isVacant) {
                return (
                    <div className={`rounded-xl border border-dashed transition-all flex flex-col items-center justify-center text-center p-3 ${
                        isOverflowZone ? 'min-h-[96px]' : isSpecialtyZone ? 'min-h-[125px]' : 'min-h-[175px]'
                    } ${
                        isUrgentBed
                            ? 'bg-amber-50/40 dark:bg-amber-950/10 border-amber-300/80 dark:border-amber-800/50 text-amber-700/70 dark:text-amber-500/70'
                            : isISOBed
                                ? 'bg-violet-50/40 dark:bg-violet-950/10 border-violet-300/70 dark:border-violet-800/50 text-violet-600/70 dark:text-violet-400/70'
                                : 'bg-white/60 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 text-slate-400 dark:text-slate-600'
                    }`}>
                        <div className="flex items-center gap-1.5 mb-1">
                            <i className={`ph ${isOTBed ? 'ph-first-aid-kit' : isISOBed ? 'ph-shield-warning' : 'ph-bed'} text-xl`}></i>
                            <span className="font-bold text-xs tracking-tight">{bedName}</span>
                        </div>
                        <span className="text-[11px] font-medium opacity-75">Available</span>
                    </div>
                );
            }

            // 3. OCCUPIED BED STATE
            const isDelivered = patient.status === 'DELIVERED';
            const reviewProg = !isDelivered ? getReviewProgress(patient.lastVE, currentTime) : null;
            const isReviewOverdue = Boolean(reviewProg?.isOverdue);
            const needsNormalAck = patient.lastVE?.alertRole === 'LR';
            const needsReviewAck = isReviewOverdue && !patient.lastVE?.reviewAcked && isLR;
            const hasActiveAlert = !isDelivered && (needsNormalAck || needsReviewAck);
            const isAbnormalLiq = patient.membrane !== 'Intact' && !['Clear', 'N/A'].includes(patient.liquor);
            const isAbnormalCTG = patient.ctg !== 'Normal';

            // Sleek Compact Holding Card for Delivered Patients
            if (isDelivered) {
                return (
                    <div className={`card-enter rounded-xl border bg-emerald-50/70 dark:bg-emerald-950/25 border-emerald-200 dark:border-emerald-800/70 shadow-sm flex flex-col justify-between overflow-hidden ${
                        isOverflowZone ? 'p-3 min-h-[115px]' : 'p-3.5 min-h-[175px]'
                    }`}>
                        <div>
                            <div className="flex items-center justify-between gap-2 mb-1.5">
                                <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-600 text-white">
                                    <i className="ph-fill ph-check-circle"></i> {bedName}
                                </span>
                                <span className="inline-flex items-center gap-1 text-[11px] font-mono font-bold text-emerald-800 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/60 px-2 py-0.5 rounded-md">
                                    <i className="ph-fill ph-baby"></i> {formatDateTimeDisp(patient.deliveryTime)}
                                </span>
                            </div>
                            <h3 className={`font-bold text-slate-900 dark:text-white leading-snug truncate ${isTVMode ? 'text-base' : 'text-sm'}`}>
                                {patient.name}
                            </h3>
                            <p className="text-[11px] font-mono text-slate-500 dark:text-slate-400 truncate">
                                {patient.ic} • {patient.location}
                            </p>
                            {patient.issues && patient.issues.length > 0 && (
                                <p className="text-[11px] font-medium text-emerald-800 dark:text-emerald-300 mt-1.5 line-clamp-1">
                                    {patient.issues.join(' • ')}
                                </p>
                            )}
                        </div>

                        {!isTVMode && (
                            <div className="pt-2.5 mt-2 border-t border-emerald-200/80 dark:border-emerald-800/60">
                                {isLR ? (
                                    <div className="flex gap-1.5">
                                        <button
                                            onClick={onMoveBed}
                                            className="flex-1 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-[11px] font-semibold py-1.5 px-2 rounded-lg transition flex items-center justify-center gap-1"
                                        >
                                            <i className="ph-bold ph-arrows-left-right"></i> Move
                                        </button>
                                        <button
                                            onClick={onClear}
                                            className="flex-[1.6] bg-teal-600 hover:bg-teal-700 text-white text-[11px] font-semibold py-1.5 px-2 rounded-lg shadow-sm transition flex items-center justify-center gap-1"
                                        >
                                            <i className="ph-bold ph-sign-out"></i> Transfer to ward
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center text-[11px] font-semibold text-emerald-700 dark:text-emerald-400">
                                        Delivered • Awaiting Ward Transfer
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            }

            // Active Labour Bed Card
            return (
                <div className={`card-enter rounded-xl border bg-white dark:bg-slate-900 shadow-sm flex flex-col justify-between overflow-hidden transition-all relative ${
                    hasActiveAlert
                        ? 'border-rose-500 dark:border-rose-500 alert-ring'
                        : isAbnormalCTG
                            ? 'border-amber-400 dark:border-amber-500/80'
                            : 'border-slate-200 dark:border-slate-800'
                }`}>
                    {/* Persistent Action Alert Banner */}
                    {hasActiveAlert && (
                        <div className="bg-rose-600 text-white px-3 py-2">
                            <div className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide mb-1.5">
                                <i className="ph-fill ph-warning-circle text-base shrink-0 animate-pulse"></i>
                                <span className="truncate">{needsNormalAck ? patient.lastVE?.alertMsg : 'Partogram Review Overdue'}</span>
                            </div>
                            {!isTVMode && isLR && (
                                <div className="flex gap-1.5">
                                    <input
                                        type="text"
                                        value={ackName}
                                        onChange={e => setAckName(e.target.value)}
                                        placeholder="MO/SN Name"
                                        className="flex-1 min-w-0 text-xs px-2 py-1 rounded-md bg-white/95 text-slate-900 placeholder-slate-400 outline-none"
                                    />
                                    <button
                                        onClick={() => { if (ackName.trim()) { onAcknowledge(patient.id, ackName.trim(), needsNormalAck ? 'NORMAL' : 'REVIEW'); setAckName(''); } }}
                                        className="bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold px-2.5 py-1 rounded-md transition shrink-0"
                                    >
                                        ACK
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    <div className="p-3.5 flex-1 flex flex-col">
                        {/* Top Row: Bed Pill + Stay Timer + Hero Dilation */}
                        <div className="flex items-start justify-between gap-2 mb-2">
                            <div className="flex flex-wrap items-center gap-1.5">
                                <span className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md ${
                                    isOTBed
                                        ? 'bg-rose-600 text-white'
                                        : isUrgentBed
                                            ? 'bg-amber-100 text-amber-900 dark:bg-amber-900/50 dark:text-amber-300'
                                            : isISOBed
                                                ? 'bg-violet-100 text-violet-900 dark:bg-violet-900/50 dark:text-violet-300'
                                                : 'bg-teal-600 text-white'
                                }`}>
                                    {bedName}
                                </span>
                                {patient.admissionTime && (
                                    <span className="inline-flex items-center gap-1 text-[11px] font-mono font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded-md">
                                        <i className="ph ph-clock"></i> {formatDuration(patient.admissionTime, currentTime)}
                                    </span>
                                )}
                            </div>
                            <DilationBadge dilation={patient.lastVE?.dilation} />
                        </div>

                        {/* Patient Identity */}
                        <h3 className={`font-bold text-slate-900 dark:text-white leading-tight truncate ${isTVMode ? 'text-base' : 'text-sm'}`}>
                            {patient.name}
                        </h3>
                        <p className="text-[11px] font-mono text-slate-500 dark:text-slate-400 mt-0.5">
                            G{patient.gravida}P{patient.para} • {patient.poa} • <span className="text-teal-700 dark:text-teal-400 font-sans font-semibold">{patient.admissionType}</span>
                        </p>

                        {/* Clinical Tags */}
                        {(patient.gbs || patient.epidural || (patient.issues && patient.issues.length > 0)) && (
                            <div className="flex flex-wrap gap-1 mt-2">
                                {patient.gbs && (
                                    <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800">
                                        GBS +ve
                                    </span>
                                )}
                                {patient.epidural && (
                                    <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-200 dark:bg-sky-950/60 dark:text-sky-300 dark:border-sky-800">
                                        Epidural
                                    </span>
                                )}
                                {patient.issues && patient.issues.map((issue, idx) => (
                                    <span key={idx} className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-700 border border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700">
                                        {issue}
                                    </span>
                                ))}
                            </div>
                        )}

                        {/* Scannable Clinical Snapshot */}
                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-800 space-y-1 text-xs">
                            <div className="flex items-center justify-between gap-2">
                                <span className="text-slate-500 dark:text-slate-400 truncate">
                                    Cx {patient.lastVE?.cervix || '-'} <span className="font-mono text-[10px]">({formatDateTimeDisp(patient.lastVE?.time)})</span>
                                </span>
                                <span className={`font-bold shrink-0 px-1.5 py-0.5 rounded text-[11px] ${
                                    patient.ctg === 'Pathological'
                                        ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                                        : patient.ctg === 'Suspicious'
                                            ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                                            : 'text-emerald-700 dark:text-emerald-400'
                                }`}>
                                    CTG: {patient.ctg}
                                </span>
                            </div>
                            <div className="flex items-center justify-between gap-2 text-[11px]">
                                <span className={isAbnormalLiq ? 'text-rose-600 dark:text-rose-400 font-bold' : 'text-slate-600 dark:text-slate-300 font-medium'}>
                                    {formatMembraneLiquor(patient)}
                                </span>
                                {reviewProg && (
                                    <span className={`font-mono font-bold shrink-0 ${
                                        reviewProg.isOverdue
                                            ? 'text-rose-600 dark:text-rose-400 animate-pulse'
                                            : reviewProg.isSoon
                                                ? 'text-amber-600 dark:text-amber-400'
                                                : 'text-slate-500 dark:text-slate-400'
                                    }`}>
                                        Rev {reviewProg.nextTimeStr}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Clean Ghost Action Footer */}
                        {!isTVMode && (
                            <div className="mt-3 pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center gap-1">
                                {isLR ? (
                                    <>
                                        <button
                                            onClick={onUpdate}
                                            className={`flex-1 py-1.5 px-2 rounded-lg text-[11px] font-semibold transition flex items-center justify-center gap-1 ${
                                                isReviewOverdue
                                                    ? 'bg-rose-50 hover:bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300'
                                                    : 'hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'
                                            }`}
                                            title="Update VE / Status"
                                        >
                                            <i className="ph-bold ph-pencil-simple"></i> VE
                                        </button>
                                        <button
                                            onClick={onMoveBed}
                                            className="py-1.5 px-2 rounded-lg text-[11px] font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center gap-1"
                                            title="Move Bed"
                                        >
                                            <i className="ph-bold ph-arrows-left-right"></i> Move
                                        </button>
                                        {!isOTBed && (
                                            <button
                                                onClick={onSendToOT}
                                                className="py-1.5 px-2 rounded-lg text-[11px] font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition flex items-center justify-center gap-1"
                                                title="Send to OT"
                                            >
                                                <i className="ph-bold ph-warning"></i> OT
                                            </button>
                                        )}
                                        <button
                                            onClick={onDeliver}
                                            className="flex-1 py-1.5 px-2 rounded-lg text-[11px] font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition flex items-center justify-center gap-1"
                                        >
                                            <i className="ph-bold ph-baby"></i> Deliver
                                        </button>
                                    </>
                                ) : (
                                    <div className="w-full text-center text-[11px] font-medium text-slate-400 dark:text-slate-500 py-0.5">
                                        Active in Labour Room
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Visual Partogram Progress Bar (Bottom Edge) */}
                    {reviewProg && (
                        <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 overflow-hidden" title={`Next Review: ${reviewProg.nextTimeStr}`}>
                            <div
                                className={`h-full transition-all duration-500 ${
                                    reviewProg.isOverdue
                                        ? 'bg-rose-500 w-full animate-pulse'
                                        : reviewProg.isSoon
                                            ? 'bg-amber-500'
                                            : 'bg-teal-500'
                                }`}
                                style={{ width: reviewProg.isOverdue ? '100%' : `${Math.max(6, reviewProg.pctRemaining)}%` }}
                            />
                        </div>
                    )}
                </div>
            );
        };

        // =========================================================================
        // WAITING QUEUE PATIENT CARD (Refined Clinical Hierarchy)
        // =========================================================================
        const PatientCard = ({
            patient, userRole, priorityScore, waitTime, queueNumber, isTVMode,
            onCall, onUpdate, onBumpUp, onBumpDown, onCancel, onAcknowledge, onWardSend, currentTime
        }) => {
            const [ackName, setAckName] = React.useState('');
            const [wardAckName, setWardAckName] = React.useState('');

            const isLR = userRole === 'LR' || userRole === 'Admin';
            const canEdit = isLR || patient.location === userRole;
            const myAlertRole = isLR ? 'LR' : userRole;

            const needsNormalAck = patient.lastVE?.alertRole === myAlertRole;
            const reviewProg = getReviewProgress(patient.lastVE, currentTime);
            const isReviewOverdue = Boolean(reviewProg?.isOverdue);
            const needsReviewAck = isReviewOverdue && !patient.lastVE?.reviewAcked && isLR;
            const hasActiveAlert = needsNormalAck || needsReviewAck;
            const isAbnormalLiq = patient.membrane !== 'Intact' && !['Clear', 'N/A'].includes(patient.liquor);

            let stripeColor = 'bg-emerald-500';
            if (priorityScore > 40) stripeColor = 'bg-rose-500';
            else if (priorityScore > 20) stripeColor = 'bg-amber-500';

            return (
                <div className={`card-enter relative rounded-xl border bg-white dark:bg-slate-900 shadow-sm overflow-hidden transition-all ${
                    hasActiveAlert
                        ? 'border-rose-500 alert-ring'
                        : 'border-slate-200 dark:border-slate-800 hover:border-teal-300 dark:hover:border-teal-700'
                }`}>
                    {/* Left Severity Edge Bar */}
                    <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${stripeColor}`} />

                    <div className="pl-4 pr-3.5 py-3">
                        {/* Persistent Red Alert Box */}
                        {hasActiveAlert && (
                            <div className="bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 rounded-lg p-2.5 mb-2.5">
                                <div className="text-rose-700 dark:text-rose-300 font-bold text-[11px] flex items-center gap-1.5 uppercase tracking-wide mb-1.5">
                                    <i className="ph-fill ph-warning-circle text-base animate-pulse"></i>
                                    {needsNormalAck ? patient.lastVE?.alertMsg : 'Next Review Overdue'}
                                </div>
                                {!isTVMode && (
                                    <div className="flex gap-1.5">
                                        <input
                                            type="text"
                                            value={ackName}
                                            onChange={e => setAckName(e.target.value)}
                                            placeholder="Your Name (MO/SN)"
                                            className="flex-1 min-w-0 text-xs px-2.5 py-1.5 rounded-md border border-rose-300 dark:border-rose-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-rose-500"
                                        />
                                        <button
                                            onClick={() => { if (ackName.trim()) { onAcknowledge(patient.id, ackName.trim(), needsNormalAck ? 'NORMAL' : 'REVIEW'); setAckName(''); } }}
                                            className="bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-md transition"
                                        >
                                            ACK
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Header Row */}
                        <div className="flex items-start justify-between gap-2">
                            <div className="flex items-start gap-2.5 min-w-0">
                                <span className="font-mono text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 w-6 h-6 rounded-md flex items-center justify-center shrink-0 mt-0.5">
                                    #{queueNumber}
                                </span>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5 flex-wrap">
                                        <h3 className={`font-bold text-slate-900 dark:text-white leading-snug truncate ${isTVMode ? 'text-base' : 'text-sm'}`}>
                                            {patient.name}
                                        </h3>
                                        {patient.manualOverride !== null && Number(patient.manualOverride) !== 0 && (
                                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-mono font-bold ${
                                                patient.manualOverride > 0
                                                    ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300'
                                                    : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                                            }`}>
                                                MO {patient.manualOverride > 0 ? `+${patient.manualOverride}` : patient.manualOverride}
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-[11px] font-mono text-slate-500 dark:text-slate-400 mt-0.5">
                                        {patient.ic} • G{patient.gravida}P{patient.para} • {patient.poa}
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-col items-end gap-1 shrink-0">
                                <DilationBadge dilation={patient.lastVE?.dilation} compact />
                                <div className="flex items-center gap-1.5 text-[11px] font-semibold">
                                    <span className="text-teal-700 dark:text-teal-400 bg-teal-50 dark:bg-teal-950/60 px-1.5 py-0.5 rounded">{patient.location}</span>
                                    <span className="font-mono text-slate-500 dark:text-slate-400">{waitTime}</span>
                                </div>
                            </div>
                        </div>

                        {/* Clinical Tags */}
                        <div className="flex flex-wrap gap-1 mt-2">
                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                patient.admissionType?.includes('IOL')
                                    ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-indigo-950/60 dark:text-indigo-300 dark:border-indigo-800'
                                    : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                            }`}>
                                {patient.admissionType}
                            </span>
                            {patient.gbs && (
                                <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800">
                                    GBS +ve
                                </span>
                            )}
                            {patient.epidural && (
                                <span className="px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-200 dark:bg-sky-950/60 dark:text-sky-300 dark:border-sky-800">
                                    Epidural
                                </span>
                            )}
                            {patient.issues && patient.issues.map((issue, idx) => (
                                <span key={idx} className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-50/80 text-amber-800 border border-amber-200/80 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800/60">
                                    {issue}
                                </span>
                            ))}
                        </div>

                        {/* Clinical Metrics Row */}
                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs space-y-1">
                            <div className="flex items-center justify-between gap-2">
                                <span className="text-slate-600 dark:text-slate-300 truncate">
                                    Cx {patient.lastVE?.cervix || '-'} <span className="font-mono text-[10px] text-slate-400">({formatDateTimeDisp(patient.lastVE?.time)})</span>
                                </span>
                                <span className={`font-bold shrink-0 px-1.5 py-0.5 rounded text-[11px] ${
                                    patient.ctg === 'Pathological'
                                        ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
                                        : patient.ctg === 'Suspicious'
                                            ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                                            : 'text-emerald-700 dark:text-emerald-400'
                                }`}>
                                    CTG: {patient.ctg}
                                </span>
                            </div>
                            <div className="flex items-center justify-between gap-2 text-[11px]">
                                <span className={isAbnormalLiq ? 'text-rose-600 dark:text-rose-400 font-bold' : 'text-slate-500 dark:text-slate-400 font-medium'}>
                                    {formatMembraneLiquor(patient)}
                                </span>
                                {reviewProg && (
                                    <span className={`font-mono font-bold ${reviewProg.isOverdue ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-slate-400'}`}>
                                        Rev {reviewProg.nextTimeStr}
                                    </span>
                                )}
                            </div>
                        </div>

                        {/* Called / Action Footer */}
                        {patient.status === 'CALLED' ? (
                            <div className="mt-3 bg-sky-50 dark:bg-sky-950/50 border border-sky-200 dark:border-sky-800 rounded-lg p-2.5">
                                <div className="flex items-center justify-between text-xs font-bold text-sky-800 dark:text-sky-300 mb-2">
                                    <span className="flex items-center gap-1.5">
                                        <i className="ph-fill ph-bell-ringing animate-bounce"></i> CALLED TO {patient.calledToBed}
                                    </span>
                                    <span className="font-mono text-[11px]">{formatDateTimeDisp(patient.callTime)}</span>
                                </div>
                                {!isLR && !isTVMode ? (
                                    canEdit ? (
                                        <div className="flex gap-1.5">
                                            <input
                                                type="text"
                                                value={wardAckName}
                                                onChange={e => setWardAckName(e.target.value)}
                                                placeholder="Sent By (Staff Name)"
                                                className="flex-1 min-w-0 text-xs px-2.5 py-1.5 rounded-md border border-sky-300 dark:border-sky-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white outline-none focus:border-sky-500"
                                            />
                                            <button
                                                onClick={() => { if (wardAckName.trim()) { onWardSend(patient.id, wardAckName.trim()); setWardAckName(''); } }}
                                                className="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-3 py-1.5 rounded-md transition shrink-0"
                                            >
                                                Send
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="text-center text-[11px] font-medium text-sky-700 dark:text-sky-400">
                                            Awaiting {patient.location} Transfer
                                        </div>
                                    )
                                ) : (
                                    <div className="text-center text-[11px] font-medium text-sky-700 dark:text-sky-400">
                                        Awaiting Ward Transfer
                                    </div>
                                )}
                            </div>
                        ) : (
                            !isTVMode && (
                                <div className="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800 space-y-2">
                                    <div className="flex items-center gap-1.5">
                                        {!isLR ? (
                                            canEdit ? (
                                                <>
                                                    <button
                                                        onClick={onUpdate}
                                                        className="flex-1 py-1.5 px-2.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 transition flex items-center justify-center gap-1.5"
                                                    >
                                                        <i className="ph-bold ph-pencil-simple"></i> Update VE
                                                    </button>
                                                    <button
                                                        onClick={onCancel}
                                                        className="py-1.5 px-2.5 rounded-lg text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition"
                                                    >
                                                        Cancel
                                                    </button>
                                                </>
                                            ) : (
                                                <div className="w-full text-center py-1 text-[11px] font-medium text-slate-400 dark:text-slate-500">
                                                    View Only • Booked by {patient.location}
                                                </div>
                                            )
                                        ) : (
                                            <>
                                                <button
                                                    onClick={onCall}
                                                    className="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold bg-teal-600 hover:bg-teal-700 text-white shadow-sm transition flex items-center justify-center gap-1.5"
                                                >
                                                    <i className="ph-bold ph-bed"></i> Call to Bed
                                                </button>
                                                <button
                                                    onClick={onBumpUp}
                                                    title="Nudge Priority Up (+10)"
                                                    className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-amber-600 hover:border-amber-300 dark:hover:bg-slate-800 transition"
                                                >
                                                    <i className="ph-bold ph-arrow-up"></i>
                                                </button>
                                                <button
                                                    onClick={onBumpDown}
                                                    title="Nudge Priority Down (-10)"
                                                    className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition"
                                                >
                                                    <i className="ph-bold ph-arrow-down"></i>
                                                </button>
                                            </>
                                        )}
                                    </div>
                                    <div className="flex items-center justify-between text-[10px] text-slate-400 dark:text-slate-500">
                                        <span>Booked: <strong className="text-slate-600 dark:text-slate-300">{patient.bookedBy || 'Unknown'}</strong></span>
                                        {patient.notedBy ? (
                                            <span className="text-emerald-600 dark:text-emerald-400 font-medium flex items-center gap-1">
                                                <i className="ph-fill ph-check-circle"></i> {patient.notedBy}
                                            </span>
                                        ) : (
                                            <span className="text-amber-600 dark:text-amber-400 font-semibold">Pending Ack</span>
                                        )}
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // SLIDE-OVER BOOKING DRAWER (Tactile Pill Selectors)
        // =========================================================================
        const BookingDrawer = ({ userWard, onClose, onSave }) => {
            const [admissionType, setAdmissionType] = React.useState('Spontaneous');
            const [membrane, setMembrane] = React.useState('Intact');
            const [liquor, setLiquor] = React.useState('Clear');
            const [ctg, setCtg] = React.useState('Normal');
            const [reviewInterval, setReviewInterval] = React.useState('4');
            const [gbs, setGbs] = React.useState(false);
            const [epidural, setEpidural] = React.useState(false);
            const [hasScar, setHasScar] = React.useState(false);
            const [isHPT, setIsHPT] = React.useState(false);
            const [isObese, setIsObese] = React.useState(false);
            const [iolMethods, setIolMethods] = React.useState([]);

            const toggleIolMethod = (m) => {
                setIolMethods(prev => prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m]);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const issues = [];
                if (hasScar) issues.push('1 Prev Scar');
                if (isHPT) {
                    const hptType = fd.get('hpt_type');
                    const hptTx = fd.get('hpt_treatment') === 'yes' ? '(On Tx)' : '(No Tx)';
                    if (hptType) issues.push(`${hptType} ${hptTx}`);
                }
                if (isObese) issues.push(`Obesity BMI ${fd.get('bmi_value') || 'Unknown'}`);
                if (fd.get('issue_size')) issues.push(fd.get('issue_size'));
                const otherIssues = fd.get('other_issues');
                if (otherIssues) otherIssues.split(',').forEach(i => { if (i.trim()) issues.push(i.trim()); });

                let finalAdmissionType = admissionType;
                if (admissionType === 'IOL' && fd.get('iol_indication')) {
                    finalAdmissionType = `IOL - ${fd.get('iol_indication')}`;
                    if (iolMethods.length > 0) finalAdmissionType += ` (${iolMethods.join(' + ')})`;
                }

                const veTime = fd.get('veTime');
                const romTime = membrane === 'Intact' ? null : (fd.get('romTime') || null);

                let nextReviewTime = null;
                if (reviewInterval) {
                    const veDate = parseSafeDate(veTime) || new Date();
                    veDate.setHours(veDate.getHours() + parseInt(reviewInterval, 10));
                    nextReviewTime = toLocalISOString(veDate);
                }

                onSave({
                    id: Date.now().toString(),
                    name: fd.get('name'),
                    ic: fd.get('ic'),
                    location: userWard,
                    bookingTime: toLocalISOString(new Date()),
                    bookedBy: fd.get('bookedBy'),
                    notedBy: null,
                    notedTime: null,
                    gravida: fd.get('gravida'),
                    para: fd.get('para'),
                    poa: fd.get('poa'),
                    issues: issues.filter(Boolean),
                    admissionType: finalAdmissionType,
                    gbs,
                    epidural,
                    lastVE: {
                        time: veTime,
                        dilation: fd.get('veDilation'),
                        cervix: fd.get('veCervix'),
                        nextReviewTime
                    },
                    membrane,
                    liquor: membrane === 'Intact' ? 'N/A' : liquor,
                    romTime,
                    ctg,
                    status: 'WAITING',
                    assignedBed: null,
                    deliveryTime: null,
                    basePriority: 0,
                    manualOverride: 0
                });
            };

            const pillClass = (active, color = 'teal') => {
                if (!active) return 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-transparent hover:bg-slate-200 dark:hover:bg-slate-700';
                if (color === 'rose') return 'bg-rose-600 text-white border-rose-600 shadow-sm';
                if (color === 'amber') return 'bg-amber-500 text-white border-amber-500 shadow-sm';
                if (color === 'emerald') return 'bg-emerald-600 text-white border-emerald-600 shadow-sm';
                if (color === 'sky') return 'bg-sky-600 text-white border-sky-600 shadow-sm';
                return 'bg-teal-600 text-white border-teal-600 shadow-sm';
            };

            return (
                <div className="fixed inset-0 z-50 flex justify-end bg-slate-950/50 backdrop-blur-sm">
                    <div className="drawer-enter w-full max-w-xl bg-white dark:bg-slate-900 h-full shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col">
                        <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                            <div>
                                <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                    <i className="ph-fill ph-plus-circle text-teal-600"></i> Book Labour Room Bed
                                </h2>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Booking from <strong className="text-teal-700 dark:text-teal-400">Ward {userWard}</strong></p>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                <i className="ph-bold ph-x text-xl"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-5">
                            {/* Patient Details */}
                            <div className="space-y-3">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">1. Patient & Booking Details</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Patient Full Name</label>
                                        <input required name="name" type="text" placeholder="e.g. Siti Aminah binti Ali" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm focus:bg-white dark:focus:bg-slate-900 focus:border-teal-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">IC / Passport / MRN</label>
                                        <input required name="ic" type="text" placeholder="e.g. 950412-10-5432" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono focus:bg-white dark:focus:bg-slate-900 focus:border-teal-500 outline-none" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-12 gap-3">
                                    <div className="col-span-12 sm:col-span-5">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Booked By (Staff Name)</label>
                                        <input required name="bookedBy" type="text" placeholder="Dr. / SN Name" className="w-full rounded-lg border border-teal-200 dark:border-teal-800 bg-teal-50/50 dark:bg-teal-950/30 px-3 py-2 text-sm focus:bg-white dark:focus:bg-slate-900 focus:border-teal-500 outline-none" />
                                    </div>
                                    <div className="col-span-4 sm:col-span-2">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Gravida</label>
                                        <input required name="gravida" type="number" min="1" placeholder="G" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono outline-none focus:border-teal-500" />
                                    </div>
                                    <div className="col-span-4 sm:col-span-2">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Para</label>
                                        <input required name="para" type="number" min="0" placeholder="P" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono outline-none focus:border-teal-500" />
                                    </div>
                                    <div className="col-span-4 sm:col-span-3">
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">POA (W+D)</label>
                                        <input required name="poa" type="text" placeholder="39+2" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono outline-none focus:border-teal-500" />
                                    </div>
                                </div>
                            </div>

                            {/* Admission Type & Risks */}
                            <div className="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">2. Labour Mode & Risk Factors</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    {['Spontaneous', 'IOL'].map(type => (
                                        <button
                                            key={type}
                                            type="button"
                                            onClick={() => setAdmissionType(type)}
                                            className={`py-2 px-3 rounded-lg text-xs font-bold border transition ${pillClass(admissionType === type)}`}
                                        >
                                            {type === 'IOL' ? 'IOL (Induction of Labour)' : 'Spontaneous Labour'}
                                        </button>
                                    ))}
                                </div>

                                {admissionType === 'IOL' && (
                                    <div className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Indication for IOL</label>
                                            <input required name="iol_indication" type="text" placeholder="e.g. Postdates, GDM, Oligohydramnios" className="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm outline-none focus:border-teal-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Methods Used</label>
                                            <div className="flex flex-wrap gap-1.5">
                                                {['Prostin x1', 'Prostin x2', 'Prostin x3', 'Foley', 'S&S'].map(m => (
                                                    <button
                                                        key={m}
                                                        type="button"
                                                        onClick={() => toggleIolMethod(m)}
                                                        className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition ${pillClass(iolMethods.includes(m))}`}
                                                    >
                                                        {m}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Tactile Risk Pills */}
                                <div className="flex flex-wrap gap-2">
                                    <button type="button" onClick={() => setGbs(!gbs)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(gbs, 'rose')}`}>
                                        GBS Positive
                                    </button>
                                    <button type="button" onClick={() => setEpidural(!epidural)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(epidural, 'sky')}`}>
                                        Epidural Req.
                                    </button>
                                    <button type="button" onClick={() => setHasScar(!hasScar)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(hasScar, 'amber')}`}>
                                        1 Prev Scar
                                    </button>
                                    <button type="button" onClick={() => setIsHPT(!isHPT)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(isHPT, 'amber')}`}>
                                        HPT / PIH / PE
                                    </button>
                                    <button type="button" onClick={() => setIsObese(!isObese)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${pillClass(isObese)}`}>
                                        Obesity
                                    </button>
                                </div>

                                {isHPT && (
                                    <div className="grid grid-cols-2 gap-2 p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800">
                                        <select name="hpt_type" required className="rounded-lg border border-amber-300 dark:border-amber-700 bg-white dark:bg-slate-900 px-2.5 py-2 text-xs font-semibold outline-none">
                                            <option value="">Select Diagnosis...</option>
                                            <option value="Chronic HPT">Chronic HPT</option>
                                            <option value="PIH">PIH</option>
                                            <option value="PE">Pre-eclampsia (PE)</option>
                                        </select>
                                        <select name="hpt_treatment" required className="rounded-lg border border-amber-300 dark:border-amber-700 bg-white dark:bg-slate-900 px-2.5 py-2 text-xs font-semibold outline-none">
                                            <option value="">Treatment Status...</option>
                                            <option value="yes">On Treatment</option>
                                            <option value="no">No Treatment</option>
                                        </select>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    {isObese && (
                                        <input required type="number" step="0.1" name="bmi_value" placeholder="BMI (e.g. 38.5)" className="rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs font-mono outline-none focus:border-teal-500" />
                                    )}
                                    <select name="issue_size" className="rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs font-medium outline-none focus:border-teal-500">
                                        <option value="">Normal Fetal Growth</option>
                                        <option value="LGA">LGA (Macrosomia)</option>
