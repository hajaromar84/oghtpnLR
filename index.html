        // =========================================================================
        // MAIN APPLICATION COMPONENT
        // =========================================================================
        const App = () => {
            const [userRole, setUserRole] = React.useState(null);
            const [activeView, setActiveView] = React.useState('BOARD'); // 'BOARD' | 'CENSUS'
            const [mobileTab, setMobileTab] = React.useState('BOARD'); // 'QUEUE' | 'BOARD'
            const [queueFilter, setQueueFilter] = React.useState('ALL'); // 'ALL' | 'MINE' | 'HIGH' | 'CALLED'

            const [patients, setPatients] = React.useState([]);
            const [censusDeliveries, setCensusDeliveries] = React.useState([]);
            const [customIndications, setCustomIndications] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('lr_custom_lscs_indications');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [passwords, setPasswords] = React.useState({
                LR: 'lr123', PAC: 'pac123', '7A': '7a123', '7B': '7b123', Admin: 'admin123'
            });

            const [isSyncing, setIsSyncing] = React.useState(false);
            const [darkMode, setDarkMode] = React.useState(false);
            const [tvMode, setTvMode] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const [currentTime, setCurrentTime] = React.useState(Date.now());
            const [toast, setToast] = React.useState(null);
            const [alertBanner, setAlertBanner] = React.useState(null); // { title, subtitle, type: 'critical' | 'new_booking' | 'called' }
            const [flashingIds, setFlashingIds] = React.useState({}); // { [patientId]: 'critical' | 'new_booking' | 'called' }

            // Modals & Drawers
            const [isBookingOpen, setIsBookingOpen] = React.useState(false);
            const [updateModalPatient, setUpdateModalPatient] = React.useState(null);
            const [assignBedState, setAssignBedState] = React.useState(null); // { patient, isMove }
            const [deliverModalPatient, setDeliverModalPatient] = React.useState(null);
            const [isDirectDeliveryOpen, setIsDirectDeliveryOpen] = React.useState(false);
            const [isPasswordModalOpen, setIsPasswordModalOpen] = React.useState(false);

            // Traffic cop & cross-device alert refs
            const pauseSyncUntilRef = React.useRef(0);
            const prevPatientsMapRef = React.useRef(null);
            const bannerTimerRef = React.useRef(null);
            const isMutedRef = React.useRef(isMuted);
            const userRoleRef = React.useRef(userRole);

            React.useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);
            React.useEffect(() => { userRoleRef.current = userRole; }, [userRole]);

            // Unlock Web Audio on first user interaction so cross-device chimes always ring
            React.useEffect(() => {
                const unlock = () => { getAudioCtx(); };
                window.addEventListener('pointerdown', unlock, { passive: true });
                return () => window.removeEventListener('pointerdown', unlock);
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 30000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Triggers loud chime + 15-second blinking banner + blinking patient card
            const triggerAlert = React.useCallback((type, title, subtitle, patientId = null) => {
                playAlertSound(type, isMutedRef.current);
                setAlertBanner({ type, title, subtitle });
                if (bannerTimerRef.current) clearTimeout(bannerTimerRef.current);
                bannerTimerRef.current = setTimeout(() => setAlertBanner(null), 15000);

                if (patientId) {
                    setFlashingIds(prev => ({ ...prev, [patientId]: type }));
                    setTimeout(() => {
                        setFlashingIds(prev => {
                            const next = { ...prev };
                            delete next[patientId];
                            return next;
                        });
                    }, 15000);
                }
            }, []);

            const fetchBoardData = React.useCallback(async () => {
                if (!API_URL || Date.now() < pauseSyncUntilRef.current) return;
                try {
                    setIsSyncing(true);
                    const res = await fetch(API_URL);
                    const data = await res.json();
                    const incomingPatients = Array.isArray(data)
                        ? data
                        : (Array.isArray(data.patients) ? data.patients : null);

                    if (incomingPatients) {
                        const role = userRoleRef.current;
                        const isLRRole = role === 'LR' || role === 'Admin';

                        // Cross-device alert detection (runs after initial baseline load)
                        if (role && prevPatientsMapRef.current) {
                            const prevMap = prevPatientsMapRef.current;
                            incomingPatients.forEach(p => {
                                const oldP = prevMap.get(p.id);
                                if (isLRRole) {
                                    // 1. Brand-new booking arrived from a Ward
                                    if (!oldP && p.status === 'WAITING') {
                                        const highRisk = calculatePriority(p) >= 50 || p.ctg === 'Pathological';
                                        triggerAlert(
                                            highRisk ? 'critical' : 'new_booking',
                                            highRisk ? `HIGH RISK BOOKING — ${p.name}` : `NEW LR BOOKING — ${p.name}`,
                                            `From ${p.location} • ${p.lastVE?.dilation ?? 0}cm • CTG: ${p.ctg}`,
                                            p.id
                                        );
                                    }
                                    // 2. Existing waiting patient escalated in risk
                                    else if (oldP && p.status === 'WAITING') {
                                        const oldScore = calculatePriority({ ...oldP, manualOverride: 0 });
                                        const newScore = calculatePriority({ ...p, manualOverride: 0 });
                                        if (newScore > oldScore + 15 || (oldP.ctg !== 'Pathological' && p.ctg === 'Pathological')) {
                                            triggerAlert(
                                                'critical',
                                                `CLINICAL ESCALATION — ${p.name}`,
                                                `${p.location} • CTG: ${p.ctg} • ${p.lastVE?.dilation ?? 0}cm`,
                                                p.id
                                            );
                                        }
                                    }
                                    // 3. Ward confirmed patient is en route to LR
                                    else if (oldP && oldP.status === 'CALLED' && p.status === 'EN_ROUTE') {
                                        playAlertSound('update', isMutedRef.current);
                                        showToast(`${p.name} is EN ROUTE to ${p.calledToBed} (sent by ${p.wardNotedBy}).`, 'info');
                                    }
                                } else {
                                    // Ward view: alert loudly when LR calls a patient from this ward
                                    if (p.location === role && p.status === 'CALLED' && (!oldP || oldP.status !== 'CALLED')) {
                                        triggerAlert(
                                            'called',
                                            `PATIENT CALLED TO ${p.calledToBed} — ${p.name}`,
                                            `Please prepare and confirm transfer to Labour Room`,
                                            p.id
                                        );
                                    }
                                }
                            });
                        }

                        // Update baseline map
                        const nextMap = new Map();
                        incomingPatients.forEach(p => nextMap.set(p.id, p));
                        prevPatientsMapRef.current = nextMap;
                        setPatients(incomingPatients);
                    }

                    if (!Array.isArray(data)) {
                        if (data.passwords) setPasswords(prev => ({ ...prev, ...data.passwords }));
                        if (Array.isArray(data.censusDeliveries)) setCensusDeliveries(data.censusDeliveries);
                        if (Array.isArray(data.learnedIndications) && data.learnedIndications.length > 0) {
                            setCustomIndications(prev => {
                                const map = new Map();
                                [...prev, ...data.learnedIndications].forEach(ind => {
                                    const clean = String(ind || '').trim();
                                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                                });
                                const merged = Array.from(map.values());
                                try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(merged)); } catch (e) {}
                                return merged;
                            });
                        }
                    }
                } catch (err) {
                    console.error('Sync fetch failed:', err);
                } finally {
                    setIsSyncing(false);
                }
            }, [triggerAlert]);

            // Initial fetch & 10-second background sync polling
            React.useEffect(() => {
                fetchBoardData();
                const poll = setInterval(fetchBoardData, 10000);
                return () => clearInterval(poll);
            }, [fetchBoardData]);

            const syncToDB = (action, payload) => {
                if (!API_URL) return;
                // Pause background GET polling briefly so optimistic local state isn't overwritten
                pauseSyncUntilRef.current = Date.now() + 4500;
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                }).catch(err => console.error('Sync POST failed:', err));
            };

            const upsertPatient = (updated) => {
                setPatients(prev => {
                    const next = prev.map(p => p.id === updated.id ? updated : p);
                    const map = new Map();
                    next.forEach(p => map.set(p.id, p));
                    prevPatientsMapRef.current = map;
                    return next;
                });
                syncToDB('UPDATE', { patient: updated });
            };

            const learnIndication = (indication) => {
                const clean = String(indication || '').trim();
                if (!clean) return;
                setCustomIndications(prev => {
                    if (prev.some(i => i.toLowerCase() === clean.toLowerCase())) return prev;
                    const merged = [clean, ...prev];
                    try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(merged)); } catch (e) {}
                    return merged;
                });
            };

            const allLSCSIndications = React.useMemo(() => {
                const map = new Map();
                [...customIndications, ...LSCS_INDICATIONS].forEach(ind => {
                    const clean = String(ind || '').trim();
                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                });
                return Array.from(map.values());
            }, [customIndications]);

            const isSameWard = (loc, role) =>
                String(loc || '').trim().toUpperCase() === String(role || '').trim().toUpperCase();

            const handleWardSend = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                if (userRole !== 'Admin' && !isSameWard(target.location, userRole)) {
                    showToast(`Only ${target.location} can confirm transfer for this patient.`, 'warning');
                    return;
                }
                upsertPatient({ ...target, status: 'EN_ROUTE', wardSendTime: Date.now(), wardNotedBy: staffName });
                playAlertSound('update', isMuted);
                showToast(`Transfer confirmed by ${staffName}. Patient en route to LR.`);
            };

            const handleNewBooking = (newPatient) => {
                setPatients(prev => {
                    const next = [...prev, newPatient];
                    const map = new Map();
                    next.forEach(p => map.set(p.id, p));
                    prevPatientsMapRef.current = map;
                    return next;
                });
                syncToDB('ADD', { patient: newPatient });
                setIsBookingOpen(false);
                const highRisk = calculatePriority(newPatient) >= 50 || newPatient.ctg === 'Pathological';
                triggerAlert(
                    highRisk ? 'critical' : 'new_booking',
                    highRisk ? `HIGH RISK BOOKING — ${newPatient.name}` : `NEW BOOKING — ${newPatient.name}`,
                    `From ${newPatient.location} • ${newPatient.lastVE?.dilation ?? 0}cm • CTG: ${newPatient.ctg}`,
                    newPatient.id
                );
            };

            const handleStatusUpdate = (updatedFields) => {
                const target = patients.find(p => p.id === updatedFields.id);
                if (!target) return;
                if (userRole !== 'Admin' && userRole !== 'LR' && !isSameWard(target.location, userRole)) {
                    showToast(`Only ${target.location} can update this patient.`, 'warning');
                    setUpdateModalPatient(null);
                    return;
                }
                const updated = { ...target, ...updatedFields, manualOverride: 0 };
                const oldScore = calculatePriority({ ...target, manualOverride: 0 });
                const newScore = calculatePriority(updated);
                upsertPatient(updated);
                setUpdateModalPatient(null);
                if (updated.status === 'WAITING' && (newScore > oldScore + 15 || (target.ctg !== 'Pathological' && updated.ctg === 'Pathological'))) {
                    triggerAlert(
                        'critical',
                        `URGENT ESCALATION — ${updated.name}`,
                        `${updated.location} • CTG: ${updated.ctg} • ${updated.lastVE?.dilation ?? 0}cm`,
                        updated.id
                    );
                } else {
                    playAlertSound('update', isMuted);
                    showToast('Clinical VE / CTG updated.');
                }
            };

            const handleConfirmBed = (bed) => {
                const { patient, isMove } = assignBedState;
                if (isMove) {
                    upsertPatient({ ...patient, assignedBed: bed });
                    playAlertSound('update', isMuted);
                    showToast(`Moved ${patient.name} to ${bed}.`);
                } else {
                    upsertPatient({ ...patient, status: 'CALLED', calledToBed: bed, callTime: Date.now() });
                    triggerAlert('called', `CALLED TO ${bed} — ${patient.name}`, `Ward ${patient.location} notified for transfer.`, patient.id);
                }
                setAssignBedState(null);
            };

            const handleArrived = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                const bed = target.calledToBed || target.assignedBed || 'Room 3';
                upsertPatient({ ...target, status: 'IN_LR', assignedBed: bed, admissionTime: Date.now() });
                playAlertSound('update', isMuted);
                showToast(`${target.name} admitted to ${bed}.`);
            };

            const handleCancelCall = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'WAITING', calledToBed: null, callTime: null, wardSendTime: null, wardNotedBy: null });
                playAlertSound('update', isMuted);
                showToast(`Returned ${target.name} to waiting queue.`);
            };

            const handleSendToOT = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'IN_LR', assignedBed: 'OT' });
                triggerAlert('emergency', `EMERGENCY TO OT — ${target.name}`, `Transferred to Operating Theatre immediately.`);
            };

            const handleConfirmDelivery = (deliveryData) => {
                const target = deliverModalPatient;
                if (!target) return;
                const isAlreadyDischarged = target.status === 'DISCHARGED';
                const updated = {
                    ...target,
                    ...deliveryData,
                    status: isAlreadyDischarged ? 'DISCHARGED' : 'DELIVERED'
                };
                setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
                setCensusDeliveries(prev => {
                    const exists = prev.some(d => d.id === updated.id);
                    return exists ? prev.map(d => d.id === updated.id ? updated : d) : [updated, ...prev];
                });
                syncToDB('UPDATE', { patient: updated });
                if (updated.lscsIndication) learnIndication(updated.lscsIndication);
                setDeliverModalPatient(null);
                showToast('Delivery record saved & synced to 24h Census.');
            };

            const handleDirectDeliverySave = (record) => {
                setCensusDeliveries(prev => [record, ...prev]);
                if (record.lscsIndication) learnIndication(record.lscsIndication);
                syncToDB('ADD_DIRECT_DELIVERY', { patient: record });
                setIsDirectDeliveryOpen(false);
                showToast(`Logged ${record.deliveryMode} for ${record.name} in 24h Census.`);
            };

            const handleTransferToWard = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                const discharged = { ...target, status: 'DISCHARGED' };
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: discharged });
                showToast(`${target.name} transferred to ward. Bed cleared.`);
            };

            const handleCancelBooking = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                if (userRole !== 'Admin' && !isSameWard(target.location, userRole)) {
                    showToast(`Only ${target.location} can cancel this booking.`, 'warning');
                    return;
                }
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: { ...target, status: 'CANCELLED' } });
                showToast('Booking cancelled.');
            };

            const handleNudge = (id, delta) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, manualOverride: (Number(target.manualOverride) || 0) + delta });
                playAlertSound('update', isMuted);
                showToast(`Priority nudged ${delta > 0 ? 'UP' : 'DOWN'}.`);
            };

            const handleNoteBooking = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, notedBy: staffName, notedTime: Date.now() });
                playAlertSound('update', isMuted);
                showToast(`Acknowledged by ${staffName}.`);
            };

            const handleSavePasswords = (newPasswords) => {
                setPasswords(newPasswords);
                syncToDB('UPDATE_PASSWORDS', { passwords: newPasswords });
                setIsPasswordModalOpen(false);
                showToast('Department passwords updated.');
            };

            // Computed Queues & KPIs
            const waitingAll = React.useMemo(() => {
                return patients
                    .filter(p => p.status === 'WAITING' || p.status === 'CALLED' || p.status === 'EN_ROUTE')
                    .sort((a, b) => {
                        const rank = (s) => (s === 'EN_ROUTE' ? 0 : s === 'CALLED' ? 1 : 2);
                        const rDiff = rank(a.status) - rank(b.status);
                        if (rDiff !== 0) return rDiff;
                        if (a.status !== 'WAITING') return (a.callTime || 0) - (b.callTime || 0);
                        const diff = calculatePriority(b) - calculatePriority(a);
                        return diff !== 0 ? diff : (a.bookingTime || 0) - (b.bookingTime || 0);
                    });
            }, [patients]);

            const waitingFiltered = React.useMemo(() => {
                return waitingAll.filter(p => {
                    if (queueFilter === 'MINE') return p.location === userRole;
                    if (queueFilter === 'HIGH') return calculatePriority(p) >= 35 || p.ctg !== 'Normal';
                    if (queueFilter === 'CALLED') return p.status === 'CALLED' || p.status === 'EN_ROUTE';
                    return true;
                });
            }, [waitingAll, queueFilter, userRole]);

            const activeOccCount = ZONE_ACTIVE_URGENT.filter(b => patients.some(p => p.assignedBed === b && (p.status === 'IN_LR' || p.status === 'DELIVERED'))).length;
            const overflowOccCount = ZONE_OVERFLOW.filter(b => patients.some(p => p.assignedBed === b && (p.status === 'IN_LR' || p.status === 'DELIVERED'))).length;
            const overdueCount = patients.filter(p => {
                if (p.status !== 'IN_LR' || !p.lastVE?.nextReview) return false;
                const d = parseLocalDateTime(p.lastVE.nextReview);
                return d && d.getTime() <= currentTime;
            }).length;

            if (!userRole) {
                return (
                    <LoginScreen
                        onLogin={(role) => {
                            setUserRole(role);
                            getAudioCtx();
                        }}
                        passwords={passwords}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />
                );
            }

            const canManageLR = userRole === 'LR' || userRole === 'Admin';

            const renderBed = (bed, compact = false) => {
                const occupant = patients.find(p => p.assignedBed === bed && (p.status === 'IN_LR' || p.status === 'DELIVERED'));
                const incoming = patients.find(p => p.calledToBed === bed && (p.status === 'CALLED' || p.status === 'EN_ROUTE'));
                return (
                    <BedSlot
                        key={bed}
                        bedName={bed}
                        patient={occupant}
                        incoming={incoming}
                        canManageLR={canManageLR}
                        tvMode={tvMode}
                        compact={compact}
                        currentTime={currentTime}
                        onUpdate={() => setUpdateModalPatient(occupant)}
                        onMove={() => setAssignBedState({ patient: occupant, isMove: true })}
                        onDeliver={() => setDeliverModalPatient(occupant)}
                        onEditDelivery={() => setDeliverModalPatient(occupant)}
                        onSendToOT={() => handleSendToOT(occupant?.id)}
                        onClear={() => handleTransferToWard(occupant?.id)}
                        onArrived={handleArrived}
                        onCancelCall={handleCancelCall}
                    />
                );
            };

            return (
                <div className="min-h-screen h-screen flex flex-col bg-slate-50 dark:bg-slate-950 overflow-hidden">
                    {/* TOP NAVIGATION BAR */}
                    <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 shrink-0 z-20">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                <i className="ph-fill ph-heartbeat text-xl"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <h1 className="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
                                        LR Smart Board
                                    </h1>
                                    <span className="hidden sm:inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-600 dark:text-emerald-400">
                                        <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : 'bg-emerald-500'}`}></span>
                                        Live
                                    </span>
                                </div>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate hidden sm:block">
                                    Hospital Tengku Permaisuri Norashikin • {userRole === 'LR' ? 'Labour Room' : userRole === 'Admin' ? 'System Admin' : `Ward ${userRole}`}
                                </p>
                            </div>
                        </div>

                        {/* Center View Switcher: Board | 24h Census */}
                        <div className="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 shrink-0">
                            <button
                                onClick={() => setActiveView('BOARD')}
                                className={`rounded-lg px-3 py-1.5 text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'BOARD' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}
                            >
                                <i className="ph-fill ph-squares-four"></i>
                                <span>Live Board</span>
                            </button>
                            <button
                                onClick={() => setActiveView('CENSUS')}
                                className={`rounded-lg px-3 py-1.5 text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'CENSUS' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}
                            >
                                <i className="ph-fill ph-chart-bar"></i>
                                <span>24h Census</span>
                            </button>
                        </div>

                        {/* Right Controls */}
                        <div className="flex items-center gap-1.5 shrink-0">
                            {activeView === 'BOARD' && (
                                <button
                                    onClick={() => setIsBookingOpen(true)}
                                    className="rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold px-3 py-2 shadow-sm transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i>
                                    <span className="hidden sm:inline">Book Bed</span>
                                </button>
                            )}

                            {userRole === 'Admin' && (
                                <button
                                    onClick={() => setIsPasswordModalOpen(true)}
                                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                    title="Manage Passwords"
                                >
                                    <i className="ph-bold ph-gear"></i>
                                </button>
                            )}

                            <button
                                onClick={() => setTvMode(!tvMode)}
                                className={`hidden lg:flex p-2 rounded-xl transition ${tvMode ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                                title="Toggle TV Wallboard Mode"
                            >
                                <i className="ph-bold ph-television"></i>
                            </button>

                            <button
                                onClick={() => {
                                    const nextMuted = !isMuted;
                                    setIsMuted(nextMuted);
                                    if (!nextMuted) playAlertSound('new_booking', false);
                                }}
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                title={isMuted ? 'Unmute & Test Chime' : 'Mute Chimes'}
                            >
                                <i className={`ph-fill ${isMuted ? 'ph-speaker-slash text-rose-500' : 'ph-speaker-high text-teal-600 dark:text-teal-400'}`}></i>
                            </button>

                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                title="Toggle Dark Mode"
                            >
                                <i className={`ph-fill ${darkMode ? 'ph-sun text-amber-400' : 'ph-moon'}`}></i>
                            </button>

                            <button
                                onClick={() => setUserRole(null)}
                                className="p-2 rounded-xl bg-slate-100 hover:bg-rose-50 dark:bg-slate-800 text-slate-500 hover:text-rose-600 transition"
                                title="Logout"
                            >
                                <i className="ph-bold ph-sign-out"></i>
                            </button>
                        </div>
                    </header>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed top-16 right-4 z-50 rounded-2xl px-4 py-3 text-xs font-bold text-white shadow-xl flex items-center gap-2 ${toast.type === 'warning' ? 'bg-rose-600' : toast.type === 'info' ? 'bg-slate-900' : 'bg-teal-600'}`}>
                            <i className={`ph-fill ${toast.type === 'warning' ? 'ph-warning' : 'ph-check-circle'} text-base`}></i>
                            {toast.message}
                        </div>
                    )}

                    {/* BLINKING CLINICAL ALERT BANNER (15s auto-clear or manual dismiss) */}
                    {alertBanner && (
                        <div className={`px-4 py-2.5 flex items-center justify-between gap-3 text-white shrink-0 z-30 border-b-2 ${
                            alertBanner.type === 'critical' || alertBanner.type === 'emergency'
                                ? 'bg-rose-600 border-rose-300 animate-pulse'
                                : alertBanner.type === 'called'
                                    ? 'bg-sky-600 border-sky-300 animate-pulse'
                                    : 'bg-amber-500 border-amber-200 animate-pulse'
                        }`}>
                            <div className="flex items-center gap-2.5 min-w-0">
                                <i className="ph-fill ph-bell-ringing text-xl shrink-0 animate-bounce"></i>
                                <div className="min-w-0">
                                    <p className="text-xs sm:text-sm font-extrabold tracking-wide truncate">{alertBanner.title}</p>
                                    <p className="text-[11px] font-medium opacity-95 truncate">{alertBanner.subtitle}</p>
                                </div>
                            </div>
                            <button
                                onClick={() => setAlertBanner(null)}
                                className="rounded-xl bg-black/20 hover:bg-black/35 px-3 py-1.5 text-[11px] font-bold whitespace-nowrap transition"
                            >
                                Dismiss
                            </button>
                        </div>
                    )}

                    {/* MAIN CONTENT: 24H CENSUS OR LIVE COMMAND CENTER */}
                    {activeView === 'CENSUS' ? (
                        <CensusView
                            censusDeliveries={censusDeliveries}
                            currentTime={currentTime}
                            canManageLR={canManageLR}
                            onOpenDirectLog={() => setIsDirectDeliveryOpen(true)}
                            onEditDelivery={(item) => setDeliverModalPatient(item)}
                            onCopySummary={(text) => {
                                const ok = copyTextToClipboard(text);
                                showToast(ok ? 'WhatsApp passover summary copied!' : 'Could not copy automatically.', ok ? 'success' : 'warning');
                            }}
                        />
                    ) : (
                        <>
                            {/* LIVE TELEMETRY KPI BAR */}
                            <div className="bg-white/90 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-between gap-4 text-xs shrink-0 overflow-x-auto">
                                <div className="flex items-center gap-4 whitespace-nowrap">
                                    <span className="font-bold text-slate-600 dark:text-slate-300">
                                        Active Beds: <strong className="font-mono text-teal-600 dark:text-teal-400">{activeOccCount}/{ZONE_ACTIVE_URGENT.length}</strong>
                                    </span>
                                    <span className="font-bold text-slate-600 dark:text-slate-300">
                                        Overflow: <strong className="font-mono text-indigo-600 dark:text-indigo-400">{overflowOccCount}/{ZONE_OVERFLOW.length}</strong>
                                    </span>
                                    <span className="font-bold text-slate-600 dark:text-slate-300">
                                        Waiting: <strong className="font-mono text-amber-600 dark:text-amber-400">{waitingAll.length}</strong>
                                    </span>
                                    {overdueCount > 0 && (
                                        <span className="px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 font-extrabold animate-pulse">
                                            {overdueCount} VE Overdue
                                        </span>
                                    )}
                                </div>
                                <div className="font-mono font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap hidden sm:block">
                                    {new Date(currentTime).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
                                </div>
                            </div>

                            {/* MOBILE TAB BAR (Queue vs Board) */}
                            <div className="lg:hidden grid grid-cols-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
                                <button
                                    onClick={() => setMobileTab('QUEUE')}
                                    className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'QUEUE' ? 'border-teal-600 text-teal-700 dark:text-teal-300' : 'border-transparent text-slate-500'}`}
                                >
                                    Waiting Queue ({waitingAll.length})
                                </button>
                                <button
                                    onClick={() => setMobileTab('BOARD')}
                                    className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'BOARD' ? 'border-teal-600 text-teal-700 dark:text-teal-300' : 'border-transparent text-slate-500'}`}
                                >
                                    LR Board (12)
                                </button>
                            </div>

                            {/* SPLIT WORKSPACE */}
                            <div className="flex-1 flex overflow-hidden">
                                {/* LEFT: WAITING QUEUE */}
                                <aside className={`${mobileTab === 'QUEUE' ? 'flex' : 'hidden'} lg:flex flex-col w-full lg:w-[34%] xl:w-[30%] border-r border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-950`}>
                                    <div className="p-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 space-y-2 shrink-0">
                                        <div className="flex items-center justify-between">
                                            <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                                                <i className="ph-fill ph-list-numbers text-teal-600 text-base"></i> Waiting Queue
                                            </h2>
                                            <span className="px-2 py-0.5 rounded-full bg-slate-900 dark:bg-slate-700 text-white font-mono text-[11px] font-bold">
                                                {waitingFiltered.length}
                                            </span>
                                        </div>
                                        <div className="flex gap-1 overflow-x-auto">
                                            {[
                                                { id: 'ALL', label: 'All' },
                                                { id: 'HIGH', label: 'High Risk' },
                                                { id: 'CALLED', label: 'Called' },
                                                ...(!canManageLR ? [{ id: 'MINE', label: `Ward ${userRole}` }] : [])
                                            ].map(f => (
                                                <button
                                                    key={f.id}
                                                    onClick={() => setQueueFilter(f.id)}
                                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition whitespace-nowrap ${queueFilter === f.id ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                                                >
                                                    {f.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                                        {waitingFiltered.length === 0 ? (
                                            <div className="text-center py-12 text-slate-400">
                                                <i className="ph-fill ph-check-circle text-3xl mb-1 opacity-50"></i>
                                                <p className="text-xs font-medium">No patients in this queue view.</p>
                                            </div>
                                        ) : (
                                            waitingFiltered.map((p, idx) => (
                                                <PatientCard
                                                    key={p.id}
                                                    patient={p}
                                                    canManageLR={canManageLR}
                                                    userRole={userRole}
                                                    priorityScore={calculatePriority(p)}
                                                    waitTime={formatDuration(p.bookingTime, currentTime)}
                                                    queueNumber={idx + 1}
                                                    flashType={flashingIds[p.id] || null}
                                                    onCall={() => setAssignBedState({ patient: p, isMove: false })}
                                                    onUpdate={() => setUpdateModalPatient(p)}
                                                    onBumpUp={() => handleNudge(p.id, 10)}
                                                    onBumpDown={() => handleNudge(p.id, -10)}
                                                    onCancel={() => handleCancelBooking(p.id)}
                                                    onNoteBooking={handleNoteBooking}
                                                    onWardSend={handleWardSend}
                                                    onArrived={handleArrived}
                                                    onCancelCall={handleCancelCall}
                                                />
                                            ))
                                        )}
                                    </div>
                                </aside>

                                {/* RIGHT: 3-ZONE LABOUR ROOM COMMAND CENTER */}
                                <main className={`${mobileTab === 'BOARD' ? 'flex' : 'hidden'} lg:flex flex-1 flex-col overflow-y-auto custom-scrollbar p-4 space-y-5`}>
                                    {/* Zone 1: Active & Urgent Rooms */}
                                    <section>
                                        <div className="flex items-center justify-between mb-2.5">
                                            <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                                Zone 1 • Active &amp; Urgent Delivery Rooms
                                            </h2>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                                            {ZONE_ACTIVE_URGENT.map(bed => renderBed(bed, false))}
                                        </div>
                                    </section>

                                    {/* Zone 2: Escalation (OT & Isolation) */}
                                    <section>
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                                            Zone 2 • Escalation &amp; Isolation
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {ZONE_ESCALATION.map(bed => renderBed(bed, false))}
                                        </div>
                                    </section>

                                    {/* Zone 3: Post-Delivery Overflow Holding Bay */}
                                    <section>
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                                            Zone 3 • Overflow Holding Bay
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                                            {ZONE_OVERFLOW.map(bed => renderBed(bed, true))}
                                        </div>
                                    </section>
                                </main>
                            </div>
                        </>
                    )}

                    {/* MODALS & DRAWERS */}
                    {isBookingOpen && (
                        <BookingDrawer
                            userWard={userRole}
                            onClose={() => setIsBookingOpen(false)}
                            onSave={handleNewBooking}
                        />
                    )}
                    {updateModalPatient && (
                        <UpdateVEDrawer
                            patient={updateModalPatient}
                            onClose={() => setUpdateModalPatient(null)}
                            onSave={handleStatusUpdate}
                        />
                    )}
                    {assignBedState && (
                        <AssignBedModal
                            patient={assignBedState.patient}
                            isMove={assignBedState.isMove}
                            activePatients={patients}
                            onClose={() => setAssignBedState(null)}
                            onConfirm={handleConfirmBed}
                        />
                    )}
                    {deliverModalPatient && (
                        <DeliveryModal
                            patient={deliverModalPatient}
                            indicationOptions={allLSCSIndications}
                            onClose={() => setDeliverModalPatient(null)}
                            onConfirm={handleConfirmDelivery}
                        />
                    )}
                    {isDirectDeliveryOpen && (
                        <DirectDeliveryModal
                            indicationOptions={allLSCSIndications}
                            onClose={() => setIsDirectDeliveryOpen(false)}
                            onSave={handleDirectDeliverySave}
                        />
                    )}
                    {isPasswordModalOpen && (
                        <PasswordModal
                            passwords={passwords}
                            onClose={() => setIsPasswordModalOpen(false)}
                            onSave={handleSavePasswords}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
