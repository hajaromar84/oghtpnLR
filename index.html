        // =========================================================================
        // 24-HOUR CENSUS DASHBOARD (8:00 AM – 8:00 AM Live & Previous Shift)
        // =========================================================================
        const CensusView = ({ censusDeliveries, currentTime, canManageLR, onOpenDirectLog, onEditDelivery, onCopySummary }) => {
            const [period, setPeriod] = React.useState('LIVE'); // 'LIVE' | 'PREV'
            const { liveStart, liveEnd, prevStart, prevEnd } = getCensusWindows(currentTime);
            const activeStart = period === 'LIVE' ? liveStart : prevStart;
            const activeEnd = period === 'LIVE' ? liveEnd : prevEnd;

            const filtered = React.useMemo(() => {
                return censusDeliveries
                    .filter(d => {
                        const dt = parseLocalDateTime(d.deliveryTime);
                        if (!dt) return false;
                        return dt.getTime() >= activeStart.getTime() && dt.getTime() < activeEnd.getTime();
                    })
                    .sort((a, b) => {
                        const ta = parseLocalDateTime(a.deliveryTime)?.getTime() || 0;
                        const tb = parseLocalDateTime(b.deliveryTime)?.getTime() || 0;
                        return tb - ta;
                    });
            }, [censusDeliveries, activeStart, activeEnd]);

            // Mode breakdown
            const modeCounts = { SVD: 0, VAD: 0, Forceps: 0, Breech: 0, EMLSCS: 0, ELLSCS: 0, BBA: 0 };
            const indicationCounts = {};
            let pphCount = 0;
            let massivePphCount = 0;

            filtered.forEach(d => {
                const m = normalizeMode(d.deliveryMode);
                modeCounts[m] = (modeCounts[m] || 0) + 1;
                if (isLSCSMode(m)) {
                    const ind = (d.lscsIndication || 'Unspecified').trim();
                    indicationCounts[ind] = (indicationCounts[ind] || 0) + 1;
                }
                const pph = classifyPPH(m, d.ebl);
                if (pph.level === 'MASSIVE') massivePphCount += 1;
                else if (pph.level === 'PPH') pphCount += 1;
            });

            const total = filtered.length;
            const totalLSCS = modeCounts.EMLSCS + modeCounts.ELLSCS;
            const lscsRate = total > 0 ? ((totalLSCS / total) * 100).toFixed(1) : '0.0';
            const totalVaginal = modeCounts.SVD + modeCounts.VAD + modeCounts.Forceps + modeCounts.Breech + modeCounts.BBA;
            const sortedIndications = Object.entries(indicationCounts).sort((a, b) => b[1] - a[1]);

            const handleCopyWhatsApp = () => {
                const headerTitle = period === 'LIVE' ? '📊 *LR LIVE 24H CENSUS*' : '📊 *LR PREVIOUS 24H CENSUS*';
                const lines = [
                    headerTitle,
                    `Window: ${formatWindowLabel(activeStart, activeEnd)}`,
                    `Hospital Tengku Permaisuri Norashikin`,
                    ``,
                    `*Total Deliveries:* ${total}`,
                    `• Vaginal: ${totalVaginal} (SVD ${modeCounts.SVD}, VAD ${modeCounts.VAD}, Forceps ${modeCounts.Forceps}, Breech ${modeCounts.Breech}${modeCounts.BBA ? `, BBA ${modeCounts.BBA}` : ''})`,
                    `• LSCS: ${totalLSCS} (${lscsRate}%) — EMLSCS ${modeCounts.EMLSCS}, ELLSCS ${modeCounts.ELLSCS}`,
                    `• PPH: ${pphCount} | Massive PPH (>1.5L): ${massivePphCount}`
                ];
                if (sortedIndications.length > 0) {
                    lines.push(``, `*LSCS Indications:*`);
                    sortedIndications.forEach(([ind, cnt]) => lines.push(`- ${ind}: ${cnt}`));
                }
                onCopySummary(lines.join('\n'));
            };

            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-5">
                    {/* Top Controls */}
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
                                <button
                                    onClick={() => setPeriod('LIVE')}
                                    className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${period === 'LIVE' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500'}`}
                                >
                                    Live 24h (8am–8am)
                                </button>
                                <button
                                    onClick={() => setPeriod('PREV')}
                                    className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${period === 'PREV' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500'}`}
                                >
                                    Previous 24h (8am–8am)
                                </button>
                            </div>
                            <span className="text-xs font-mono font-semibold text-slate-500 dark:text-slate-400 px-2">
                                {formatWindowLabel(activeStart, activeEnd)}
                            </span>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={handleCopyWhatsApp}
                                className="rounded-xl bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:hover:bg-emerald-900/60 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs font-bold px-3.5 py-2 transition flex items-center gap-1.5"
                            >
                                <i className="ph-bold ph-whatsapp-logo text-sm"></i> Copy WhatsApp Summary
                            </button>
                            {canManageLR && (
                                <button
                                    onClick={onOpenDirectLog}
                                    className="rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold px-3.5 py-2 shadow-sm transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i> Log Direct Delivery / LSCS
                                </button>
                            )}
                        </div>
                    </div>

                    {/* KPI Cards */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                            <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400">Total Deliveries</p>
                            <p className="text-3xl font-extrabold font-mono text-slate-900 dark:text-white mt-1">{total}</p>
                            <p className="text-[11px] text-slate-500 mt-1">Vaginal: {totalVaginal} • LSCS: {totalLSCS}</p>
                        </div>

                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                            <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400">LSCS Rate</p>
                            <p className="text-3xl font-extrabold font-mono text-teal-600 dark:text-teal-400 mt-1">{lscsRate}%</p>
                            <p className="text-[11px] text-slate-500 mt-1">EMLSCS: {modeCounts.EMLSCS} • ELLSCS: {modeCounts.ELLSCS}</p>
                        </div>

                        <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                            <p className="text-[11px] font-bold uppercase tracking-wide text-slate-400">Instrumental &amp; Breech</p>
                            <p className="text-3xl font-extrabold font-mono text-indigo-600 dark:text-indigo-400 mt-1">
                                {modeCounts.VAD + modeCounts.Forceps + modeCounts.Breech}
                            </p>
                            <p className="text-[11px] text-slate-500 mt-1">VAD: {modeCounts.VAD} • Forceps: {modeCounts.Forceps} • Breech: {modeCounts.Breech}</p>
                        </div>

                        <div className={`rounded-2xl border p-4 shadow-sm ${massivePphCount > 0 ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800' : pphCount > 0 ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}>
                            <p className="text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">PPH Alerts</p>
                            <div className="flex items-baseline gap-2.5 mt-1">
                                <span className="text-3xl font-extrabold font-mono text-amber-600 dark:text-amber-400">{pphCount}</span>
                                <span className="text-xs font-bold text-slate-400">PPH</span>
                                <span className="text-3xl font-extrabold font-mono text-rose-600 dark:text-rose-400">{massivePphCount}</span>
                                <span className="text-xs font-bold text-rose-500">Massive</span>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-1">Vag &gt;500mL • CS &gt;1L • Massive &gt;1.5L</p>
                        </div>
                    </div>

                    {/* Mode & LSCS Indication Breakdown */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                        <div className="lg:col-span-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                            <h3 className="text-xs font-extrabold uppercase tracking-wide text-slate-500 mb-3">Mode of Delivery Breakdown</h3>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                {Object.entries(modeCounts).map(([mode, count]) => (
                                    <div key={mode} className="rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-100 dark:border-slate-800 p-2.5 flex items-center justify-between">
                                        <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{mode}</span>
                                        <span className="font-mono text-sm font-extrabold text-teal-600 dark:text-teal-400">{count}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="lg:col-span-7 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
                            <h3 className="text-xs font-extrabold uppercase tracking-wide text-slate-500 mb-3">LSCS Indications ({totalLSCS})</h3>
                            {sortedIndications.length === 0 ? (
                                <p className="text-xs text-slate-400 py-4 text-center">No LSCS cases recorded in this 24-hour window.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {sortedIndications.map(([ind, count]) => (
                                        <div key={ind} className="inline-flex items-center gap-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5">
                                            <span className="text-xs font-semibold text-slate-800 dark:text-slate-100">{ind}</span>
                                            <span className="px-1.5 py-0.5 rounded-md bg-teal-600 text-white font-mono text-[11px] font-bold">{count}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Full 24h Delivery Log Table */}
                    <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                        <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <h3 className="text-sm font-extrabold text-slate-900 dark:text-white">
                                Delivery Log ({filtered.length})
                            </h3>
                            <span className="text-[11px] text-slate-400">Sorted by latest time of birth</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/60 text-[11px] font-bold uppercase tracking-wide text-slate-500 border-b border-slate-200 dark:border-slate-800">
                                        <th className="py-2.5 px-4">Time</th>
                                        <th className="py-2.5 px-4">Patient</th>
                                        <th className="py-2.5 px-4">Source</th>
                                        <th className="py-2.5 px-4">Mode</th>
                                        <th className="py-2.5 px-4">LSCS Indication</th>
                                        <th className="py-2.5 px-4">EBL (mL)</th>
                                        {canManageLR && <th className="py-2.5 px-4 text-right">Action</th>}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                                    {filtered.length === 0 ? (
                                        <tr>
                                            <td colSpan={canManageLR ? 7 : 6} className="py-10 text-center text-slate-400">
                                                No deliveries recorded in this 8am–8am window yet.
                                            </td>
                                        </tr>
                                    ) : (
                                        filtered.map(item => {
                                            const mode = normalizeMode(item.deliveryMode);
                                            const pph = classifyPPH(mode, item.ebl);
                                            const rowBg = pph.level === 'MASSIVE'
                                                ? 'bg-rose-50/90 dark:bg-rose-950/40'
                                                : pph.level === 'PPH'
                                                    ? 'bg-amber-50/80 dark:bg-amber-950/25'
                                                    : 'hover:bg-slate-50/80 dark:hover:bg-slate-800/40';
                                            return (
                                                <tr key={item.id} className={`${rowBg} transition`}>
                                                    <td className="py-3 px-4 font-mono font-bold text-slate-800 dark:text-slate-100 whitespace-nowrap">
                                                        {formatDateTimeDisp(item.deliveryTime)}
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <div className="font-bold text-slate-900 dark:text-white">{item.name}</div>
                                                        {item.ic && <div className="text-[10px] font-mono text-slate-400">{item.ic}</div>}
                                                    </td>
                                                    <td className="py-3 px-4 text-slate-600 dark:text-slate-300 whitespace-nowrap">
                                                        {item.assignedBed || item.location || 'LR'}
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap">
                                                        <span className={`px-2 py-0.5 rounded-lg font-mono text-[11px] font-bold ${isLSCSMode(mode) ? 'bg-indigo-100 dark:bg-indigo-900/60 text-indigo-800 dark:text-indigo-200' : 'bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-200'}`}>
                                                            {mode}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 text-slate-700 dark:text-slate-300">
                                                        {item.lscsIndication || <span className="text-slate-400">—</span>}
                                                    </td>
                                                    <td className="py-3 px-4 whitespace-nowrap">
                                                        <div className="flex items-center gap-1.5">
                                                            <span className={`font-mono font-bold ${pph.level === 'MASSIVE' ? 'text-rose-700 dark:text-rose-300' : pph.level === 'PPH' ? 'text-amber-700 dark:text-amber-300' : 'text-slate-700 dark:text-slate-200'}`}>
                                                                {item.ebl ? `${item.ebl} mL` : '—'}
                                                            </span>
                                                            {pph.level !== 'NONE' && (
                                                                <span className={`px-1.5 py-0.5 rounded-md text-[10px] font-extrabold ${pph.level === 'MASSIVE' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-white'}`}>
                                                                    {pph.label}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    {canManageLR && (
                                                        <td className="py-3 px-4 text-right whitespace-nowrap">
                                                            <button
                                                                onClick={() => onEditDelivery(item)}
                                                                className="rounded-lg bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-[11px] font-bold px-2.5 py-1 transition"
                                                            >
                                                                Edit
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // MAIN APPLICATION COMPONENT
        // =========================================================================
        const App = () => {
            const [userRole, setUserRole] = React.useState(null);
            const [activeView, setActiveView] = React.useState('BOARD'); // 'BOARD' | 'CENSUS'
            const [mobileTab, setMobileTab] = React.useState('BOARD'); // 'QUEUE' | 'BOARD'
            const [queueFilter, setQueueFilter] = React.useState('ALL'); // 'ALL' | 'MINE' | 'HIGH' | 'CALLED'

            const [patients, setPatients] = React.useState([]);
            const [censusDeliveries, setCensusDeliveries] = React.useState([]);
            const [customIndications, setCustomIndications] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('lr_custom_lscs_indications');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [passwords, setPasswords] = React.useState({
                LR: 'lr123', PAC: 'pac123', '7A': '7a123', '7B': '7b123', Admin: 'admin123'
            });

            const [isSyncing, setIsSyncing] = React.useState(false);
            const [darkMode, setDarkMode] = React.useState(false);
            const [tvMode, setTvMode] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const [currentTime, setCurrentTime] = React.useState(Date.now());
            const [toast, setToast] = React.useState(null);

            // Modals & Drawers
            const [isBookingOpen, setIsBookingOpen] = React.useState(false);
            const [updateModalPatient, setUpdateModalPatient] = React.useState(null);
            const [assignBedState, setAssignBedState] = React.useState(null); // { patient, isMove }
            const [deliverModalPatient, setDeliverModalPatient] = React.useState(null);
            const [isDirectDeliveryOpen, setIsDirectDeliveryOpen] = React.useState(false);
            const [isPasswordModalOpen, setIsPasswordModalOpen] = React.useState(false);

            // Traffic cop ref to pause polling right after local edits
            const pauseSyncUntilRef = React.useRef(0);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 30000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const fetchBoardData = React.useCallback(async () => {
                if (!API_URL || Date.now() < pauseSyncUntilRef.current) return;
                try {
                    setIsSyncing(true);
                    const res = await fetch(API_URL);
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setPatients(data);
                    } else {
                        if (Array.isArray(data.patients)) setPatients(data.patients);
                        if (data.passwords) setPasswords(prev => ({ ...prev, ...data.passwords }));
                        if (Array.isArray(data.censusDeliveries)) setCensusDeliveries(data.censusDeliveries);
                        if (Array.isArray(data.learnedIndications) && data.learnedIndications.length > 0) {
                            setCustomIndications(prev => {
                                const map = new Map();
                                [...prev, ...data.learnedIndications].forEach(ind => {
                                    const clean = String(ind || '').trim();
                                    if (clean && !map.has(clean.toLowerCase())) map.set(clean.toLowerCase(), clean);
                                });
                                const merged = Array.from(map.values());
                                try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(merged)); } catch (e) {}
                                return merged;
                            });
                        }
                    }
                } catch (err) {
                    console.error('Sync fetch failed:', err);
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            React.useEffect(() => {
                fetchBoardData();
            }, [fetchBoardData]);

            React.useEffect(() => {
                if (!userRole) return;
                const interval = setInterval(fetchBoardData, 10000);
                return () => clearInterval(interval);
            }, [userRole, fetchBoardData]);

            const syncToDB = (action, payload) => {
                pauseSyncUntilRef.current = Date.now() + 5000;
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                }).catch(err => console.error('Sync POST failed:', err));
            };

            // Self-learning LSCS indications (Built-in + Google Sheet history + Local newly typed)
            const learnIndication = (rawIndication) => {
                const clean = String(rawIndication || '').trim();
                if (!clean) return;
                setCustomIndications(prev => {
                    const exists = [...LSCS_INDICATIONS, ...prev].some(i => i.toLowerCase() === clean.toLowerCase());
                    if (exists) return prev;
                    const next = [...prev, clean];
                    try { localStorage.setItem('lr_custom_lscs_indications', JSON.stringify(next)); } catch (e) {}
                    return next;
                });
            };

            const allLSCSIndications = React.useMemo(() => {
                const map = new Map();
                const fromCensus = censusDeliveries.map(d => d.lscsIndication).filter(Boolean);
                [...LSCS_INDICATIONS, ...customIndications, ...fromCensus].forEach(ind => {
                    const clean = String(ind || '').trim();
                    if (clean && !map.has(clean.toLowerCase())) {
                        map.set(clean.toLowerCase(), clean);
                    }
                });
                return Array.from(map.values());
            }, [customIndications, censusDeliveries]);

            // Patient Mutations
            const upsertPatient = (updated) => {
                setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
                if (updated.deliveryTime) {
                    setCensusDeliveries(prev => {
                        const exists = prev.some(d => d.id === updated.id);
                        return exists ? prev.map(d => d.id === updated.id ? updated : d) : [updated, ...prev];
                    });
                }
                syncToDB('UPDATE', { patient: updated });
            };

            const handleNewBooking = (newPatient) => {
                setPatients(prev => [...prev, newPatient]);
                syncToDB('ADD', { patient: newPatient });
                setIsBookingOpen(false);
                playAlertSound('new_booking', isMuted);
                showToast(`Booked ${newPatient.name} into Waiting Queue.`);
            };

            const handleStatusUpdate = (updatedFields) => {
                const target = patients.find(p => p.id === updatedFields.id);
                if (!target) return;
                const updated = { ...target, ...updatedFields, manualOverride: 0 };
                const oldScore = calculatePriority({ ...target, manualOverride: 0 });
                const newScore = calculatePriority(updated);
                upsertPatient(updated);
                setUpdateModalPatient(null);
                if (updated.status === 'WAITING' && newScore > oldScore + 15) {
                    playAlertSound('critical', isMuted);
                    showToast(`URGENT: ${updated.name} escalated in queue!`, 'warning');
                } else {
                    playAlertSound('update', isMuted);
                    showToast('Clinical VE / CTG updated.');
                }
            };

            const handleConfirmBed = (bed) => {
                const { patient, isMove } = assignBedState;
                if (isMove) {
                    upsertPatient({ ...patient, assignedBed: bed });
                    playAlertSound('update', isMuted);
                    showToast(`Moved ${patient.name} to ${bed}.`);
                } else {
                    upsertPatient({ ...patient, status: 'CALLED', calledToBed: bed, callTime: Date.now() });
                    playAlertSound('called', isMuted);
                    showToast(`${patient.name} called to ${bed}.`);
                }
                setAssignBedState(null);
            };

            const handleWardSend = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'EN_ROUTE', wardSendTime: Date.now(), wardNotedBy: staffName });
                playAlertSound('update', isMuted);
                showToast(`${target.name} marked En Route to LR.`);
            };

            const handleArrived = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'IN_LR', assignedBed: target.calledToBed, admissionTime: Date.now() });
                playAlertSound('update', isMuted);
                showToast(`${target.name} arrived in ${target.calledToBed}.`);
            };

            const handleSendToOT = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, status: 'IN_LR', assignedBed: 'OT' });
                playAlertSound('emergency', isMuted);
                showToast(`URGENT: ${target.name} moved to OT.`, 'warning');
            };

            const handleConfirmDelivery = (deliveryData) => {
                const target = deliverModalPatient;
                if (!target) return;
                const isAlreadyDischarged = target.status === 'DISCHARGED';
                const updated = {
                    ...target,
                    ...deliveryData,
                    status: isAlreadyDischarged ? 'DISCHARGED' : 'DELIVERED'
                };
                setPatients(prev => prev.map(p => p.id === updated.id ? updated : p));
                setCensusDeliveries(prev => {
                    const exists = prev.some(d => d.id === updated.id);
                    return exists ? prev.map(d => d.id === updated.id ? updated : d) : [updated, ...prev];
                });
                syncToDB('UPDATE', { patient: updated });
                if (updated.lscsIndication) learnIndication(updated.lscsIndication);
                setDeliverModalPatient(null);
                showToast('Delivery record saved & synced to 24h Census.');
            };

            const handleDirectDeliverySave = (record) => {
                setCensusDeliveries(prev => [record, ...prev]);
                if (record.lscsIndication) learnIndication(record.lscsIndication);
                syncToDB('ADD_DIRECT_DELIVERY', { patient: record });
                setIsDirectDeliveryOpen(false);
                showToast(`Logged ${record.deliveryMode} for ${record.name} in 24h Census.`);
            };

            const handleTransferToWard = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                const discharged = { ...target, status: 'DISCHARGED' };
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: discharged });
                showToast(`${target.name} transferred to ward. Bed cleared.`);
            };

            const handleCancelBooking = (id) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                setPatients(prev => prev.filter(p => p.id !== id));
                syncToDB('UPDATE', { patient: { ...target, status: 'CANCELLED' } });
                showToast('Booking cancelled.');
            };

            const handleNudge = (id, delta) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, manualOverride: (Number(target.manualOverride) || 0) + delta });
                playAlertSound('update', isMuted);
                showToast(`Priority nudged ${delta > 0 ? 'UP' : 'DOWN'}.`);
            };

            const handleNoteBooking = (id, staffName) => {
                const target = patients.find(p => p.id === id);
                if (!target) return;
                upsertPatient({ ...target, notedBy: staffName, notedTime: Date.now() });
                playAlertSound('update', isMuted);
                showToast(`Acknowledged by ${staffName}.`);
            };

            const handleSavePasswords = (newPasswords) => {
                setPasswords(newPasswords);
                syncToDB('UPDATE_PASSWORDS', { passwords: newPasswords });
                setIsPasswordModalOpen(false);
                showToast('Department passwords updated.');
            };

            // Computed Queues & KPIs
            const waitingAll = React.useMemo(() => {
                return patients
                    .filter(p => p.status === 'WAITING' || p.status === 'CALLED')
                    .sort((a, b) => {
                        if (a.status === 'CALLED' && b.status !== 'CALLED') return -1;
                        if (b.status === 'CALLED' && a.status !== 'CALLED') return 1;
                        if (a.status === 'CALLED' && b.status === 'CALLED') return (a.callTime || 0) - (b.callTime || 0);
                        const diff = calculatePriority(b) - calculatePriority(a);
                        return diff !== 0 ? diff : (a.bookingTime || 0) - (b.bookingTime || 0);
                    });
            }, [patients]);

            const waitingFiltered = React.useMemo(() => {
                return waitingAll.filter(p => {
                    if (queueFilter === 'MINE') return p.location === userRole;
                    if (queueFilter === 'HIGH') return calculatePriority(p) >= 35 || p.ctg !== 'Normal';
                    if (queueFilter === 'CALLED') return p.status === 'CALLED';
                    return true;
                });
            }, [waitingAll, queueFilter, userRole]);

            const activeOccCount = ZONE_ACTIVE_URGENT.filter(b => patients.some(p => p.assignedBed === b && (p.status === 'IN_LR' || p.status === 'DELIVERED'))).length;
            const overflowOccCount = ZONE_OVERFLOW.filter(b => patients.some(p => p.assignedBed === b && (p.status === 'IN_LR' || p.status === 'DELIVERED'))).length;
            const overdueCount = patients.filter(p => {
                if (p.status !== 'IN_LR' || !p.lastVE?.nextReview) return false;
                const d = parseLocalDateTime(p.lastVE.nextReview);
                return d && d.getTime() <= currentTime;
            }).length;

            if (!userRole) {
                return (
                    <LoginScreen
                        onLogin={(role) => {
                            setUserRole(role);
                            getAudioCtx();
                        }}
                        passwords={passwords}
                        darkMode={darkMode}
                        setDarkMode={setDarkMode}
                    />
                );
            }

            const canManageLR = userRole === 'LR' || userRole === 'Admin';

            const renderBed = (bed, compact = false) => {
                const occupant = patients.find(p => p.assignedBed === bed && (p.status === 'IN_LR' || p.status === 'DELIVERED'));
                const incoming = patients.find(p => p.calledToBed === bed && (p.status === 'CALLED' || p.status === 'EN_ROUTE'));
                return (
                    <BedSlot
                        key={bed}
                        bedName={bed}
                        patient={occupant}
                        incoming={incoming}
                        canManageLR={canManageLR}
                        tvMode={tvMode}
                        compact={compact}
                        currentTime={currentTime}
                        onUpdate={() => setUpdateModalPatient(occupant)}
                        onMove={() => setAssignBedState({ patient: occupant, isMove: true })}
                        onDeliver={() => setDeliverModalPatient(occupant)}
                        onEditDelivery={() => setDeliverModalPatient(occupant)}
                        onSendToOT={() => handleSendToOT(occupant?.id)}
                        onClear={() => handleTransferToWard(occupant?.id)}
                        onArrived={handleArrived}
                    />
                );
            };

            return (
                <div className="min-h-screen h-screen flex flex-col bg-slate-50 dark:bg-slate-950 overflow-hidden">
                    {/* TOP NAVIGATION BAR */}
                    <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 shrink-0 z-20">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-sm shrink-0">
                                <i className="ph-fill ph-heartbeat text-xl"></i>
                            </div>
                            <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                    <h1 className="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
                                        LR Smart Board
                                    </h1>
                                    <span className="hidden sm:inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-600 dark:text-emerald-400">
                                        <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : 'bg-emerald-500'}`}></span>
                                        Live
                                    </span>
                                </div>
                                <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate hidden sm:block">
                                    Hospital Tengku Permaisuri Norashikin • {userRole === 'LR' ? 'Labour Room' : userRole === 'Admin' ? 'System Admin' : `Ward ${userRole}`}
                                </p>
                            </div>
                        </div>

                        {/* Center View Switcher: Board | 24h Census */}
                        <div className="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 shrink-0">
                            <button
                                onClick={() => setActiveView('BOARD')}
                                className={`rounded-lg px-3 py-1.5 text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'BOARD' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}
                            >
                                <i className="ph-fill ph-squares-four"></i>
                                <span className="hidden sm:inline">Board</span>
                            </button>
                            <button
                                onClick={() => setActiveView('CENSUS')}
                                className={`rounded-lg px-3 py-1.5 text-xs font-bold transition flex items-center gap-1.5 ${activeView === 'CENSUS' ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}
                            >
                                <i className="ph-fill ph-chart-bar"></i>
                                <span>24h Census</span>
                            </button>
                        </div>

                        {/* Right Controls */}
                        <div className="flex items-center gap-1.5 shrink-0">
                            {activeView === 'BOARD' && (
                                <button
                                    onClick={() => setIsBookingOpen(true)}
                                    className="rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold px-3 py-2 shadow-sm transition flex items-center gap-1.5"
                                >
                                    <i className="ph-bold ph-plus"></i>
                                    <span className="hidden sm:inline">Book Bed</span>
                                </button>
                            )}

                            {userRole === 'Admin' && (
                                <button
                                    onClick={() => setIsPasswordModalOpen(true)}
                                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                    title="Manage Passwords"
                                >
                                    <i className="ph-bold ph-gear"></i>
                                </button>
                            )}

                            <button
                                onClick={() => setTvMode(!tvMode)}
                                className={`hidden lg:flex p-2 rounded-xl transition ${tvMode ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                                title="Toggle TV Wallboard Mode"
                            >
                                <i className="ph-bold ph-television"></i>
                            </button>

                            <button
                                onClick={() => setIsMuted(!isMuted)}
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                title={isMuted ? 'Unmute Chimes' : 'Mute Chimes'}
                            >
                                <i className={`ph-fill ${isMuted ? 'ph-speaker-slash text-rose-500' : 'ph-speaker-high'}`}></i>
                            </button>

                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition"
                                title="Toggle Dark Mode"
                            >
                                <i className={`ph-fill ${darkMode ? 'ph-sun text-amber-400' : 'ph-moon'}`}></i>
                            </button>

                            <button
                                onClick={() => setUserRole(null)}
                                className="p-2 rounded-xl bg-slate-100 hover:bg-rose-50 dark:bg-slate-800 text-slate-500 hover:text-rose-600 transition"
                                title="Logout"
                            >
                                <i className="ph-bold ph-sign-out"></i>
                            </button>
                        </div>
                    </header>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed top-16 right-4 z-50 rounded-2xl px-4 py-3 text-xs font-bold text-white shadow-xl flex items-center gap-2 ${toast.type === 'warning' ? 'bg-rose-600' : toast.type === 'info' ? 'bg-slate-900' : 'bg-teal-600'}`}>
                            <i className={`ph-fill ${toast.type === 'warning' ? 'ph-warning' : 'ph-check-circle'} text-base`}></i>
                            {toast.message}
                        </div>
                    )}

                    {/* MAIN VIEW: BOARD vs 24H CENSUS */}
                    {activeView === 'CENSUS' ? (
                        <CensusView
                            censusDeliveries={censusDeliveries}
                            currentTime={currentTime}
                            canManageLR={canManageLR}
                            onOpenDirectLog={() => setIsDirectDeliveryOpen(true)}
                            onEditDelivery={(item) => setDeliverModalPatient(item)}
                            onCopySummary={(text) => {
                                const ok = copyTextToClipboard(text);
                                showToast(ok ? 'WhatsApp 24h summary copied to clipboard!' : 'Copy failed — please try again.', ok ? 'success' : 'warning');
                            }}
                        />
                    ) : (
                        <>
                            {/* KPI TELEMETRY STRIP */}
                            <div className="bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 px-4 py-2 flex items-center justify-between gap-4 overflow-x-auto shrink-0 text-xs">
                                <div className="flex items-center gap-4 whitespace-nowrap">
                                    <span className="font-semibold text-slate-600 dark:text-slate-300">
                                        Active &amp; Urgent: <strong className="font-mono text-slate-900 dark:text-white">{activeOccCount}/{ZONE_ACTIVE_URGENT.length}</strong>
                                    </span>
                                    <span className="font-semibold text-slate-600 dark:text-slate-300">
                                        Overflow: <strong className="font-mono text-slate-900 dark:text-white">{overflowOccCount}/{ZONE_OVERFLOW.length}</strong>
                                    </span>
                                    <span className="font-semibold text-slate-600 dark:text-slate-300">
                                        Waiting: <strong className="font-mono text-amber-600 dark:text-amber-400">{waitingAll.length}</strong>
                                    </span>
                                    {overdueCount > 0 && (
                                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 font-bold">
                                            <i className="ph-fill ph-warning-circle"></i> {overdueCount} Overdue Review
                                        </span>
                                    )}
                                </div>
                                <div className="font-mono font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap hidden sm:block">
                                    {new Date(currentTime).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}
                                </div>
                            </div>

                            {/* MOBILE TAB BAR (Queue vs Board) */}
                            <div className="lg:hidden grid grid-cols-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
                                <button
                                    onClick={() => setMobileTab('QUEUE')}
                                    className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'QUEUE' ? 'border-teal-600 text-teal-700 dark:text-teal-300' : 'border-transparent text-slate-500'}`}
                                >
                                    Waiting Queue ({waitingAll.length})
                                </button>
                                <button
                                    onClick={() => setMobileTab('BOARD')}
                                    className={`py-2.5 text-xs font-bold border-b-2 transition ${mobileTab === 'BOARD' ? 'border-teal-600 text-teal-700 dark:text-teal-300' : 'border-transparent text-slate-500'}`}
                                >
                                    LR Board (12)
                                </button>
                            </div>

                            {/* SPLIT WORKSPACE */}
                            <div className="flex-1 flex overflow-hidden">
                                {/* LEFT: WAITING QUEUE */}
                                <aside className={`${mobileTab === 'QUEUE' ? 'flex' : 'hidden'} lg:flex flex-col w-full lg:w-[34%] xl:w-[30%] border-r border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-950`}>
                                    <div className="p-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 space-y-2 shrink-0">
                                        <div className="flex items-center justify-between">
                                            <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                                                <i className="ph-fill ph-list-numbers text-teal-600 text-base"></i> Waiting Queue
                                            </h2>
                                            <span className="px-2 py-0.5 rounded-full bg-slate-900 dark:bg-slate-700 text-white font-mono text-[11px] font-bold">
                                                {waitingFiltered.length}
                                            </span>
                                        </div>
                                        <div className="flex gap-1 overflow-x-auto">
                                            {[
                                                { id: 'ALL', label: 'All' },
                                                { id: 'HIGH', label: 'High Risk' },
                                                { id: 'CALLED', label: 'Called' },
                                                ...(!canManageLR ? [{ id: 'MINE', label: `Ward ${userRole}` }] : [])
                                            ].map(f => (
                                                <button
                                                    key={f.id}
                                                    onClick={() => setQueueFilter(f.id)}
                                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition whitespace-nowrap ${queueFilter === f.id ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                                                >
                                                    {f.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                                        {waitingFiltered.length === 0 ? (
                                            <div className="text-center py-12 text-slate-400">
                                                <i className="ph-fill ph-check-circle text-3xl mb-1 opacity-50"></i>
                                                <p className="text-xs font-medium">No patients in this queue view.</p>
                                            </div>
                                        ) : (
                                            waitingFiltered.map((p, idx) => (
                                                <PatientCard
                                                    key={p.id}
                                                    patient={p}
                                                    canManageLR={canManageLR}
                                                    userRole={userRole}
                                                    priorityScore={calculatePriority(p)}
                                                    waitTime={formatDuration(p.bookingTime, currentTime)}
                                                    queueNumber={idx + 1}
                                                    onCall={() => setAssignBedState({ patient: p, isMove: false })}
                                                    onUpdate={() => setUpdateModalPatient(p)}
                                                    onBumpUp={() => handleNudge(p.id, 10)}
                                                    onBumpDown={() => handleNudge(p.id, -10)}
                                                    onCancel={() => handleCancelBooking(p.id)}
                                                    onNoteBooking={handleNoteBooking}
                                                    onWardSend={handleWardSend}
                                                />
                                            ))
                                        )}
                                    </div>
                                </aside>

                                {/* RIGHT: 3-ZONE LABOUR ROOM COMMAND CENTER */}
                                <main className={`${mobileTab === 'BOARD' ? 'flex' : 'hidden'} lg:flex flex-1 flex-col overflow-y-auto custom-scrollbar p-4 space-y-5`}>
                                    {/* Zone 1: Active & Urgent Rooms */}
                                    <section>
                                        <div className="flex items-center justify-between mb-2.5">
                                            <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                                Zone 1 • Active &amp; Urgent Delivery Rooms
                                            </h2>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                                            {ZONE_ACTIVE_URGENT.map(bed => renderBed(bed, false))}
                                        </div>
                                    </section>

                                    {/* Zone 2: Escalation (OT & Isolation) */}
                                    <section>
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                                            Zone 2 • Escalation &amp; Isolation
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {ZONE_ESCALATION.map(bed => renderBed(bed, false))}
                                        </div>
                                    </section>

                                    {/* Zone 3: Post-Delivery Overflow Holding Bay */}
                                    <section>
                                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2.5">
                                            Zone 3 • Overflow Holding Bay
                                        </h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                                            {ZONE_OVERFLOW.map(bed => renderBed(bed, true))}
                                        </div>
                                    </section>
                                </main>
                            </div>
                        </>
                    )}

                    {/* MODALS & DRAWERS */}
                    {isBookingOpen && (
                        <BookingDrawer
                            userWard={userRole}
                            onClose={() => setIsBookingOpen(false)}
                            onSave={handleNewBooking}
                        />
                    )}
                    {updateModalPatient && (
                        <UpdateVEDrawer
                            patient={updateModalPatient}
                            onClose={() => setUpdateModalPatient(null)}
                            onSave={handleStatusUpdate}
                        />
                    )}
                    {assignBedState && (
                        <AssignBedModal
                            patient={assignBedState.patient}
                            isMove={assignBedState.isMove}
                            activePatients={patients}
                            onClose={() => setAssignBedState(null)}
                            onConfirm={handleConfirmBed}
                        />
                    )}
                    {deliverModalPatient && (
                        <DeliveryModal
                            patient={deliverModalPatient}
                            indicationOptions={allLSCSIndications}
                            onClose={() => setDeliverModalPatient(null)}
                            onConfirm={handleConfirmDelivery}
                        />
                    )}
                    {isDirectDeliveryOpen && (
                        <DirectDeliveryModal
                            indicationOptions={allLSCSIndications}
                            onClose={() => setIsDirectDeliveryOpen(false)}
                            onSave={handleDirectDeliverySave}
                        />
                    )}
                    {isPasswordModalOpen && (
                        <PasswordModal
                            passwords={passwords}
                            onClose={() => setIsPasswordModalOpen(false)}
                            onSave={handleSavePasswords}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
