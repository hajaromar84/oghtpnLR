                                    <span className="text-[11px] font-extrabold uppercase tracking-wide text-teal-700 dark:text-teal-400">
                                        Baby &amp; Cord Details
                                    </span>
                                    <span className="text-[10px] text-slate-400">Optional — can edit anytime</span>
                                </div>
                                <div className="grid grid-cols-12 gap-2.5">
                                    <div className="col-span-6">
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Baby Gender</label>
                                        <div className="grid grid-cols-2 gap-1.5">
                                            {['Boy', 'Girl'].map(g => (
                                                <button key={g} type="button" onClick={() => setBabyGender(babyGender === g ? '' : g)} className={`rounded-xl py-1.5 text-xs font-bold border transition ${babyGender === g ? (g === 'Boy' ? 'bg-sky-600 text-white border-sky-600' : 'bg-pink-600 text-white border-pink-600') : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}>
                                                    {g}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="col-span-6">
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Birth Weight (kg)</label>
                                        <input type="number" step="0.01" min="0.2" max="7" value={birthWeight} onChange={(e) => setBirthWeight(e.target.value)} placeholder="e.g. 3.15" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2.5 py-1.5 text-xs font-mono font-bold" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-12 gap-2.5 items-end">
                                    <div className="col-span-7">
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="text-[10px] font-bold uppercase text-slate-500">Apgar (1m / 5m)</label>
                                            <button type="button" onClick={() => { setApgar1('9'); setApgar5('10'); }} className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-teal-100 dark:bg-teal-900/60 text-teal-700 dark:text-teal-300 hover:bg-teal-200 transition">
                                                Quick 9/10
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-1.5">
                                            <input type="number" min="0" max="10" value={apgar1} onChange={(e) => setApgar1(e.target.value)} placeholder="1m" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2.5 py-1.5 text-xs font-mono font-bold text-center" />
                                            <span className="font-mono font-bold text-slate-400">/</span>
                                            <input type="number" min="0" max="10" value={apgar5} onChange={(e) => setApgar5(e.target.value)} placeholder="5m" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-2.5 py-1.5 text-xs font-mono font-bold text-center" />
                                        </div>
                                    </div>
                                    <div className="col-span-5">
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">DCC</label>
                                        <div className="grid grid-cols-2 gap-1.5">
                                            {['Yes', 'No'].map(opt => (
                                                <button key={opt} type="button" onClick={() => setDcc(dcc === opt ? '' : opt)} className={`rounded-xl py-1.5 text-xs font-bold border transition ${dcc === opt ? (opt === 'Yes' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-700 text-white border-slate-700') : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}>
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-2 pt-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold py-2.5 text-xs transition"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-bold py-2.5 text-xs shadow-sm transition"
                                >
                                    Save to Delivery Book
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // SLIDE-OVER BOOKING DRAWER
        // =========================================================================
        const BookingDrawer = ({ userWard, onClose, onSave }) => {
            const [location, setLocation] = React.useState(['PAC', '7A', '7B'].includes(userWard) ? userWard : 'PAC');
            const [admissionType, setAdmissionType] = React.useState('Spontaneous');
            const [iolIndication, setIolIndication] = React.useState('');
            const [iolMethods, setIolMethods] = React.useState([]);
            const [membrane, setMembrane] = React.useState('Intact');
            const [liquor, setLiquor] = React.useState('Clear');
            const [ctg, setCtg] = React.useState('Normal');
            const [veTime, setVeTime] = React.useState(toLocalISOString(roundToNearest5Mins(new Date())));
            const [romTime, setRomTime] = React.useState(toLocalISOString(roundToNearest5Mins(new Date())));
            const [reviewHrs, setReviewHrs] = React.useState(4);
            const [riskFlags, setRiskFlags] = React.useState({ scar: false, gbs: false, epidural: false, hpt: false });

            const toggleMethod = (m) => {
                setIolMethods(prev => prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m]);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const issues = [];
                if (riskFlags.scar) issues.push('1 Prev Scar');
                if (riskFlags.hpt) issues.push('HPT / PE');
                const other = (fd.get('other_issues') || '').trim();
                if (other) other.split(',').forEach(s => { if (s.trim()) issues.push(s.trim()); });

                let finalType = admissionType;
                if (admissionType === 'IOL') {
                    finalType = `IOL - ${iolIndication.trim() || 'Indication'}`;
                    if (iolMethods.length > 0) finalType += ` (${iolMethods.join(' + ')})`;
                }

                const veDate = parseLocalDateTime(veTime) || new Date();
                const nextRev = toLocalISOString(new Date(veDate.getTime() + reviewHrs * 3600000));

                onSave({
                    id: String(Date.now()),
                    name: fd.get('name').trim(),
                    ic: fd.get('ic').trim(),
                    location,
                    bookingTime: Date.now(),
                    bookedBy: fd.get('bookedBy').trim(),
                    notedBy: null,
                    notedTime: null,
                    gravida: fd.get('gravida'),
                    para: fd.get('para'),
                    poa: fd.get('poa').trim(),
                    issues,
                    admissionType: finalType,
                    gbs: riskFlags.gbs,
                    epidural: riskFlags.epidural,
                    lastVE: {
                        time: veTime,
                        dilation: Number(fd.get('veDilation')),
                        cervix: fd.get('veCervix').trim(),
                        nextReview: nextRev
                    },
                    membrane,
                    liquor: membrane === 'Intact' ? 'N/A' : liquor,
                    romTime: membrane === 'Intact' ? null : romTime,
                    ctg,
                    status: 'WAITING',
                    assignedBed: null,
                    deliveryTime: null,
                    manualOverride: 0
                });
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex justify-end">
                    <div className="w-full max-w-xl bg-white dark:bg-slate-900 h-full shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col animate-slide-in">
                        <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                            <div>
                                <h2 className="text-lg font-extrabold text-slate-900 dark:text-white">Book Labour Room Bed</h2>
                                <p className="text-xs text-slate-500">Auto-triaged immediately upon submission</p>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400">
                                <i className="ph-bold ph-x text-lg"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-5">
                            <div className="grid grid-cols-12 gap-3">
                                <div className="col-span-7">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Patient Name</label>
                                    <input required name="name" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500" />
                                </div>
                                <div className="col-span-5">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">IC / MRN</label>
                                    <input required name="ic" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono outline-none focus:ring-2 focus:ring-teal-500" />
                                </div>
                                <div className="col-span-5">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Booked By (Name)</label>
                                    <input required name="bookedBy" placeholder="Dr / SN Name" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-teal-500" />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">G</label>
                                    <input required name="gravida" type="number" min="1" defaultValue="1" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-2.5 py-2 text-sm font-mono" />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">P</label>
                                    <input required name="para" type="number" min="0" defaultValue="0" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-2.5 py-2 text-sm font-mono" />
                                </div>
                                <div className="col-span-3">
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">POA</label>
                                    <input required name="poa" placeholder="39w+2d" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-2.5 py-2 text-sm font-mono" />
                                </div>
                            </div>

                            {['LR', 'Admin'].includes(userWard) && (
                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Origin Ward</label>
                                    <div className="flex gap-2">
                                        {['PAC', '7A', '7B'].map(w => (
                                            <button key={w} type="button" onClick={() => setLocation(w)} className={`flex-1 rounded-xl py-2 text-xs font-bold border ${location === w ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                                                {w}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Admission Type */}
                            <div className="space-y-2.5">
                                <label className="block text-[11px] font-bold uppercase text-slate-500">Admission Type</label>
                                <div className="grid grid-cols-2 gap-2">
                                    {['Spontaneous', 'IOL'].map(t => (
                                        <button key={t} type="button" onClick={() => setAdmissionType(t)} className={`rounded-xl py-2 text-xs font-bold border transition ${admissionType === t ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                                            {t === 'IOL' ? 'IOL (+10 Priority)' : 'Spontaneous'}
                                        </button>
                                    ))}
                                </div>
                                {admissionType === 'IOL' && (
                                    <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-3 space-y-2.5 border border-slate-200 dark:border-slate-700">
                                        <input required value={iolIndication} onChange={(e) => setIolIndication(e.target.value)} placeholder="IOL Indication (e.g. Postdates, GDM)" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-xs" />
                                        <div className="flex flex-wrap gap-1.5">
                                            {['Prostin x1', 'Prostin x2', 'Prostin x3', 'Foley', 'S&S'].map(m => (
                                                <button key={m} type="button" onClick={() => toggleMethod(m)} className={`rounded-lg px-2.5 py-1 text-[11px] font-bold border ${iolMethods.includes(m) ? 'bg-teal-600 text-white border-teal-600' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}>
                                                    {m}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Risk Pills */}
                            <div>
                                <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Clinical Flags &amp; Risks</label>
                                <div className="flex flex-wrap gap-2 mb-2">
                                    {[
                                        { key: 'scar', label: '1 Prev Scar' },
                                        { key: 'gbs', label: 'GBS Positive' },
                                        { key: 'epidural', label: 'Epidural Req.' },
                                        { key: 'hpt', label: 'HPT / PE' }
                                    ].map(flag => (
                                        <button
                                            key={flag.key}
                                            type="button"
                                            onClick={() => setRiskFlags(prev => ({ ...prev, [flag.key]: !prev[flag.key] }))}
                                            className={`rounded-xl px-3 py-1.5 text-xs font-bold border transition ${riskFlags[flag.key] ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}
                                        >
                                            {flag.label}
                                        </button>
                                    ))}
                                </div>
                                <input name="other_issues" placeholder="Other issues (comma separated, e.g. GDM, BMI 34)" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-teal-500" />
                            </div>

                            {/* VE & Partogram */}
                            <div className="rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 p-4 space-y-3.5">
                                <CustomDateTimePicker label="Last VE Date & Time" value={veTime} onChange={setVeTime} required />
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Dilation (cm)</label>
                                        <input required name="veDilation" type="number" min="0" max="10" defaultValue="4" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm font-mono font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Cervix</label>
                                        <input required name="veCervix" defaultValue="1cm, soft" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm" />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Next Review In</label>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        {[1, 2, 3, 4].map(h => (
                                            <button key={h} type="button" onClick={() => setReviewHrs(h)} className={`rounded-xl py-1.5 text-xs font-bold border ${reviewHrs === h ? 'bg-slate-900 dark:bg-teal-600 text-white border-transparent' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}>
                                                +{h}h
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Membranes</label>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        {[
                                            { val: 'Intact', label: 'Intact' },
                                            { val: 'SROM', label: 'SROM' },
                                            { val: 'ARM', label: 'ARM' },
                                            { val: 'PROM_MI', label: 'PROM' }
                                        ].map(m => (
                                            <button key={m.val} type="button" onClick={() => setMembrane(m.val)} className={`rounded-xl py-1.5 text-xs font-bold border ${membrane === m.val ? 'bg-teal-600 text-white border-teal-600' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}>
                                                {m.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {membrane !== 'Intact' && (
                                    <div className="space-y-3 pt-1">
                                        <CustomDateTimePicker label="ROM / ARM Time" value={romTime} onChange={setRomTime} />
                                        <div>
                                            <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Liquor</label>
                                            <div className="flex flex-wrap gap-1.5">
                                                {['Clear', 'LMSL', 'MMSL', 'TMSL', 'Blood stained'].map(l => (
                                                    <button key={l} type="button" onClick={() => setLiquor(l)} className={`rounded-xl px-2.5 py-1.5 text-xs font-bold border ${liquor === l ? (l === 'Clear' ? 'bg-teal-600 text-white border-teal-600' : 'bg-rose-600 text-white border-rose-600') : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}>
                                                        {l}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Current CTG</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['Normal', 'Suspicious', 'Pathological'].map(c => (
                                            <button key={c} type="button" onClick={() => setCtg(c)} className={`rounded-xl py-2 text-xs font-bold border ${ctg === c ? (c === 'Normal' ? 'bg-emerald-600 text-white border-emerald-600' : c === 'Suspicious' ? 'bg-amber-500 text-white border-amber-500' : 'bg-rose-600 text-white border-rose-600') : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}>
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-2.5 pt-2">
                                <button type="button" onClick={onClose} className="flex-1 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold py-3 text-sm transition">
                                    Cancel
                                </button>
                                <button type="submit" className="flex-1 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 text-sm shadow-md transition">
                                    Submit Booking
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // SLIDE-OVER VE / STATUS UPDATE DRAWER
        // =========================================================================
        const UpdateVEDrawer = ({ patient, onClose, onSave }) => {
            const [veTime, setVeTime] = React.useState(toLocalISOString(roundToNearest5Mins(new Date())));
            const [dilation, setDilation] = React.useState(patient.lastVE?.dilation ?? 4);
            const [cervix, setCervix] = React.useState(patient.lastVE?.cervix || '');
            const [reviewHrs, setReviewHrs] = React.useState(4);
            const [membrane, setMembrane] = React.useState(patient.membrane || 'Intact');
            const [liquor, setLiquor] = React.useState(patient.liquor && patient.liquor !== 'N/A' ? patient.liquor : 'Clear');
            const [romTime, setRomTime] = React.useState(patient.romTime ? toLocalISOString(patient.romTime) : toLocalISOString(roundToNearest5Mins(new Date())));
            const [ctg, setCtg] = React.useState(patient.ctg || 'Normal');

            const handleSubmit = (e) => {
                e.preventDefault();
                const veDate = parseLocalDateTime(veTime) || new Date();
                const nextRev = toLocalISOString(new Date(veDate.getTime() + reviewHrs * 3600000));
                onSave({
                    id: patient.id,
                    lastVE: { time: veTime, dilation: Number(dilation), cervix: cervix.trim(), nextReview: nextRev },
                    membrane,
                    liquor: membrane === 'Intact' ? 'N/A' : liquor,
                    romTime: membrane === 'Intact' ? null : romTime,
                    ctg
                });
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex justify-end">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 h-full shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col animate-slide-in">
                        <div className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <div>
                                <h2 className="text-lg font-extrabold text-slate-900 dark:text-white">Update VE &amp; CTG</h2>
                                <p className="text-xs text-slate-500">{patient.name}</p>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400">
                                <i className="ph-bold ph-x text-lg"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-4">
                            <CustomDateTimePicker label="VE Date & Time" value={veTime} onChange={setVeTime} required />

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Os Dilation (cm)</label>
                                    <input required type="number" min="0" max="10" value={dilation} onChange={(e) => setDilation(e.target.value)} className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono font-bold" />
                                </div>
                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">Cervix</label>
                                    <input required value={cervix} onChange={(e) => setCervix(e.target.value)} className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Next Review Timer</label>
                                <div className="grid grid-cols-4 gap-1.5">
                                    {[1, 2, 3, 4].map(h => (
                                        <button key={h} type="button" onClick={() => setReviewHrs(h)} className={`rounded-xl py-2 text-xs font-bold border ${reviewHrs === h ? 'bg-slate-900 dark:bg-teal-600 text-white border-transparent' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`}>
                                            +{h}h
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1.5">Membranes</label>
                                <div className="grid grid-cols-4 gap-1.5">

        // =========================================================================
        // 24-HOUR CENSUS DASHBOARD (8:00 AM – 8:00 AM Live & Previous Shift)
        // =========================================================================
        const CensusView = ({ censusDeliveries, currentTime, canManageLR, onOpenDirectLog, onEditDelivery, onCopySummary }) => {
            const [period, setPeriod] = React.useState('LIVE'); // 'LIVE' | 'PREV'

            const filtered = React.useMemo(() => {

                        const tb = parseLocalDateTime(b.deliveryTime)?.getTime() || 0;
                        return tb - ta;

            // Mode breakdown
            const modeCounts = { SVD: 0, VAD: 0, Forceps: 0, Breech: 0, EMLSCS: 0, ELLSCS: 0, BBA: 0 };
            const indicationCounts = {};

            let massivePphCount = 0;

            filtered.forEach(d => {

                const pph = classifyPPH(m, d.ebl);

            const total = filtered.length;

                    lines.push(``, `*LSCS Indications:*`);

                    {/* KPI Cards */}

                        <div className={`rounded-2xl border p-4 shadow-sm ${massivePphCount > 0 ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800' : pphCount > 0 ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`}>
                            <p className="text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">PPH Alerts</p>
                            <div className="flex items-baseline gap-2.5 mt-1">
                                <span className="text-3xl font-extrabold font-mono text-amber-600 dark:text-amber-400">{pphCount}</span>
                                <span className="text-xs font-bold text-slate-400">PPH</span>
                                <span className="text-3xl font-extrabold font-mono text-rose-600 dark:text-rose-400">{massivePphCount}</span>

                                {Object.entries(modeCounts).map(([mode, count]) => (

                                        <span className="text-xs font-bold text-slate-700 dark:text-slate-200">{mode}</span>

                    {/* Full 24h Delivery Log Table */}
                    <div className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                        <div className="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">

                                        <tr>

                                                No deliveries recorded in this 8am–8am window yet.
                                            </td>

                                        filtered.map(item => {
                                            const mode = normalizeMode(item.deliveryMode);
                                            const pph = classifyPPH(mode, item.ebl);
                                            const rowBg = pph.level === 'MASSIVE'
                                                ? 'bg-rose-50/90 dark:bg-rose-950/40'
                                                : pph.level === 'PPH'
                                                    ? 'bg-amber-50/80 dark:bg-amber-950/25'
                                                    : 'hover:bg-slate-50/80 dark:hover:bg-slate-800/40';
                                            const apgarDisp = (item.apgar1 !== undefined && item.apgar1 !== '' && item.apgar5 !== undefined && item.apgar5 !== '')
                                                ? `${item.apgar1}/${item.apgar5}`
                                                : (item.apgar || '');
                                            return (
                                                <tr key={item.id} className={`${rowBg} transition`}>

                                                                        DCC:{item.dcc}
